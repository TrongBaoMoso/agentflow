<title>Hot leads call request</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
/* Layout: the real Hot leads table (Recruit design-2026), three variants switched by tabs. */
:root{
  --bg:#f9f7f4; --surface:#ffffff; --fg:#1f1c1a; --muted:#78716c; --line:#e7e2dc;
  --orange:#c44f06; --orange-tint:#fdf1e9;
  --blue:#1d4ed8; --blue-tint:#eaf1ff; --blue-line:#bfd3ff;
  --green:#15803d; --green-tint:#e7f6ec;
  --red:#b91c1c; --red-tint:#fdecec; --amber:#a16207; --amber-tint:#fdf6e3;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171513; --surface:#211e1b; --fg:#efeae5; --muted:#a8a29e; --line:#37322e;
  --orange:#f08a4b; --orange-tint:#3a2518; --blue:#8fb2ff; --blue-tint:#1b2540; --blue-line:#2e4170;
  --green:#7fd09b; --green-tint:#1b3124; --red:#f19a9a; --red-tint:#3a1f1f; --amber:#e7c46a; --amber-tint:#3a2f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171513; --surface:#211e1b; --fg:#efeae5; --muted:#a8a29e; --line:#37322e;
  --orange:#f08a4b; --orange-tint:#3a2518; --blue:#8fb2ff; --blue-tint:#1b2540; --blue-line:#2e4170;
  --green:#7fd09b; --green-tint:#1b3124; --red:#f19a9a; --red-tint:#3a1f1f; --amber:#e7c46a; --amber-tint:#3a2f17; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1{font-size:24px;font-weight:500;margin:0}
p{margin:0;max-width:75ch}
.note{color:var(--muted)}
.variants{display:flex;gap:8px;flex-wrap:wrap}
.variants button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer}
.variants button[aria-pressed="true"]{border-color:var(--orange);color:var(--orange);background:var(--orange-tint)}
.variants button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.explain{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:grid;gap:4px}
.explain b{font-weight:500}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--surface);font-size:13px;color:var(--muted)}
.tab b{font-weight:500;color:var(--fg);margin-left:6px}
.tab.on{border-color:var(--fg);color:var(--fg)}
.tab.call{border-color:var(--blue-line);color:var(--blue);background:var(--blue-tint)}
.tab.call b{color:var(--blue)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:860px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.cand{display:flex;gap:10px}
.av{width:28px;height:28px;border-radius:50%;background:var(--orange-tint);color:var(--orange);display:grid;place-items:center;font-size:11px;font-weight:500;flex:none}
.name{font-weight:500}
.sub{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;white-space:nowrap}
.pill.green{background:var(--green-tint);color:var(--green)}
.pill.blue{background:var(--blue-tint);color:var(--blue)}
.pill.red{background:var(--red-tint);color:var(--red)}
.pill.amber{background:var(--amber-tint);color:var(--amber)}
.pill.grey{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.callchip{display:inline-grid;gap:1px;margin-top:6px;background:var(--blue-tint);color:var(--blue);border:1px solid var(--blue-line);border-radius:8px;padding:4px 8px;font-size:12px}
.callchip .t{font-weight:500}
.claim{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px;color:var(--fg)}
tr.req td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
tr.req td{background:color-mix(in srgb,var(--blue-tint) 55%,var(--surface))}
.divider td{background:var(--bg);font-size:12px;color:var(--muted);padding:6px 12px}
.old{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--blue-tint);color:var(--blue);display:inline-block;margin-top:4px}
[hidden]{display:none!important}
</style>

<div class="wrap">
  <h1>Hot leads · lead có yêu cầu gọi</h1>
  <p class="note">Dựng lại từ màn Hot leads thật (recruit.viet18.com/inbox/hot, tìm "Joinv2"). Chỉ phần đánh dấu xanh là mới. Bấm để đổi phương án.</p>

  <div class="variants" role="group" aria-label="Phương án">
    <button id="v0" type="button" data-v="0">Hiện tại (staging)</button>
    <button id="v1" type="button" data-v="1">PA1 · Sửa nhãn</button>
    <button id="v2" type="button" data-v="2" aria-pressed="true">PA2 · Viền + nhãn rõ + lọc</button>
    <button id="v3" type="button" data-v="3">PA3 · PA2 + đưa lên đầu</button>
  </div>

  <div class="explain" id="ex"></div>

  <div class="tabs">
    <span class="tab on">All<b>11</b></span><span class="tab">Overdue<b>7</b></span><span class="tab">Due soon<b>4</b></span><span class="tab">On time<b>0</b></span>
    <span class="tab call" data-only="2,3">☎ Call requested<b>3</b></span>
  </div>

  <div class="tbl-wrap"><table>
    <thead><tr><th>Candidate</th><th>Source</th><th>Production · last 14 mo</th><th>Waiting</th><th>First-touch due</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div>

<script>
const L=[
 {n:"Qa Joinv2",nm:"NMLS 1234566",src:"Web form",w:"20h 22m",wt:"Yesterday · 4:30am",due:"Overdue 19h 22m",dt:"Yesterday · 5:39am",dc:"red"},
 {n:"Qa Joinv2",nm:"NMLS 1234569",src:"Referral",by:"Invited by Penny Public",w:"20h 06m",wt:"Yesterday · 4:54am",due:"Overdue 1h 06m",dt:"Yesterday · 11:54pm",dc:"red"},
 {n:"Qa Joinv2",nm:"NMLS 1234571",src:"Web form",w:"8h 07m",wt:"Yesterday · 4:54pm",due:"In 1h 59m",dt:"Today · 3:00am",dc:"amber",call:{next:"Mon 9–11 AM",all:"Mon 9–11 AM · Tue 1–3 PM",more:1,soon:false}},
 {n:"Qa Joinv2",nm:"NMLS 1234570",src:"Web form",w:"18h 40m",wt:"Yesterday · 6:21am",due:"Overdue 17h 40m",dt:"Yesterday · 7:21am",dc:"red"},
 {n:"Qa Joinv2",nm:"NMLS 1234572",src:"Web form",w:"2h 10m",wt:"Today · 10:51pm",due:"In 3h 50m",dt:"Today · 4:50am",dc:"amber",call:{asap:true,next:"",all:"",more:0,soon:true}},
 {n:"Qa Joinv2",nm:"NMLS 1234570",src:"Referral",by:"Invited by Checking Kakakaka Firstime…",w:"18h 39m",wt:"Yesterday · 6:22am",due:"In 20m",dt:"Today · 1:22am",dc:"amber"},
 {n:"Qa Joinv2",nm:"NMLS 1234573",src:"Web form",w:"1h 05m",wt:"Today · 11:56pm",due:"In 3h 55m",dt:"Today · 4:55am",dc:"amber",call:{next:"Today 2–4 PM",all:"Today 2–4 PM · Tue 9–11 AM · Wed 3–5 PM",more:2,soon:true}},
 {n:"Qa Joinv2",nm:"NMLS 1234571",src:"Web form",w:"8h 07m",wt:"Yesterday · 4:54pm",due:"In 1h 59m",dt:"Today · 3:00am",dc:"amber"}
];
const EX={
 0:"<b>Hiện tại:</b> nhãn chỉ có khung gần nhất + \"+1\" (khó hiểu), dòng trông như mọi lead khác.",
 1:"<b>PA1:</b> bỏ \"+1\", ghi đủ mọi khung giờ; dòng vẫn như cũ, không lọc, không đổi thứ tự.",
 2:"<b>PA2 (đề xuất):</b> dòng có viền trái xanh + nền xanh rất nhạt; nhãn ☎ ghi đủ khung giờ (giờ của recruiter) hoặc \"Call ASAP\"; thêm tab lọc \"☎ Call requested\" cạnh All/Overdue/Due soon. Thứ tự giữ nguyên.",
 3:"<b>PA3:</b> như PA2, và lead có ASAP hoặc khung giờ trong 24h tới tự lên đầu danh sách, sắp theo giờ gần nhất; các lead còn lại giữ thứ tự cũ."
};
function chip(c,v){
  if(!c) return "";
  if(v===0) return `<div class="old">● Call requested · ${c.asap?"ASAP":c.next}${c.more?" +"+c.more:""}</div>`;
  const t=c.asap?"☎ Call ASAP":"☎ Call requested";
  const s=c.asap?"Any time, as soon as you can":c.all;
  return `<div class="callchip"><span class="t">${t}</span><span>${s}</span></div>`;
}
function row(r,v){
  const req=r.call&&v>=2;
  const src=r.src==="Referral"?`<span class="pill blue">Referral</span><div class="sub">${r.by}</div>`:`<span class="pill green">Web form</span>`;
  return `<tr class="${req?"req":""}"><td><div class="cand"><span class="av">QJ</span><div><div class="name">${r.n}</div><div class="sub">${r.nm}</div><span class="pill grey">No loan figures yet</span></div></div></td>
  <td>${src}${chip(r.call,v)}</td><td>—</td>
  <td><div class="name">${r.w}</div><span class="pill grey">◷ ${r.wt}</span></td>
  <td><div class="name" style="color:var(--${r.dc==="red"?"red":"amber"})">${r.due}</div><span class="pill ${r.dc}">⧗ ${r.dt}</span></td>
  <td><button class="claim" type="button">Claim</button></td></tr>`;
}
function render(v){
  document.querySelectorAll(".variants button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.v===v)));
  document.getElementById("ex").innerHTML=EX[v];
  document.querySelectorAll("[data-only]").forEach(e=>e.hidden=!e.dataset.only.split(",").includes(String(v)));
  let list=L.slice(), html="";
  if(v===3){
    const top=list.filter(r=>r.call&&(r.call.asap||r.call.soon)).sort((a,b)=>(b.call.asap?1:0)-(a.call.asap?1:0));
    const rest=list.filter(r=>!top.includes(r));
    html=top.map(r=>row(r,v)).join("")+`<tr class="divider"><td colspan="6">Other hot leads</td></tr>`+rest.map(r=>row(r,v)).join("");
  } else html=list.map(r=>row(r,v)).join("");
  document.getElementById("rows").innerHTML=html;
}
document.querySelectorAll(".variants button").forEach(b=>b.addEventListener("click",()=>render(+b.dataset.v)));
render(2);
</script>
