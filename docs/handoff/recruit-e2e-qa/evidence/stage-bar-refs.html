<style>
/* Layout: one reading column; each reference is a figure (screenshot + where it lives + what it does) */
:root{--bg:#f6f4f0;--panel:#fff;--ink:#1f1d1a;--muted:#6a645c;--line:#e4dfd7;--accent:#e4642a;--done:#2f8a57;--skip:#b9b2a7;
 --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171513;--panel:#211e1b;--ink:#ece7e0;--muted:#a59d92;--line:#36312c;--accent:#f0824f;--done:#5cc48a;--skip:#6d665d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171513;--panel:#211e1b;--ink:#ece7e0;--muted:#a59d92;--line:#36312c;--accent:#f0824f;--done:#5cc48a;--skip:#6d665d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);padding-inline:16px;padding-block:28px 56px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-size:1.5rem;margin:0;text-wrap:balance}
h2{font-size:1.1rem;margin:0 0 6px;text-wrap:balance}
p{margin:0;max-width:70ch}
.muted{color:var(--muted)}
code{font-family:var(--f-mono);font-size:.84em;background:color-mix(in srgb,var(--accent) 10%,transparent);padding:1px 5px;border-radius:4px;word-break:break-word}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
figure img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
figcaption{display:flex;flex-direction:column;gap:2px}
.tag{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.pick{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mock{display:flex;align-items:flex-start;overflow-x:auto;padding:6px 2px 2px}
.st{flex:1 0 74px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:.78rem;text-align:center}
.st::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.st:first-child::before{display:none}
.st.done::before,.st.skip::before,.st.cur::before{background:var(--done)}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 .78rem var(--f-mono);background:var(--panel);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1}
.done .dot{background:var(--done);border-color:var(--done);color:#fff}
.skip .dot{border-style:dashed;border-color:var(--skip);color:var(--skip);background:var(--panel)}
.cur .dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.cur .lb{font-weight:700;color:var(--accent)}
.skip .lb{color:var(--skip)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
</style>

<header style="display:flex;flex-direction:column;gap:6px">
  <h1>Thanh stage của ứng viên: hiện tại và các mẫu tham khảo</h1>
  <p class="muted">Ảnh chụp trên staging ngày 06/10. Không có component stepper dùng chung trong thư viện TERA (tera-components) — mỗi app tự làm, nên recruit chỉ có thể chép lại mẫu.</p>
</header>

<figure>
  <figcaption><span class="pick">Hiện tại · recruit</span><h2>Drawer ứng viên ở S6</h2>
