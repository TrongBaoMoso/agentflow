<title>Recruit E2E Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a field manual for one QA run — sticky control bar (who / view / language), section index on the left, each case is a self-contained card: resources first, then numbered checks with per-tester stamps */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --panel2:#f8faf7; --ink:#18201d; --muted:#5a6762; --line:#d9dfda;
  --accent:#1d5e86; --accent-soft:#e1edf5; --accent-ink:#ffffff;
  --pass:#1e7549; --pass-soft:#dff2e7; --fail:#b02a20; --fail-soft:#fbe5e2; --skip:#86691a; --skip-soft:#f5eed6;
  --bug:#73399a; --bug-soft:#efe5f6; --claude:#9a4d14; --claude-soft:#f7e9dd;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --panel:#19201d; --panel2:#151b19; --ink:#e3e9e5; --muted:#98a6a0; --line:#2b3531;
  --accent:#72b2de; --accent-soft:#1b2c37; --accent-ink:#0f1a22;
  --pass:#5ecf94; --pass-soft:#15291e; --fail:#f0897e; --fail-soft:#331a18; --skip:#dfc169; --skip-soft:#2c2615;
  --bug:#c69ae6; --bug-soft:#291e32; --claude:#efa36a; --claude-soft:#2e2116; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --panel:#19201d; --panel2:#151b19; --ink:#e3e9e5; --muted:#98a6a0; --line:#2b3531;
  --accent:#72b2de; --accent-soft:#1b2c37; --accent-ink:#0f1a22;
  --pass:#5ecf94; --pass-soft:#15291e; --fail:#f0897e; --fail-soft:#331a18; --skip:#dfc169; --skip-soft:#2c2615;
  --bug:#c69ae6; --bug-soft:#291e32; --claude:#efa36a; --claude-soft:#2e2116; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 64px}
a{color:var(--accent)}
code,.mono{font-family:var(--f-mono);font-size:.86em}
code{background:var(--accent-soft);padding:1px 5px;border-radius:4px;word-break:break-all}
.wrap{max-width:1200px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
h1{font-size:1.3rem;margin:0;font-weight:700;letter-spacing:-.01em}
.env{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:.82rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:5px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select.view,input.search{font:inherit;font-size:.84rem;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);min-width:0}
input.search{width:min(220px,100%)}
.me{font-size:.82rem;color:var(--muted)} .me b{color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;margin-top:10px}
.bar i{display:block;height:100%}
.bar .p{background:var(--pass)} .bar .f{background:var(--fail)} .bar .s{background:var(--skip)}
.counts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.counts b{color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:3px 11px;font:inherit;font-size:.8rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sync{font-size:.78rem;color:var(--muted)} .sync.warn{color:var(--skip)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px;margin-top:20px}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.nav{display:none}}
.nav{position:sticky;top:190px;align-self:start;display:flex;flex-direction:column;gap:1px;font-size:.85rem;max-height:calc(100vh - 210px);overflow:auto}
.nav a{text-decoration:none;color:var(--ink);padding:4px 8px;border-radius:6px;display:flex;justify-content:space-between;gap:8px}
.nav a:hover{background:var(--accent-soft)}
.nav .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .grp{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 8px 2px;font-weight:600}
main{min-width:0;display:flex;flex-direction:column;gap:34px}
section h2{font-size:1.14rem;margin:0 0 6px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;text-wrap:balance}
section h2 .code{font-family:var(--f-mono);color:var(--accent);font-size:.9rem}
h3.sub{margin:14px 0 6px;font-size:.98rem}
.intro{color:var(--muted);margin:0 0 12px;max-width:76ch}
.role{display:inline-block;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:4px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.ref{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.mono,td .mono{white-space:nowrap}
.case{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.case .lbl{margin:0;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.goal{margin:0;max-width:80ch}
.who{display:flex;flex-wrap:wrap;gap:6px}
ul.prep,ol.prep{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.9rem;max-width:84ch}
.res{border:1px dashed var(--line);border-radius:var(--r);background:var(--panel2);padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.res details{border-top:1px solid var(--line);padding-top:8px}
.res details:first-of-type{border-top:0;padding-top:0}
.res summary{cursor:pointer;font-weight:600;font-size:.9rem}
.res .body{margin-top:8px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);gap:4px 12px;font-size:.88rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0;word-break:break-word}
.cp{font:inherit;font-size:.7rem;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:5px;padding:0 6px;margin-left:6px;cursor:pointer;vertical-align:1px}
.cp:hover{color:var(--accent);border-color:var(--accent)}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item[data-st="pass"]{box-shadow:inset 3px 0 var(--pass)}
.item[data-st="fail"]{box-shadow:inset 3px 0 var(--fail)}
.item[data-st="skip"]{box-shadow:inset 3px 0 var(--skip)}
.stamps{display:flex;gap:4px;align-self:start}
.stamp{min-width:40px;height:30px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 .74rem var(--f-body);cursor:pointer;padding:0 6px}
.stamp.p[aria-pressed="true"]{background:var(--pass-soft);border-color:var(--pass);color:var(--pass)}
.stamp.f[aria-pressed="true"]{background:var(--fail-soft);border-color:var(--fail);color:var(--fail)}
.stamp.s[aria-pressed="true"]{background:var(--skip-soft);border-color:var(--skip);color:var(--skip)}
.stamp:disabled{cursor:not-allowed;opacity:.45}
.ib{min-width:0}
.sid{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-right:6px}
.login{font-size:.8rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}.login code{font-size:.78rem}
.act{font-weight:500;margin-top:2px}
.exp{color:var(--muted);font-size:.9rem;margin-top:3px}
.exp b.k{color:var(--ink)}
.bug{display:inline-block;margin-top:5px;font-size:.78rem;color:var(--bug);background:var(--bug-soft);border-radius:4px;padding:2px 7px}
.meta{font-size:.76rem;color:var(--muted);margin-top:4px}
.others{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.oc{font-size:.72rem;border-radius:99px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc.pass{color:var(--pass);border-color:var(--pass);background:var(--pass-soft)}
.oc.fail{color:var(--fail);border-color:var(--fail);background:var(--fail-soft)}
.oc.skip{color:var(--skip);border-color:var(--skip);background:var(--skip-soft)}
.oc.claude{border-style:dashed}
.note{width:100%;margin-top:6px;font:inherit;font-size:.86rem;background:transparent;color:var(--ink);border:1px dashed var(--line);border-radius:6px;padding:5px 8px;resize:vertical;min-height:32px}
.note:focus{border-style:solid;border-color:var(--accent)}
.hidden-note .note{display:none}
.hidden-note .item[data-st="fail"] .note,.hidden-note .item.has-note .note{display:block}
.addnote{background:none;border:0;color:var(--accent);font:inherit;font-size:.78rem;cursor:pointer;padding:0;margin-top:4px}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:.88rem;max-width:88ch}
.callout.warn{border-color:var(--skip);background:var(--skip-soft)}
.callout.bad{border-color:var(--fail);background:var(--fail-soft)}
.callout.cl{border-color:var(--claude);background:var(--claude-soft)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;border-radius:99px;padding:1px 8px;white-space:nowrap}
.exp .pill,.act .pill{white-space:normal;max-width:100%}
.pill.ok{background:var(--pass-soft);color:var(--pass)} .pill.no{background:var(--fail-soft);color:var(--fail)} .pill.mid{background:var(--skip-soft);color:var(--skip)} .pill.cl{background:var(--claude-soft);color:var(--claude)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.grid2>div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:.88rem;min-width:0}
.grid2 b{display:block;margin-bottom:2px}
form.run{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:12px}
form.run input,form.run select,form.run textarea{font:inherit;font-size:.86rem;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:100%;min-width:0}
form.run textarea{grid-column:1/-1;min-height:54px}
.btn{font:inherit;font-weight:600;font-size:.86rem;padding:8px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.empty{color:var(--muted);font-size:.86rem;padding:10px 0}
.res-pass{color:var(--pass);font-weight:600}.res-fail{color:var(--fail);font-weight:600}.res-partial{color:var(--skip);font-weight:600}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.78rem}
.del:hover{color:var(--fail)}
.lockbar{display:none;margin-top:8px}
.lockbar.on{display:block}
.toast{max-width:calc(100vw - 32px);position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:.86rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
mark{background:var(--skip-soft);color:inherit;border-radius:3px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
td.links{white-space:nowrap}
@media (max-width:900px){.nav{display:none}}
@media (max-width:700px){header.top{position:static}.ctl{margin-left:0;width:100%}input.search{flex:1 1 140px;width:auto}main{gap:26px}.case{padding:12px}.item{grid-template-columns:minmax(0,1fr)}.stamps{order:2}}
</style>
<div class="wrap">
<header class="top">
  <div class="top-row">
    <h1 id="h1">Recruit E2E Lab</h1>
    <span class="env" id="envline"></span>
    <div class="ctl">
      <span class="me" id="me"></span>
      <select class="view" id="view" aria-label="View"></select>
      <input class="search" id="q" type="search" aria-label="Search" placeholder="">
      <div class="seg" role="group" aria-label="Language"><button id="lang-vi" aria-pressed="true">VI</button><button id="lang-en" aria-pressed="false">EN</button></div>
    </div>
  </div>
  <div class="bar" aria-hidden="true"><i class="p" id="barP"></i><i class="f" id="barF"></i><i class="s" id="barS"></i></div>
  <div class="counts" id="counts"></div>
  <div class="filters" role="group" id="filters"></div>
  <div class="lockbar callout warn" id="lockbar"></div>
</header>
<div class="layout">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cp = (v) => `<button class="cp" type="button" data-copy="${esc(v)}" aria-label="copy">⧉</button>`;
// ---------- shared data ----------
const META = { env: { vi: "STAGING · bản 10/10: recruit-be c0db3260 · recruit-fe 986569f0 (cả hai đã lên production 10/10 ~02:30 VN) · 6 stage BẬT · Inkless BẬT", en: "STAGING · as of 10/10: recruit-be c0db3260 · recruit-fe 986569f0 (both promoted to production 10/10 ~02:30 VN) · 6 stages ON · Inkless ON" } };

const WHO = {
  LO: { vi: "LO (bạn, không đăng nhập)", en: "LO (you, no login)" },
  REC: { vi: "Recruiter", en: "Recruiter" }, REC2: { vi: "Recruiter thứ hai", en: "Second recruiter" }, RECSMS: { vi: "Recruiter có Zoom", en: "Recruiter with Zoom" },
  MGR: { vi: "Manager", en: "Manager" }, ONB: { vi: "Onboarding", en: "Onboarding" }, ONBG: { vi: "Onboarding có Google", en: "Onboarding with Google" },
  HH: { vi: "Headhunter", en: "Headhunter" }, ADMIN: { vi: "Admin", en: "Admin" }, HR: { vi: "HR (HR app)", en: "HR (HR app)" },
  ANY: { vi: "Mọi vai", en: "Any role" }, DEV: { vi: "Nhờ dev / Claude", en: "Ask dev / Claude" },
  TL: { vi: "Team lead", en: "Team lead" }, OFR: { vi: "Officer recruiter", en: "Officer recruiter" }, LOS: { vi: "LO support", en: "LO support" },
  RHR: { vi: "HR (vai recruit)", en: "HR (recruit role)" }, LIC: { vi: "Licensing", en: "Licensing" }, ACCT: { vi: "Accounting", en: "Accounting" },
  ONBP: { vi: "Onboarding thuần", en: "Pure Onboarding" }, NG: { vi: "Đăng nhập, không có quyền recruit", en: "Signed in, no recruit grant" }
};

const ACC = {
  rec: { email: "bao.trinh+recruiter@loanfactory.com", label: WHO.REC,
    use: { vi: "“QA Test Recruiter”. Recruiter chính cho hầu hết case. Có branch MOSO. Không có Zoom nên không gửi SMS / gọi Zoom được.", en: "“QA Test Recruiter”. Main recruiter for most cases. Has a MOSO branch. No Zoom, so no SMS / Zoom calls." } },
  recSms: { email: "manhadmin@viet18.com", label: WHO.RECSMS,
    use: { vi: "“Manh Admin”. Recruiter duy nhất có Zoom (gửi SMS, gọi Zoom — đường dây (408) 538-1464 trên Mac). Luôn giữ vai RECRUITER. Chủ LO TRINH VU TRONG BAO. Dùng cho case G, Y, OM9 và làm recruiter thứ hai (case I, Y3).", en: "“Manh Admin”. The only recruiter with Zoom (SMS, Zoom calls — line (408) 538-1464 on the Mac). Always stays RECRUITER. Owns LO TRINH VU TRONG BAO. Use for cases G, Y, OM9 and as the second recruiter (I, Y3)." } },
  mgr: { email: "bao.trinh+manager@loanfactory.com", label: WHO.MGR,
    use: { vi: "“QA Test Manager”. Duyệt offer ở My work today → “Waiting on your decision”, Exceptions, Remind, Take back, Reassign, Audit, Duplicates, Dormant → Revive, gán specialist. Không có MOSO Admin (ghi sang MOSO bằng tài khoản này có thể 401 — staging có thử lại bằng tài khoản hệ thống, m4eyx).", en: "“QA Test Manager”. Approves offers on My work today → “Waiting on your decision”, Exceptions, Remind, Take back, Reassign, Audit, Duplicates, Dormant → Revive, assigns specialists. No MOSO Admin (MOSO writes from it may 401 — staging retries as system, m4eyx)." } },
  onb: { email: "bao.trinh+onb-test@loanfactory.com", label: WHO.ONB,
    use: { vi: "Onboarding specialist “ONB Test Specialist LF”: Team queue, 1-1, Done…, tick tiến độ, nhắn LO của chính mình (OM4). Không nối được Google (alias có dấu +).", en: "Onboarding specialist “ONB Test Specialist LF”: Team queue, 1-1, Done…, progress ticks, messaging its own LOs (OM4). Cannot connect Google (+ alias)." } },
  onbG: { email: "bao.trinh@loanfactory.com", label: { vi: "Recruiter + Onboarding (tài khoản thật của anh)", en: "Recruiter + Onboarding (your real account)" },
    use: { vi: "Tài khoản DUY NHẤT nối được Google → Meet tự tạo (case J-G). Cũng là Onboarding đang hoạt động trong MOSO nên có thể được gán làm specialist.", en: "The ONLY account that can connect Google → auto Meet (case J-G). Also an active MOSO onboarding specialist, so it may be auto-assigned." } },
  hh: { email: "bao.trinh+hh@loanfactory.com", label: WHO.HH,
    use: { vi: "“HH Test Headhunter”, vai chương trình LO Recruiter: chỉ thấy lead của mình; trang /join/bao-trinhhh; người giới thiệu cho W10 (My referrals).", en: "“HH Test Headhunter”, LO Recruiter program role: sees only its own leads; page /join/bao-trinhhh; the referrer for W10 (My referrals)." } },
  admin: { email: "chauchau.inc@gmail.com", label: { vi: "Admin recruit + HR + MOSO staging", en: "Recruit Admin + HR + MOSO staging" },
    use: { vi: "“Chau Chau” — admin mọi app staging: recruit ADMIN (Settings, Permissions), HR app <code>hr.viet18.com</code> (tạo nhân viên), MOSO admin <code>www.viet18.com</code> (Interested LOs → Status, Email History).", en: "“Chau Chau” — admin of every staging app: recruit ADMIN (Settings, Permissions), HR app <code>hr.viet18.com</code> (create associates), MOSO admin <code>www.viet18.com</code> (Interested LOs → Status, Email History)." } }
};

// 10/10 role accounts (created on staging by the orchestrator; case AB checks them before use)
Object.assign(ACC, {
  roleTl: { email: "bao.trinh+role-teamlead@loanfactory.com", label: WHO.TL, use: { vi: "Vai TEAM_LEAD (phạm vi ORIGIN_TEAM: lead của mình + lead do team thu về). Staging chưa có thành viên chương trình nào có khoá team lead → phần “lead của team” có thể không kiểm được (AD6).", en: "TEAM_LEAD role (ORIGIN_TEAM scope: own leads + leads collected by the team). No staging program member has a team-lead key yet → the “team leads” part may not be testable (AD6)." } },
  roleOfr: { email: "bao.trinh+role-officer@loanfactory.com", label: WHO.OFR, use: { vi: "Vai OFFICER_RECRUITER: như Recruiter nhưng không có Hot leads và không xác nhận tên pháp lý.", en: "OFFICER_RECRUITER role: like Recruiter but no Hot leads and no legal-name confirm." } },
  roleLos: { email: "bao.trinh+role-losupport@loanfactory.com", label: WHO.LOS, use: { vi: "Vai LO_SUPPORT: như Recruiter nhưng không có Cold list và không xác nhận tên pháp lý.", en: "LO_SUPPORT role: like Recruiter but no Cold list and no legal-name confirm." } },
  roleHr: { email: "bao.trinh+role-hr@loanfactory.com", label: WHO.RHR, use: { vi: "Vai HR trong recruit (KHÔNG phải HR app): tick việc phòng HR trong checklist.", en: "HR role inside recruit (NOT the HR app): ticks HR department checklist items." } },

    en: `<ol class="prep"><li>After paying: on the LO page click <b>Next</b> → step <b>Review and Sign agreement</b>. It says “You are tentatively classified as: Outside Loan Officer (W-2)” (or “Independent Loan Officer (1099)”).</li>

  time: { title: { vi: "🕐 Giờ giấc của hệ (đọc trước khi test SLA / lịch)", en: "🕐 System clock (read before SLA / scheduling tests)" }, body: {
    vi: `<ul class="prep"><li>Giờ làm việc (recruit-be V241, #607): <b>08:00–17:00 giờ Pacific (America/Los_Angeles), thứ 2–6</b>. Hiện giờ PDT: VN = Pacific + 14 giờ → giờ làm việc = <b>22:00 hôm đó → 07:00 sáng hôm sau giờ VN</b> (từ 02/11, PST: +15 giờ → 23:00–08:00). Kiểm giá trị đang dùng: Admin → <b>Settings / Thông số</b> → mục <b>Business hours / Giờ làm việc</b> (Opens / Closes / Working days, “Timezone: America/Los_Angeles”). Ngoài giờ, đồng hồ SLA đứng yên. Thứ 2 12/10/2026 là ngày lễ (Columbus Day) — không tính.</li>
<li>“Hôm nay” của hệ = ngày ở Los Angeles: sang ngày mới lúc <b>14:00 giờ VN</b> (15:00 từ 02/11). Ảnh hưởng: nhóm Overdue / Later today, ngày mặc định ở modal Done 1-1, bộ lọc ngày.</li>
<li>Quy tắc chọn giờ hẹn: “ngày làm việc kế tiếp, 10:00 AM Pacific” = <b>00:00 giờ VN của ngày hôm sau ngày đó</b> (vd thứ 3 13/10 10:00 PT = 00:00 VN thứ 4 14/10). Modal hẹn ghi “Start time (your time zone: …)” — gõ theo giờ VN của máy anh, dòng phụ hiện giờ LA để đối chiếu.</li>
<li>VN đặt follow-up “ngày mai 7:00” = 17:00 hôm nay ở California → nằm ở nhóm <b>Later today / Muộn hơn trong ngày</b> (đúng thiết kế).</li></ul>`,
    en: `<ul class="prep"><li>Business hours (recruit-be V241, #607): <b>08:00–17:00 Pacific (America/Los_Angeles), Mon–Fri</b>. During PDT Vietnam = Pacific + 14 h → business hours = <b>22:00 that day → 07:00 next morning Vietnam time</b> (from 02/11, PST: +15 h → 23:00–08:00). Check the live value: Admin → <b>Settings</b> → <b>Business hours</b> (Opens / Closes / Working days, “Timezone: America/Los_Angeles”). Outside them the SLA clock stops. Monday 12/10/2026 is a holiday (Columbus Day).</li>
<li>The system's “today” is the Los Angeles date: it rolls over at <b>14:00 Vietnam</b> (15:00 from 02/11). Affects Overdue / Later today, the Done 1-1 default date, date filters.</li>
<li>Picking a meeting time: “next business day, 10:00 AM Pacific” = <b>00:00 Vietnam on the following day</b> (e.g. Tue 13/10 10:00 PT = 00:00 VN Wed 14/10). The modal says “Start time (your time zone: …)” — type it in your Vietnam time; the sub-line shows LA time to compare.</li>
<li>A follow-up set from Vietnam for “tomorrow 7:00” = 17:00 today in California → shows under <b>Later today</b> (by design).</li></ul>` } },

  cron: { title: { vi: "⏱️ Lịch chạy tự động (cron, giờ UTC, phút cố định)", en: "⏱️ Automatic jobs (cron, UTC, fixed minutes)" }, body: {
    vi: `<div class="tbl"><table><thead><tr><th>Việc</th><th>Chạy lúc</th><th>Chờ bao lâu khi test</th></tr></thead><tbody>
<tr><td>MOSO → recruit (đăng ký mới, trả phí, ký, đổi status MOSO)</td><td>đẩy ngay (webhook)</td><td>~1 phút; đăng ký mới 1–3 phút</td></tr>
<tr><td>Recruit → MOSO (offer/specialist/1-1 done)</td><td>mỗi 5 phút (:00, :05, :10…)</td><td>≤5 phút, rồi MOSO gửi mail 5–30 phút</td></tr>
<tr><td>Send to HR (tự gửi bản nháp)</td><td>mỗi 5 phút</td><td>≤5 phút sau khi Joined</td></tr>
<tr><td>Đối soát “MOSO đã ký” (8r58m #612)</td><td>mỗi 20 phút (:00, :20, :40)</td><td>≤20 phút</td></tr>
<tr><td>Trả lead bỏ quên về kho (chỉ khi BẬT)</td><td>mỗi 5 phút</td><td>tick :00/:05/… — tránh khi đang bật thử</td></tr>
<tr><td>Email nhắc lịch 1-1</td><td>mỗi 5 phút</td><td>2 ngày / 1 ngày / 2 giờ trước giờ họp</td></tr>
<tr><td>Điểm danh Google Meet</td><td>mỗi 5 phút</td><td>sau giờ kết thúc buổi 1-1</td></tr>
<tr><td>Gửi lại tên đồng nghiệp cho Omni (ld7ef #610)</td><td>mỗi 5 phút</td><td>không có màn hình — chỉ dev xem bảng</td></tr>
<tr><td>Đổi Settings</td><td>—</td><td>có hiệu lực sau ≤30 giây</td></tr></tbody></table></div>`,
    en: `<div class="tbl"><table><thead><tr><th>Job</th><th>Runs</th><th>Wait when testing</th></tr></thead><tbody>
<tr><td>MOSO → recruit (new registration, paid, signed, MOSO status change)</td><td>pushed at once (webhook)</td><td>~1 min; new registration 1–3 min</td></tr>
<tr><td>Recruit → MOSO (offer/specialist/1-1 done)</td><td>every 5 min (:00, :05, :10…)</td><td>≤5 min, then MOSO mails in 5–30 min</td></tr>
<tr><td>Send to HR (auto draft)</td><td>every 5 min</td><td>≤5 min after Joined</td></tr>
<tr><td>“Signed in MOSO” reconcile (8r58m #612)</td><td>every 20 min (:00, :20, :40)</td><td>≤20 min</td></tr>
<tr><td>Return idle claimed leads (only when ON)</td><td>every 5 min</td><td>ticks :00/:05/… — avoid them while trying it</td></tr>
<tr><td>1-1 reminder emails</td><td>every 5 min</td><td>2 days / 1 day / 2 hours before the meeting</td></tr>
<tr><td>Google Meet attendance</td><td>every 5 min</td><td>after the 1-1 end time</td></tr>
<tr><td>Teammate-name re-push to Omni (ld7ef #610)</td><td>every 5 min</td><td>no screen — dev reads the table</td></tr>
<tr><td>Settings change</td><td>—</td><td>live within ≤30 s</td></tr></tbody></table></div>` } },

  settings: { title: { vi: "⚙️ Settings: đổi gì, giá trị gốc để TRẢ LẠI", en: "⚙️ Settings: what to change, original values to RESTORE" }, body: {
    vi: `<p>Chỉ Admin (<code>chauchau.inc@gmail.com</code>) vào được <code>recruit.viet18.com/settings</code> (menu <b>Settings / Thông số</b>). Đổi xong <b>đợi 30 giây</b>. Settings là CHUNG cho mọi người test — bấm nút “Tôi đang đổi /settings” ở case để người khác biết, trả lại rồi bấm nhả. Giá trị gốc dưới đây là giá trị seed trong code 10/10 — <b>trước khi đổi, chụp lại giá trị đang hiện</b> và trả về đúng giá trị đó.</p>
<div class="tbl"><table><thead><tr><th>Mục trên Settings (EN / VI)</th><th>Giá trị gốc</th><th>Hạ để test</th></tr></thead><tbody>
<tr><td>Business hours / Giờ làm việc (Opens / Closes / Working days)</td><td><code>08:00</code> – <code>17:00</code>, Mon–Fri, America/Los_Angeles</td><td>KHÔNG đổi — chỉ xem</td></tr>
<tr><td>Hot leads — first-touch deadline · Deadline for Web form</td><td><code>1</code> giờ làm việc</td><td>giữ 1 (chỉ test trong giờ làm việc)</td></tr>
<tr><td>Unclaimed → Exceptions after / Chưa ai nhận → vào Exceptions sau</td><td><code>5</code> phút</td><td><code>1</code> phút</td></tr>
<tr><td>Claimed but not contacted → back to the pool after</td><td><code>4</code> giờ làm việc · Warn before returning <code>1</code></td><td><code>1</code> · cảnh báo <code>0</code></td></tr>
<tr><td>Return idle claimed leads automatically / Tự trả về lead đã nhận mà bỏ quên</td><td><b>TẮT</b></td><td>chỉ bật &lt;1 phút cho W4, giữa hai tick (vd bật :01, tắt trước :05)</td></tr>
<tr><td>Follow-up · No-answer retry ladder</td><td><code>3, 5, 10, 30</code></td><td><code>1</code></td></tr>
<tr><td>Offers · Review deadline for an offer waiting on approval</td><td><code>24</code> giờ</td><td><code>1</code> giờ</td></tr>
<tr><td>Ready to join, invite not sent</td><td><code>2</code> ngày</td><td>giữ</td></tr>
<tr><td>Reminders &amp; notifications · Remind cooldown</td><td><code>60</code> phút</td><td>giữ</td></tr></tbody></table></div>
<div class="meta">Ngưỡng Big producer (5 / 2) KHÔNG có trên màn Settings (chỉ đổi được bằng backend). Bật “Return idle claimed leads automatically” lâu sẽ trả lại MỌI lead quá hạn trên staging — luôn tắt lại và tải lại trang để chắc đã TẮT.</div>`,
    en: `<p>Only Admin (<code>chauchau.inc@gmail.com</code>) can open <code>recruit.viet18.com/settings</code> (menu <b>Settings</b>). After a change <b>wait 30 seconds</b>. Settings are SHARED by all testers — press “I'm changing /settings” on the case, restore, then release. The originals below are the code seed values on 10/10 — <b>note the value shown before you change it</b> and restore exactly that.</p>
<div class="tbl"><table><thead><tr><th>Item on Settings</th><th>Original</th><th>Lower to test</th></tr></thead><tbody>
<tr><td>Business hours (Opens / Closes / Working days)</td><td><code>08:00</code> – <code>17:00</code>, Mon–Fri, America/Los_Angeles</td><td>do NOT change — look only</td></tr>
<tr><td>Hot leads — first-touch deadline · Deadline for Web form</td><td><code>1</code> business hour</td><td>keep 1 (test inside business hours)</td></tr>
<tr><td>Unclaimed → Exceptions after</td><td><code>5</code> min</td><td><code>1</code> min</td></tr>
<tr><td>Claimed but not contacted → back to the pool after</td><td><code>4</code> business hours · Warn before returning <code>1</code></td><td><code>1</code> · warn <code>0</code></td></tr>
<tr><td>Return idle claimed leads automatically</td><td><b>OFF</b></td><td>ON for &lt;1 min only for W4, between two ticks (e.g. on at :01, off before :05)</td></tr>
<tr><td>Follow-up · No-answer retry ladder</td><td><code>3, 5, 10, 30</code></td><td><code>1</code></td></tr>
<tr><td>Offers · Review deadline for an offer waiting on approval</td><td><code>24</code> hours</td><td><code>1</code> hour</td></tr>
<tr><td>Ready to join, invite not sent</td><td><code>2</code> days</td><td>keep</td></tr>
<tr><td>Reminders &amp; notifications · Remind cooldown</td><td><code>60</code> min</td><td>keep</td></tr></tbody></table></div>
<div class="meta">The Big producer thresholds (5 / 2) are NOT on the Settings screen (backend only). Leaving “Return idle claimed leads automatically” ON returns EVERY overdue lead on staging — always switch it off and reload to confirm OFF.</div>` } },

  sms: { title: { vi: "📱 Thiết lập SMS hai chiều", en: "📱 Two-way SMS setup" }, body: {
    vi: `<ul class="prep"><li>Máy vai LO: app <b>Zoom Workplace</b> desktop đăng nhập số <code>(408) 538-1464</code> → Phone → SMS.</li>
<li>Recruiter: <code>manhadmin@viet18.com</code> (tài khoản duy nhất có Zoom) → mở LO có sẵn <b>TRINH VU TRONG BAO</b>: <a href="https://recruit.viet18.com/candidates/07001ba1-360b-491f-b9e1-c1b45766739d" target="_blank" rel="noopener">hồ sơ</a>.</li>
<li>KHÔNG đăng ký LO mới bằng số 1464. KHÔNG nhắn đúng một chữ STOP / END / QUIT / CANCEL / UNSUBSCRIBE từ số 1464 (bị chặn vĩnh viễn trên staging).</li>
<li>Tin giữa 2 số nội bộ có thể mất (jblm) — gửi lại một lần.</li></ul>`,
    en: `<ul class="prep"><li>LO device: <b>Zoom Workplace</b> desktop signed in as <code>(408) 538-1464</code> → Phone → SMS.</li>
<li>Recruiter: <code>manhadmin@viet18.com</code> (the only account with Zoom) → open the existing LO <b>TRINH VU TRONG BAO</b>: <a href="https://recruit.viet18.com/candidates/07001ba1-360b-491f-b9e1-c1b45766739d" target="_blank" rel="noopener">profile</a>.</li>
<li>Do NOT register a new LO with 1464. Do NOT text exactly STOP / END / QUIT / CANCEL / UNSUBSCRIBE from 1464 (permanently blocked on staging).</li>
<li>Messages between two internal lines can be lost (jblm) — resend once.</li></ul>` } },

  google: { title: { vi: "📅 Nối Google (chỉ tài khoản thật của anh)", en: "📅 Connect Google (your real account only)" }, body: {
    vi: `<ol class="prep"><li>Đăng nhập <code>bao.trinh@loanfactory.com</code> → menu <b>Connections</b> (<code>/settings/connections</code>) → <b>Connect Google</b> → đồng ý → <b>Grant Meet access</b> nếu được hỏi.</li>
<li>Lời mời Google + email nhắc chỉ tới khách trong allowlist: LO <code>bao.trinh+a3009f@loanfactory.com</code> (“QA Anewe”) và email nội bộ @loanfactory.com / @viet18.com.</li></ol>`,
    en: `<ol class="prep"><li>Sign in as <code>bao.trinh@loanfactory.com</code> → <b>Connections</b> (<code>/settings/connections</code>) → <b>Connect Google</b> → allow → <b>Grant Meet access</b> if asked.</li>
<li>Google invites + reminders reach only allowlisted guests: LO <code>bao.trinh+a3009f@loanfactory.com</code> (“QA Anewe”) and internal @loanfactory.com / @viet18.com addresses.</li></ol>` } },

  stages: { title: { vi: "🧭 6 stage hiện tại (đã bật trên staging)", en: "🧭 The 6 stages (ON on staging)" }, body: {
    vi: `<div class="tbl"><table><thead><tr><th>Stage</th><th>Vào khi</th><th>Rời khi</th></tr></thead><tbody>
<tr><td><b>Not started</b> (S0, không có cột)</td><td>LO đăng ký / từ MOSO, chưa ai claim</td><td>Claim / gán → New lead</td></tr>
<tr><td><b>New lead</b> (S1)</td><td>Có người claim</td><td>Kết quả Interested/Neutral, LO trả lời SMS/email, đặt Meet 1-1 → Engaged</td></tr>
<tr><td><b>Engaged</b> (S2)</td><td>Như trên</td><td>Gửi offer (Send to onboarding / Request approval) → Offer</td></tr>
<tr><td><b>Offer</b> (S4)</td><td>Offer chờ duyệt</td><td>Được duyệt (tự động 5/2 hoặc manager) → Onboarding. Tự duyệt thì lướt qua Offer trong 1 giây.</td></tr>
<tr><td><b>Onboarding</b> (S5)</td><td>Offer gửi đi, Onboarding được gán</td><td>Đã ký VÀ (trả phí hoặc miễn) → Joined</td></tr>
<tr><td><b>Joined</b> (S6)</td><td>Như trên</td><td>HR account + HR to-do + HR docs + Licensing xong VÀ setup call Done → Onboarded</td></tr>
<tr><td><b>Onboarded</b> (S7)</td><td>Tự động</td><td>— (là nhân viên)</td></tr></tbody></table></div>
<div class="meta">Tự động chỉ đi tới. Người kéo lùi thì hệ không tự đẩy lên lại cho tới khi có tín hiệu mới. Not interested → Archived (giữ stage).</div>`,
    en: `<div class="tbl"><table><thead><tr><th>Stage</th><th>Enters when</th><th>Leaves when</th></tr></thead><tbody>
<tr><td><b>Not started</b> (S0, no column)</td><td>LO registers / comes from MOSO, nobody claimed</td><td>Claim / assign → New lead</td></tr>
<tr><td><b>New lead</b> (S1)</td><td>Someone claims</td><td>Interested/Neutral result, LO replies SMS/email, Meet 1-1 booked → Engaged</td></tr>
<tr><td><b>Engaged</b> (S2)</td><td>As above</td><td>Offer submitted (Send to onboarding / Request approval) → Offer</td></tr>
<tr><td><b>Offer</b> (S4)</td><td>Offer waiting for approval</td><td>Approved (auto at 5/2 or by a manager) → Onboarding. Auto-approved passes Offer in a second.</td></tr>
<tr><td><b>Onboarding</b> (S5)</td><td>Offer sent, onboarding assigned</td><td>Signed AND (paid or waived) → Joined</td></tr>
<tr><td><b>Joined</b> (S6)</td><td>As above</td><td>HR account + HR to-do + HR docs + Licensing done AND setup call Done → Onboarded</td></tr>
<tr><td><b>Onboarded</b> (S7)</td><td>Automatic</td><td>— (now an employee)</td></tr></tbody></table></div>
<div class="meta">Automatic moves only go forward. A human downgrade blocks auto moves until a newer signal. Not interested → Archived (keeps stage).</div>` } },

  emailReply: { title: { vi: "✉️ Email hai chiều cần Gmail riêng", en: "✉️ Two-way email needs a separate Gmail" }, body: {
    vi: "Alias <code>+</code> không dùng được: khi LO bấm Reply, Gmail gửi từ địa chỉ gốc nên hệ không biết LO nào. Tạo 1 Gmail test riêng (vd <code>lf.qa.lo01@gmail.com</code>), đăng ký đúng MỘT LO bằng Gmail đó ở <code>www.viet18.com/register-loan-officer</code>. Lưu ý omni #349: email từ recruit trên staging thường không tới — nếu không tới sau 30 phút, đánh “Bỏ” và ghi “omni #349”.",
    en: "A <code>+</code> alias does not work: when the LO hits Reply, Gmail sends from the base address so the system cannot tell which LO. Create a separate test Gmail (e.g. <code>lf.qa.lo01@gmail.com</code>) and register exactly ONE LO with it at <code>www.viet18.com/register-loan-officer</code>. Note omni #349: emails from recruit usually do not arrive on staging — if nothing after 30 min, mark “Skip” with “omni #349”." } },
  register: { title: { vi: "🆕 Đăng ký một LO mới (dùng dòng “CHƯA TẠO” của case)", en: "🆕 Register a fresh LO (use the case's “NOT CREATED” row)" }, body: {
    vi: `<ol class="prep"><li>Cửa sổ <b>ẩn danh</b> → <code>www.viet18.com/register-loan-officer</code>${cp("https://www.viet18.com/register-loan-officer")}.</li>
<li>Tick “I acknowledge…” → <b>Next</b>.</li>
<li>Basic info: First name <code>QA</code> · Last name = cột Tên của dòng (chỉ chữ cái, vd <code>Tenmain</code>) · Email, Phone, NMLS = đúng dòng đó (bấm ⧉ để chép).</li>
<li>Citizenship <b>US Citizen</b> · Address <code>123 Test Street</code> · City <code>Dallas</code> · State <b>Texas</b> · ZIP <code>75201</code>.</li>
<li>Licensed states + sponsor state: <b>Texas</b> (trừ khi dòng ghi bang khác). Loan Officer type: <b>Outside (W-2)</b> (trừ khi dòng ghi 1099). Compensation <code>0.5</code>.</li>
<li>Website <b>No</b> + tick ô “I agree to obtain Loan Factory's approval…” · Social media <b>No</b> · “How did you hear about us / referred by” = <b>Google</b> · tick ô xác nhận cuối → <b>Next</b>.</li>
<li>Kết quả đúng: URL có thêm <code>?key=…</code>, trang “You're done for now. We will call you soon…”. <b>Chép URL này vào Nhật ký lần chạy</b> (đây là “link của LO” để trả phí + ký sau).</li>
<li>Trong 1–3 phút LO hiện ở <b>Hot leads / Kho HOT</b> với chip nguồn <b>Web form</b>, stage <b>Not started</b>. Tìm nhanh: ô tìm đầu trang “Search candidates, NMLS, companies…” gõ NMLS.</li></ol>`,
    en: `<ol class="prep"><li><b>Incognito</b> window → <code>www.viet18.com/register-loan-officer</code>${cp("https://www.viet18.com/register-loan-officer")}.</li>
<li>Tick “I acknowledge…” → <b>Next</b>.</li>
<li>Basic info: First name <code>QA</code> · Last name = the row's Name column (letters only, e.g. <code>Tenmain</code>) · Email, Phone, NMLS = that row (click ⧉ to copy).</li>
<li>Citizenship <b>US Citizen</b> · Address <code>123 Test Street</code> · City <code>Dallas</code> · State <b>Texas</b> · ZIP <code>75201</code>.</li>
<li>Licensed + sponsor state: <b>Texas</b> (unless the row says otherwise). Loan Officer type: <b>Outside (W-2)</b> (unless the row says 1099). Compensation <code>0.5</code>.</li>
<li>Website <b>No</b> + tick “I agree to obtain Loan Factory's approval…” · Social media <b>No</b> · referred by / how did you hear = <b>Google</b> · tick the final confirm → <b>Next</b>.</li>
<li>Correct result: URL gains <code>?key=…</code>, page “You're done for now. We will call you soon…”. <b>Paste that URL into the Run log</b> (it is the “LO's link” for paying + signing later).</li>
<li>Within 1–3 min the LO shows in <b>Hot leads</b> with source chip <b>Web form</b>, stage <b>Not started</b>. Quick find: the header search “Search candidates, NMLS, companies…” with the NMLS.</li></ol>` } },

  zoom: { title: { vi: "📞 Gọi điện thật bằng Zoom (OM9, Y1–Y3)", en: "📞 Real calls through Zoom (OM9, Y1–Y3)" }, body: {
    vi: `<ol class="prep"><li>Trên Mac: mở app <b>Zoom Workplace</b>, đăng nhập đường dây <b>Manh Zoom line (408) 538-1464</b> (thuộc <code>manhadmin@viet18.com</code>). System Settings → Privacy &amp; Security → <b>Microphone</b> → bật cho <b>zoom.us</b>.</li>
<li>Recruit: đăng nhập <code>manhadmin@viet18.com</code> (recruiter duy nhất có Zoom). LO để gọi: <b>TRINH VU TRONG BAO</b> (<a href="https://recruit.viet18.com/candidates/07001ba1-360b-491f-b9e1-c1b45766739d" target="_blank" rel="noopener">hồ sơ</a>), SĐT <code>+1 303-499-7111</code> = đường dây đọc giờ NIST, tự nhấc máy.</li>
<li>Gọi: menu <b>Conversations / Hội thoại</b> → tìm <code>TRINH VU</code> → <b>Open</b> → trong panel Omni chọn kênh/tab <b>Call</b> → <b>Call now / Gọi ngay</b> → Zoom trên Mac tự quay số. Nghe đọc giờ khoảng <b>30 giây</b> → cúp máy trong Zoom.</li>
<li>Kiểm trong Omni: dòng cuộc gọi → <b>Call details</b>: Outcome <b>Connected</b>, thời lượng ~20–30 giây, Source Zoom Phone, <b>From = Manh Admin</b>, To = LO; <b>Play recording</b> phát được, có <b>Download</b> và tốc độ 1x–2x. Không còn dòng “Calling…” quay mãi.</li>
<li>Kiểm hồ sơ LO: dải đỏ “<b>Your call {giờ} has no result yet</b> — Log how it went so the next step gets scheduled.” + nút <b>Log result / Ghi kết quả</b>.</li></ol>
<div class="meta">Không gọi được số ngoài Mỹ từ đường dây này (yc2ag, hoãn). Gọi nội bộ Zoom→Zoom vẫn kẹt “Calling…” (5j85f, đang mở). Chưa có AI summary vì cuộc gọi chỉ là giọng đọc giờ.</div>`,
    en: `<ol class="prep"><li>On the Mac: open <b>Zoom Workplace</b>, signed in as <b>Manh Zoom line (408) 538-1464</b> (belongs to <code>manhadmin@viet18.com</code>). System Settings → Privacy &amp; Security → <b>Microphone</b> → enable <b>zoom.us</b>.</li>
<li>Recruit: sign in as <code>manhadmin@viet18.com</code> (the only recruiter with Zoom). LO to call: <b>TRINH VU TRONG BAO</b> (<a href="https://recruit.viet18.com/candidates/07001ba1-360b-491f-b9e1-c1b45766739d" target="_blank" rel="noopener">profile</a>), phone <code>+1 303-499-7111</code> = NIST time line, auto-answers.</li>
<li>Call: <b>Conversations</b> → search <code>TRINH VU</code> → <b>Open</b> → in the Omni panel pick the <b>Call</b> channel/tab → <b>Call now</b> → Zoom on the Mac dials. Listen ~<b>30 seconds</b> → hang up in Zoom.</li>
<li>Check in Omni: the call row → <b>Call details</b>: Outcome <b>Connected</b>, ~20–30 s, Source Zoom Phone, <b>From = Manh Admin</b>, To = the LO; <b>Play recording</b> plays, with <b>Download</b> and 1x–2x speed. No endless “Calling…”.</li>
<li>Check the LO profile: red strip “<b>Your call {time} has no result yet</b> — Log how it went so the next step gets scheduled.” + <b>Log result</b>.</li></ol>
<div class="meta">International numbers can't be dialled from this line (yc2ag, deferred). Internal Zoom→Zoom calls still stick on “Calling…” (5j85f, open). No AI summary because the call is only the time voice.</div>` } },

  results: { title: { vi: "📝 Ghi kết quả trên trang này", en: "📝 Recording results on this page" }, body: {
    vi: `<ol class="prep"><li>Mở trang này khi đã đăng nhập claude.ai → góc trên “View” = <b>Kết quả của tôi</b>.</li>
<li>Làm xong một bước: bấm <b>Đạt</b> / <b>Lỗi</b> / <b>Bỏ</b> bên trái bước. Bấm lại cùng nút = xoá.</li>
<li>Bấm <b>+ ghi chú</b> (hoặc tự mở khi chọn Lỗi): ghi email LO, ID ứng viên, <b>giờ VN</b>, chữ thực tế trên màn hình, mã bug. Lưu tự động sau 1 giây.</li>
<li>Chip viền nét đứt “Claude (tự test)” dưới bước = kết quả gần nhất Claude chạy (kèm ghi chú). Chọn “So sánh mọi người” để xem cả kết quả người khác.</li>

    S("A18", "LO", "Trên trang LO bấm <b>Next</b> → <b>Review and Sign agreement</b> → ký theo khối <b>✍️ Inkless</b>: Click Here to Sign Documents → I Accept → START → bấm từng ô SIGN (lần đầu Create your signature: gõ <code>QA Tenmain</code> → Set Signature) → FINISH → Complete Signing.", "Trang ghi “Outside Loan Officer (W-2)”; Inkless “5 of 5 Completed” → hoàn tất.", "On the LO page click <b>Next</b> → <b>Review and Sign agreement</b> → sign per the <b>✍️ Inkless</b> block: Click Here to Sign Documents → I Accept → START → each SIGN box (first time Create your signature: type <code>QA Tenmain</code> → Set Signature) → FINISH → Complete Signing.", "Page says “Outside Loan Officer (W-2)”; Inkless “5 of 5 Completed” → complete."),
    S("A19", "ONB", "Đợi ~1 phút → tải lại hồ sơ QA Tenmain → Activity.", "Signed = Done; stage TỰ lên <b>Joined</b> (Activity: Onboarding → Joined, System, “Signed and paid”). Chuông “… signed” (icon bút). My hand-offs: dòng chuyển Joined. (Nếu sau 20 phút vẫn chưa: xem C4 — cron đối soát :00/:20/:40.)", "Wait ~1 min → reload QA Tenmain → Activity.", "Signed = Done; stage moves BY ITSELF to <b>Joined</b> (Activity: System, “Signed and paid”). “… signed” bell (pen icon). My hand-offs row is Joined. (Still not after 20 min: see C4 — reconcile cron :00/:20/:40.)"),
    S("A20", "ONB", "Overview → thẻ <b>Onboarding progress / Tiến độ onboarding</b>. Đợi tối đa 5 phút (cron Send to HR :00/:05/…).", "Vòng “{done} of {total} done”. Before joining: 1-1 · Fee · Signed đều Done kèm ngày. <b>Sent to HR</b> tự Done — KHÔNG có nút bấm tay. <b>HR account / HR to-do / HR docs / Licensing</b> đang Waiting với chip “Since … · N days”.", "Overview → <b>Onboarding progress</b> card. Wait up to 5 min (Send to HR cron :00/:05/…).", "Ring “{done} of {total} done”. Before joining: 1-1 · Fee · Signed Done with dates. <b>Sent to HR</b> Done by itself — NO manual button. <b>HR account / HR to-do / HR docs / Licensing</b> Waiting with “Since … · N days”."),
    S("A21", "HR", "HR app theo khối <b>🏢 HR app</b>: <code>hr.viet18.com</code> → <b>People → Associates → Add associate</b> → dòng “Tenmain QA” (chip Recruit) → <b>Review</b> → Work email <code>qa.tenmain1010@loanfactory.com</code> → thêm licence <b>TX · Mortgage Company License</b>, hết hạn <code>12/31/2026</code> → <b>Create associate</b>.", "Bản nháp điền sẵn đúng (tên, email, SĐT, địa chỉ, <b>NMLS 9931202</b>, W-2). Review “Everything required is filled in.” → toast <b>Associate created</b>.", "HR app per the <b>🏢 HR app</b> block: <code>hr.viet18.com</code> → <b>People → Associates → Add associate</b> → row “Tenmain QA” (Recruit chip) → <b>Review</b> → Work email <code>qa.tenmain1010@loanfactory.com</code> → add licence <b>TX · Mortgage Company License</b>, expiry <code>12/31/2026</code> → <b>Create associate</b>.", "Draft prefilled correctly (name, email, phone, address, <b>NMLS 9931202</b>, W-2). Review “Everything required is filled in.” → toast <b>Associate created</b>."),
    S("A22", "ONB", "Recruit: hồ sơ QA Tenmain → <b>Activity</b>; rồi <b>Overview</b>.", "Activity có “<b>HR created the employee account</b>”. Thẻ Onboarding progress: <b>HR account</b> = Done (nguồn HR, không có Undo).", "Recruit: QA Tenmain → <b>Activity</b>; then <b>Overview</b>.", "Activity has “<b>HR created the employee account</b>”. Card: <b>HR account</b> = Done (source HR, no Undo)."),
    S("A23", "ONB", "Trên thẻ bấm ô <b>HR to-do</b> → rồi <b>HR docs</b>.", "Mỗi ô thành Done, “Ticked by {bạn}”, có <b>Undo</b>. <b>Tự tick thì KHÔNG có chuông cho chính mình</b> (đúng thiết kế). Muốn thử chuông: đăng nhập tài khoản HR (<code>bao.trinh+role-hr</code>) → mở hồ sơ QA Tenmain → tick <b>HR to-do</b> + <b>HR docs</b>; rồi đăng nhập lại bằng tài khoản specialist của LO → bấm chuông → có “<b>HR is done for QA Tenmain</b>”.", "On the card tick <b>HR to-do</b> → then <b>HR docs</b>.", "Each turns Done, “Ticked by {you}”, with <b>Undo</b>. <b>Ticks made by YOURSELF give you no bell</b> (by design). To test the bell: sign in as an HR account (<code>bao.trinh+role-hr</code>) → open QA Tenmain → tick <b>HR to-do</b> + <b>HR docs</b>; then sign in again as the LO’s specialist → bell → “<b>HR is done for QA Tenmain</b>”."),
    S("A24", "ONB", "Bấm ô <b>Licensing</b>.", "Chuông gộp “<b>HR and Licensing are done — book the setup call</b>” (icon lịch). My work today có dòng đậm cùng tiêu đề, viền cam, “Due {ngày}”, nút <b>Mark done</b> / <b>Open</b>.", "Tick <b>Licensing</b>.", "Combined bell “<b>HR and Licensing are done — book the setup call</b>” (calendar icon). My work today: bold row, orange edge, “Due {date}”, <b>Mark done</b> / <b>Open</b>."),
    S("A25", "ONB", "(Tuỳ chọn) bấm <b>Book the setup call</b> → hẹn như A13. Rồi bấm <b>Mark done</b> cho setup call (trên My work today hoặc trên thẻ).", "Toast “Setup call marked done”. Stage TỰ lên <b>Onboarded</b> (System, “HR, Licensing and setup call done”). Thanh stage đủ vòng xanh. My hand-offs: cả 10 ô xanh.", "(Optional) <b>Book the setup call</b> → book like A13. Then click <b>Mark done</b> for the setup call (My work today or the card).", "Toast “Setup call marked done”. Stage moves BY ITSELF to <b>Onboarded</b> (System, “HR, Licensing and setup call done”). Stepper all green. My hand-offs: all 10 segments green.")
  ],
  fail: { vi: "Kẹt ở bước nào thì đánh Lỗi ở bước đó, ghi giờ VN + ID ứng viên. Đừng tạo LO mới — dùng A2 để chạy lại.", en: "Mark Fail on the step where it stuck, with VN time + candidate ID. Don't create a new LO — use A2 to re-run." } });

CASES.push({ id: "B", group: G_FLOW, short: { vi: "Offer & duyệt", en: "Offer & approval" },
  title: { vi: "Offer: quy tắc 5/2, duyệt, miễn phí, từ chối, gửi lại, ai được làm", en: "Offer: the 5/2 rule, approval, fee waiver, decline, resend, who may do what" },
  goal: { vi: "Mọi nhánh của modal Offer và hàng chờ duyệt của Manager.", en: "Every branch of the Offer modal and the manager's approval queue." },
  los: ["B1", "B2", "B3", "B4b", "B5", "B6", "B7", "B7b", "B8", "B9", "H11"], acc: ["rec", "mgr", "recSms"],
  loNote: { vi: "Lần chạy 10/10 dùng 7 LO mới NB1–NB7 (đăng ký theo khối 🆕). Mở modal Offer: Hot leads → Claim → Log result → Interested → <b>Yes, prepare offer</b>. B8/B12 dùng QA Hlateapproval (offer chờ từ 07/10 — đừng duyệt). B10 QA Bnotmine do Manager giữ. Quy tắc tự duyệt: Loans since 2022 ≥ 5 VÀ 12 tháng ≥ 2, không miễn phí.",
    en: "The 10/10 run uses 7 fresh LOs NB1–NB7 (register with the 🆕 block). Offer modal: Hot leads → Claim → Log result → Interested → <b>Yes, prepare offer</b>. B8/B12 use QA Hlateapproval (pending since 07/10 — don't approve). B10 QA Bnotmine is owned by the Manager. Auto-approve rule: Loans since 2022 ≥ 5 AND last 12 months ≥ 2, no waiver." },
  steps: [
    S("B1", "REC", "Đăng ký LO <b>NB1 · QA Tenbauto</b> (khối 🆕) → đợi 1–3 phút → mở modal Offer: Hot leads / Kho HOT → <b>Claim</b> → <b>Log result</b> → <b>Interested</b> → <b>Yes, prepare offer</b> → Loans since 2022 = <code>6</code>, last 12 months = <code>3</code>, Startup fee <b>Charge $100</b> → <b>Send to onboarding</b>.", "Tự duyệt: toast “Sent to onboarding — QA Tenbauto”, stage <b>Onboarding</b>. Manager (<code>bao.trinh+manager</code>) KHÔNG thấy dòng QA Tenbauto ở “Waiting on your decision”.", "Register <b>NB1 · QA Tenbauto</b> (🆕 block) → wait 1–3 min → open the Offer modal: Hot leads → <b>Claim</b> → <b>Log result</b> → <b>Interested</b> → <b>Yes, prepare offer</b> → Loans since 2022 = <code>6</code>, last 12 months = <code>3</code>, Startup fee <b>Charge $100</b> → <b>Send to onboarding</b>.", "Auto-approved: toast “Sent to onboarding — QA Tenbauto”, stage <b>Onboarding</b>. The manager (<code>bao.trinh+manager</code>) sees NO QA Tenbauto row in “Waiting on your decision”."),
    S("B2", "REC", "LO <b>NB2 · QA Tenbedge</b>: mở modal Offer: Hot leads / Kho HOT → <b>Claim</b> → <b>Log result</b> → <b>Interested</b> → <b>Yes, prepare offer</b> → gõ đúng ngưỡng <code>5</code> / <code>2</code>.", "Nút vẫn là <b>Send to onboarding</b> → bấm → tự duyệt (toast “Sent to onboarding — QA Tenbedge”).", "LO <b>NB2 · QA Tenbedge</b>: open the Offer modal: Hot leads → <b>Claim</b> → <b>Log result</b> → <b>Interested</b> → <b>Yes, prepare offer</b> → type exactly <code>5</code> / <code>2</code>.", "Still <b>Send to onboarding</b> → click → auto-approved (toast “Sent to onboarding — QA Tenbedge”)."),
    S("B3", "REC", "LO <b>NB3 · QA Tenbbelow</b>: mở modal Offer: Hot leads / Kho HOT → <b>Claim</b> → <b>Log result</b> → <b>Interested</b> → <b>Yes, prepare offer</b> → gõ <code>4</code> / <code>2</code>; sửa 4 → <code>5</code>; rồi lại <code>4</code>.", "Gõ 4: nút đổi NGAY thành <b>Request approval</b> (VI “Xin duyệt trước”) + hộp vàng “Will need manager approval · Below loans-since-2022 minimum”. Gõ 5: về <b>Send to onboarding</b>. Gõ lại 4: lại Request approval.", "LO <b>NB3 · QA Tenbbelow</b>: open the Offer modal: Hot leads → <b>Claim</b> → <b>Log result</b> → <b>Interested</b> → <b>Yes, prepare offer</b> → type <code>4</code> / <code>2</code>; change 4 → <code>5</code>; back to <code>4</code>.", "At 4 the button switches AT ONCE to <b>Request approval</b> + yellow “Will need manager approval · Below loans-since-2022 minimum”. At 5 back to <b>Send to onboarding</b>. At 4 again Request approval."),
    S("B3b", "REC", "Ô <b>Note for the approver</b> gõ <code>QA B3 note 10/10</code> → <b>Request approval</b>.", "Toast “<b>Sent for manager approval.</b>” Stage = <b>Offer</b>. Hồ sơ có dòng “Offer is waiting for manager approval”. My hand-offs → thẻ Waiting approval có dòng QA Tenbbelow.", "<b>Note for the approver</b> = <code>QA B3 note 10/10</code> → <b>Request approval</b>.", "Toast “<b>Sent for manager approval.</b>” Stage = <b>Offer</b>. Profile shows “Offer is waiting for manager approval”. My hand-offs → Waiting approval lists QA Tenbbelow."),
    S("B3c", "MGR", "Profile Chrome Manager → <b>My work today / Việc hôm nay của tôi</b> → khối <b>Waiting on your decision / Đang chờ bạn quyết định</b>.", "Dòng QA Tenbbelow: lý do “Below loans-since-2022 minimum”, “Requested by QA Test Recruiter”, ghi chú “QA B3 note 10/10”, cột Waiting. Nút <b>Approve</b> · <b>Decline</b>. Ô <b>Decisions waiting / Chờ bạn duyệt</b> và số trên menu tăng.", "Manager Chrome profile → <b>My work today</b> → <b>Waiting on your decision</b>.", "Row QA Tenbbelow: reason “Below loans-since-2022 minimum”, “Requested by QA Test Recruiter”, note “QA B3 note 10/10”, Waiting column. Buttons <b>Approve</b> · <b>Decline</b>. <b>Decisions waiting</b> tile and nav badge up."),
    S("B3d", "MGR", "Bấm <b>Approve / Duyệt</b> trên dòng QA Tenbbelow.", "Toast “<b>Approved · QA Tenbbelow → onboarding</b>”. Dòng biến mất; LO lên <b>Onboarding</b>; recruiter nhận chuông.", "Click <b>Approve</b> on QA Tenbbelow.", "Toast “<b>Approved · QA Tenbbelow → onboarding</b>”. Row leaves; LO goes to <b>Onboarding</b>; the recruiter gets a bell."),
    S("B4", "REC", "LO <b>NB4 · QA Tenbwaive</b>: mở modal Offer: Hot leads / Kho HOT → <b>Claim</b> → <b>Log result</b> → <b>Interested</b> → <b>Yes, prepare offer</b> → <code>6</code> / <code>3</code> → Startup fee = <b>Waive + reason</b> → lý do “<b>Top producer — priority close</b>” → <b>Request approval</b>. (Làm B4b trước khi bấm gửi.)", "Miễn phí LUÔN cần duyệt dù đủ số. Toast “Sent for manager approval.”", "LO <b>NB4 · QA Tenbwaive</b>: open the Offer modal: Hot leads → <b>Claim</b> → <b>Log result</b> → <b>Interested</b> → <b>Yes, prepare offer</b> → <code>6</code> / <code>3</code> → Startup fee = <b>Waive + reason</b> → “<b>Top producer — priority close</b>” → <b>Request approval</b>. (Do B4b before sending.)", "A waiver ALWAYS needs approval even with good numbers. Toast “Sent for manager approval.”"),
    S("B4b", "REC", "(Trước khi gửi B4) đổi lý do thành “<b>Other — specify…</b>” và để trống ô giải thích; rồi gõ <code>QA other reason</code>; cuối cùng chọn lại “Top producer — priority close”.", "Ô trống: nút gửi bị khoá. Có chữ: nút mở.", "(Before sending B4) switch the reason to “<b>Other — specify…</b>” with the text empty; then type <code>QA other reason</code>; finally pick “Top producer — priority close” again.", "Empty: submit disabled. With text: enabled."),
    S("B4c", "MGR", "Manager → My work today → Waiting on your decision → dòng QA Tenbwaive → bấm <b>Approve · waive $100</b>.", "Dòng hiện “Waiver reason: Top producer…”; nút <b>Approve · charge $100</b> · <b>Approve · waive $100</b> · <b>Decline</b>. Toast “Approved · fee waived · QA Tenbwaive → onboarding”. Thẻ Offer ghi “Fee waived”; sau 1-1 trang LO KHÔNG có bước trả phí.", "Manager → My work today → Waiting on your decision → QA Tenbwaive → <b>Approve · waive $100</b>.", "Row shows “Waiver reason: Top producer…”; buttons <b>Approve · charge $100</b> · <b>Approve · waive $100</b> · <b>Decline</b>. Toast “Approved · fee waived · QA Tenbwaive → onboarding”. Offer card “Fee waived”; after the 1-1 the LO page has NO pay step."),
    S("B5", "MGR", "Recruiter làm như B4 với LO <b>NB5 · QA Tenbkeep</b> (xin miễn). Manager → dòng QA Tenbkeep → <b>Approve · charge $100</b>.", "Toast “Approved · $100 fee kept · QA Tenbkeep → onboarding”. Thẻ Offer vẫn chờ trả $100.", "Recruiter repeats B4 on <b>NB5 · QA Tenbkeep</b> (waiver). Manager → QA Tenbkeep → <b>Approve · charge $100</b>.", "Toast “Approved · $100 fee kept · QA Tenbkeep → onboarding”. Offer card still expects $100."),
    S("B6", "MGR", "Recruiter gửi offer <code>4</code>/<code>2</code> cho LO <b>NB6 · QA Tenbdecline</b> (chờ duyệt). Manager → dòng đó → <b>Decline / Từ chối</b> → ô “Reason (kept in the offer history)” gõ <code>abc</code>, rồi <code>Numbers too low</code> → xác nhận.", "Lý do &lt;4 ký tự: nút khoá. Xong: toast “<b>Declined: QA Tenbdecline</b>”; recruiter nhận chuông; hồ sơ có dòng đỏ “Declined by QA Test Manager: Numbers too low”. Stage vẫn Offer.", "Recruiter sends a <code>4</code>/<code>2</code> offer for <b>NB6 · QA Tenbdecline</b> (pending). Manager → that row → <b>Decline</b> → “Reason (kept in the offer history)” = <code>abc</code>, then <code>Numbers too low</code> → confirm.", "Under 4 chars: locked. After: toast “<b>Declined: QA Tenbdecline</b>”; recruiter bell; profile red “Declined by QA Test Manager: Numbers too low”. Stage stays Offer."),
    S("B7", "REC", "Recruiter → <b>My hand-offs</b> → thẻ <b>Declined</b> → dòng QA Tenbdecline → <b>Edit &amp; resend / Sửa &amp; gửi lại</b> → sửa hai con số thành <code>6</code>/<code>3</code> → <b>Send to onboarding</b>. <b>Sau bản sửa</b> (PR đang làm): sửa số NGAY TRONG hộp thoại. <b>Trước bản sửa</b> số chỉ đọc: <b>Profile → Edit → Production</b> → 6/3 → Save → quay lại My hand-offs → Edit &amp; resend → Send to onboarding.", "Gửi được (tự duyệt). Danh sách chỉ còn MỘT dòng QA Tenbdecline với chữ “<b>Declined 1× before</b>”; dòng cũ không còn nút.", "Recruiter → <b>My hand-offs</b> → <b>Declined</b> → QA Tenbdecline → <b>Edit &amp; resend</b> → change the two numbers to <code>6</code>/<code>3</code> → <b>Send to onboarding</b>. <b>After the fix</b> (PR in progress): edit the numbers directly in the dialog. <b>Before it</b> they are read-only: <b>Profile → Edit → Production</b> → 6/3 → Save → back to My hand-offs → Edit &amp; resend → Send to onboarding.", "Sent (auto-approved). ONE QA Tenbdecline row reading “<b>Declined 1× before</b>”; the old row has no buttons.", { vi: "B7: sửa số trong hộp thoại — PR đang làm", en: "B7: edit numbers in the dialog — PR in progress" }),
    S("B8", "REC", "Ô tìm đầu trang gõ <code>Hlateapproval</code> → mở <b>QA Hlateapproval</b> (offer đang chờ duyệt từ 07/10 — KHÔNG duyệt nó, case H8 cần) → <b>Log result</b> → <b>Interested</b>.", "KHÔNG có thẻ “Ready to join?” / nút Yes, prepare offer (đã có offer mở). Đóng khung, không lưu.", "Header search <code>Hlateapproval</code> → open <b>QA Hlateapproval</b> (offer pending since 07/10 — do NOT approve it, H8 needs it) → <b>Log result</b> → <b>Interested</b>.", "NO “Ready to join?” card / Yes, prepare offer (an offer is already open). Close without saving."),
    S("B9", "REC", "Ô tìm gõ <code>Bnonmlstwo</code> → QA Bnonmlstwo (đăng ký KHÔNG có NMLS, của bao+recruiter) → <b>Log result</b> → <b>Interested</b> → <b>Yes, prepare offer</b>.", "Modal báo “NMLS missing from the profile” + link “Update NMLS in the profile”; nút gửi khoá. (Phần “xoá trắng NMLS ở QA Bnonmls” đã bỏ: LO đó vốn không có NMLS.)", "Header search <code>Bnonmlstwo</code> → QA Bnonmlstwo (registered WITHOUT NMLS, owned by bao+recruiter) → <b>Log result</b> → <b>Interested</b> → <b>Yes, prepare offer</b>.", "Modal says “NMLS missing from the profile” + “Update NMLS in the profile”; submit locked. (The “blank the NMLS on QA Bnonmls” half was dropped: that LO never had an NMLS.)"),
    S("B10", "REC", "<code>bao.trinh+recruiter</code> → ô tìm <code>Bnotmine</code> → QA Bnotmine (chủ: QA Test Manager) → thử <b>Log result</b> / tìm nút Prepare offer.", "Không làm offer được (chỉ chủ lead hoặc manager); không có thẻ Ready to join. <b>Call</b> trên lead của người khác VẪN quay số và hiện “<b>X already owns this candidate</b>” — đúng thiết kế, Bao đã chốt giữ nguyên (không đánh Fail vì điều này).", "<code>bao.trinh+recruiter</code> → search <code>Bnotmine</code> → QA Bnotmine (owner QA Test Manager) → try <b>Log result</b> / look for Prepare offer.", "Cannot make an offer (owner or manager only); no Ready to join card. <b>Call</b> on someone else’s lead STILL dials and shows “<b>X already owns this candidate</b>” — by design, Bao decided to keep it (do not mark Fail for this)."),
    S("B11", "MGR", "Manager → Hot leads → LO <b>NB7 · QA Tenbmgr</b> → <b>Claim</b> → <b>Log result</b> → <b>Interested</b> → <b>Yes, prepare offer</b> → để trống hai số.", "Nút chính là <b>Approve / Duyệt</b> (manager tự duyệt một bước). Bấm → LO lên <b>Onboarding</b>, không có dòng chờ duyệt nào.", "Manager → Hot leads → <b>NB7 · QA Tenbmgr</b> → <b>Claim</b> → <b>Log result</b> → <b>Interested</b> → <b>Yes, prepare offer</b> → leave both numbers empty.", "Main button is <b>Approve</b> (manager one-step). Click → LO goes to <b>Onboarding</b>, no pending row anywhere."),
    S("B12", "REC", "Recruiter → <b>My hand-offs</b> → thẻ <b>Waiting approval</b> → dòng QA Hlateapproval → <b>Remind manager / Nhắc quản lý</b>. Bấm lần nữa.", "Lần 1: toast “<b>Reminded the managers about QA Hlateapproval</b>”, Manager nhận chuông. Lần 2: nút hiện “Reminded · again {giờ}” (chờ 60 phút).", "Recruiter → <b>My hand-offs</b> → <b>Waiting approval</b> → QA Hlateapproval → <b>Remind manager</b>. Click again.", "1st: toast “<b>Reminded the managers about QA Hlateapproval</b>”, Manager gets a bell. 2nd: “Reminded · again {time}” (60-min cooldown)."),
    S("B13", "MGR", "(Chỉ xem, không bắt buộc) Ô tìm gõ <code>Tenadsupport</code> → mở <a href=\"https://recruit.viet18.com/candidates/911687e3-91f6-422f-ad1a-78f4fdb252c7\" target=\"_blank\" rel=\"noopener\">QA Tenadsupport</a> → tab <b>Overview</b>. Chỉ nhìn, <b>đừng bấm Resend</b> (dùng cho B14). (QA Claudeofferb đã được gửi lại ngày 10/10 nên không còn dải đỏ.)", "Dải đỏ “<b>The invite did not reach MOSO.</b>” (MOSO báo tài khoản gửi thiếu quyền RECRUITING) + nút Resend invite; thẻ Offer “Invited — <b>Not delivered to MOSO</b>”.", "(Look only, optional) Header search <code>Tenadsupport</code> → open <a href=\"https://recruit.viet18.com/candidates/911687e3-91f6-422f-ad1a-78f4fdb252c7\" target=\"_blank\" rel=\"noopener\">QA Tenadsupport</a> → <b>Overview</b> tab. Look only, <b>do not click Resend</b> (B14 uses it). (QA Claudeofferb was resent on 10/10, so its strip is gone.)", "Red strip “<b>The invite did not reach MOSO.</b>” (MOSO says the sender lacks the RECRUITING permission) + Resend invite button; Offer card “Invited — <b>Not delivered to MOSO</b>”.", { vi: "m4eyx · recruit-be #601", en: "m4eyx · recruit-be #601" }),
    S("B14", "LOS", "packs #3645 đã lên MOSO STAGING (12/10 15:26), chưa lên production. Đăng nhập <code>bao.trinh+role-losupport@loanfactory.com</code> (MOSO của nó là <code>bao.trinh+role-losupport+1</code>) → mở <a href=\"https://recruit.viet18.com/candidates/911687e3-91f6-422f-ad1a-78f4fdb252c7\" target=\"_blank\" rel=\"noopener\">QA Tenadsupport</a> → tab <b>Overview</b> → dải đỏ → <b>Resend invite</b> → <b>Send again</b> → đợi cron :00/:05 + 1 phút → mở lại Overview.", "Nếu MOSO Admin của tài khoản có một trong RECRUITING / INTERESTED_LOAN_OFFICERS / RECRUITED_LOAN_OFFICERS / is_recruiter / is_out_sourcing_recruiter: hết dải đỏ, thẻ Offer không còn “Not delivered to MOSO”. Nếu vẫn 401 “lacks recruiting permission (needs RECRUITING, INTERESTED_LOAN_OFFICERS…)”: tài khoản này không có quyền nào ở trên — #3645 cố ý chặn; KHÔNG phải lỗi deploy. Claude chạy 13/10 03:04 VN: <b>vẫn 401</b> (xem GUIDE-1213.md).", "packs #3645 is on MOSO STAGING (12/10 15:26), not on production. Sign in as <code>bao.trinh+role-losupport@loanfactory.com</code> (its MOSO identity is <code>bao.trinh+role-losupport+1</code>) → open <a href=\"https://recruit.viet18.com/candidates/911687e3-91f6-422f-ad1a-78f4fdb252c7\" target=\"_blank\" rel=\"noopener\">QA Tenadsupport</a> → <b>Overview</b> tab → red strip → <b>Resend invite</b> → <b>Send again</b> → wait for the :00/:05 cron + 1 min → re-open Overview.", "If the account’s MOSO Admin has any of RECRUITING / INTERESTED_LOAN_OFFICERS / RECRUITED_LOAN_OFFICERS / is_recruiter / is_out_sourcing_recruiter: the strip is gone and the Offer card no longer says “Not delivered to MOSO”. If it is still 401 “lacks recruiting permission (needs RECRUITING, INTERESTED_LOAN_OFFICERS…)”: the account has none of them — #3645 refuses it on purpose; NOT a deploy failure. Claude’s run 13/10 03:04 VN: <b>still 401</b> (see GUIDE-1213.md).", { vi: "packs #3645 trên staging; tài khoản thiếu quyền MOSO", en: "packs #3645 on staging; account lacks MOSO grant" })
  ] });

CASES.push({ id: "C", group: G_FLOW, short: { vi: "W-2 / 1099 ở buổi 1-1", en: "W-2 / 1099 at the 1-1" },
  title: { vi: "Loại Loan Officer chọn ở buổi 1-1: W-2 / 1099 / Corporate / Mortgage advisor", en: "Loan officer type picked at the 1-1: W-2 / 1099 / Corporate / Mortgage advisor" },
  goal: { vi: "Lựa chọn ở modal Done đi đúng tới tài liệu ký và bản nháp HR.", en: "The Done-modal choice reaches the right agreement and HR draft." },
  los: ["C1", "C2", "C3", "C4"], acc: ["onb", "onbG"], res: ["paypal", "sign", "hrapp"],
  loNote: { vi: "Lần chạy 10/10: 4 LO mới NC1–NC4 (NC1 đăng ký loại Independent 1099, NC4 loại Outside W-2). Đưa mỗi LO tới Onboarding như A1–A9, rồi mở từ Team queue → Everyone → tìm tên.", en: "10/10 run: 4 fresh LOs NC1–NC4 (NC1 registers as Independent 1099, NC4 as Outside W-2). Take each to Onboarding as in A1–A9, then open from Team queue → Everyone → search the name." },
  steps: [
    S("C1", "ONB", "LO <b>NC1 · QA Tencindie</b> (đăng ký loại <b>Independent (1099)</b>) (đã đăng ký → recruiter Claim → Log result Interested → Yes, prepare offer 6/3 → Send to onboarding, như A1–A9). Onboarding → <b>Team queue / Hàng đợi nhóm</b> → Whose work = <b>Everyone</b> → tìm tên → <b>Done… / Xong…</b> → đọc gợi ý → chọn <b>1099 · Independent loan officer</b> → <b>Mark done / Đánh dấu xong</b> (hỏi “Do it anyway?” thì đồng ý).", "Gợi ý “MOSO has 1099 from the registration form”. Có câu “MOSO builds the agreement from this choice…”. ≤5 phút: gửi MOSO xong.", "LO <b>NC1 · QA Tencindie</b> (registered as <b>Independent (1099)</b>) (registered → recruiter Claim → Log result Interested → Yes, prepare offer 6/3 → Send to onboarding, as A1–A9). Onboarding → <b>Team queue</b> → Whose work = <b>Everyone</b> → search the name → <b>Done…</b> → read the hint → <b>1099 · Independent loan officer</b> → <b>Mark done</b> (accept “Do it anyway?” if asked).", "Hint “MOSO has 1099 from the registration form”. Note “MOSO builds the agreement from this choice…”. Within ≤5 min sent to MOSO."),
    S("C1S", "LO", "LO QA Tencindie: chờ email “Complete These Initial Steps” (5–30 phút) → trả phí (💳) → ký Inkless (✍️) — hợp đồng 1099 bắt gõ ngày hiệu lực <code>10/10/2026</code> + địa chỉ <code>123 Test Street, Dallas, TX 75201</code>.", "Trang ký ghi “Independent Loan Officer (1099)”; recruit lên Signed → <b>Joined</b> trong ~1 phút. Bản nháp HR: loại hợp đồng = contract (“Independent Contractor W-9”).", "LO QA Tencindie: wait for “Complete These Initial Steps” (5–30 min) → pay (💳) → sign in Inkless (✍️) — the 1099 agreement asks for effective date <code>10/10/2026</code> + address <code>123 Test Street, Dallas, TX 75201</code>.", "Signing page says “Independent Loan Officer (1099)”; recruit reaches Signed → <b>Joined</b> in ~1 min. HR draft: contract type (“Independent Contractor W-9”)."),
    S("C2", "ONB", "LO <b>NC2 · QA Tenccorp</b> (đã đăng ký → recruiter Claim → Log result Interested → Yes, prepare offer 6/3 → Send to onboarding, như A1–A9). Onboarding → <b>Team queue / Hàng đợi nhóm</b> → Whose work = <b>Everyone</b> → tìm tên → <b>Done… / Xong…</b> → chọn <b>Corporate</b> → <b>Mark done / Đánh dấu xong</b>.", "Ghi chú “Corporate and Mortgage advisor staff don't sign…”. Ghi lại vào ô ghi chú: chữ hệ hiện sau khi gửi MOSO và trang LO hiện gì. <b>Ghi chú:</b> recruit sắp chỉ còn <b>W-2</b> và <b>1099</b> (PR đang làm). Trang LO hiện lựa chọn W-2/1099 mà <b>chính LO chọn lúc đăng ký</b> — recruit không đổi nó cho Corporate/Mortgage advisor. Ghi lại trang hiện cái nào.", "LO <b>NC2 · QA Tenccorp</b> (registered → recruiter Claim → Log result Interested → Yes, prepare offer 6/3 → Send to onboarding, as A1–A9). Onboarding → <b>Team queue</b> → Whose work = <b>Everyone</b> → search the name → <b>Done…</b> → <b>Corporate</b> → <b>Mark done</b>.", "Note “Corporate and Mortgage advisor staff don't sign…”. Record in the note what shows after the MOSO send and on the LO page. <b>Note:</b> recruit will offer only <b>W-2</b> and <b>1099</b> (PR in progress). The LO page shows the W-2/1099 the <b>LO picked at registration</b> — recruit does not change it for Corporate/Mortgage advisor. Record which one it shows."),
    S("C3", "ONB", "LO <b>NC3 · QA Tencadvisor</b> (đã đăng ký → recruiter Claim → Log result Interested → Yes, prepare offer 6/3 → Send to onboarding, như A1–A9). Onboarding → <b>Team queue / Hàng đợi nhóm</b> → Whose work = <b>Everyone</b> → tìm tên → <b>Done… / Xong…</b> → chọn <b>Mortgage advisor</b> → <b>Mark done / Đánh dấu xong</b>.", "Như C2 — ghi lại chữ hiển thị. <b>Ghi chú:</b> recruit sắp chỉ còn <b>W-2</b> và <b>1099</b> (PR đang làm). Trang LO hiện lựa chọn W-2/1099 mà <b>chính LO chọn lúc đăng ký</b> — recruit không đổi nó cho Corporate/Mortgage advisor. Ghi lại trang hiện cái nào.", "LO <b>NC3 · QA Tencadvisor</b> (registered → recruiter Claim → Log result Interested → Yes, prepare offer 6/3 → Send to onboarding, as A1–A9). Onboarding → <b>Team queue</b> → Whose work = <b>Everyone</b> → search the name → <b>Done…</b> → <b>Mortgage advisor</b> → <b>Mark done</b>.", "As C2 — record the text shown. <b>Note:</b> recruit will offer only <b>W-2</b> and <b>1099</b> (PR in progress). The LO page shows the W-2/1099 the <b>LO picked at registration</b> — recruit does not change it for Corporate/Mortgage advisor. Record which one it shows."),
    S("C4", "ONB", "LO <b>NC4 · QA Tencswitch</b> (đăng ký <b>Outside (W-2)</b>) (đã đăng ký → recruiter Claim → Log result Interested → Yes, prepare offer 6/3 → Send to onboarding, như A1–A9). Onboarding → <b>Team queue / Hàng đợi nhóm</b> → Whose work = <b>Everyone</b> → tìm tên → <b>Done… / Xong…</b> → chọn <b>1099 · Independent loan officer</b> → <b>Mark done / Đánh dấu xong</b>. LO trả phí + ký Inkless (trang ký phải ghi 1099). Ghi giờ ký xong; đợi tới lượt cron đối soát kế tiếp (:00/:20/:40) + 2 phút → tải lại hồ sơ.", "Có gợi ý W-2 từ form. Trang ký ghi “Independent Loan Officer (1099)”. Recruit: Signed + <b>Joined</b> (ngay ~1 phút; nếu MOSO đẩy về bị lạc thì chậm nhất sau một lượt cron 20 phút — Activity ghi System). HR nhận loại 1099 (“Independent Contractor W-9”).", "LO <b>NC4 · QA Tencswitch</b> (registered <b>Outside (W-2)</b>) (registered → recruiter Claim → Log result Interested → Yes, prepare offer 6/3 → Send to onboarding, as A1–A9). Onboarding → <b>Team queue</b> → Whose work = <b>Everyone</b> → search the name → <b>Done…</b> → <b>1099 · Independent loan officer</b> → <b>Mark done</b>. LO pays + signs in Inkless (page must say 1099). Note the time signing finished; wait until the next reconcile run (:00/:20/:40) + 2 min → reload.", "Hint shows W-2 from the form. Signing page says “Independent Loan Officer (1099)”. Recruit: Signed + <b>Joined</b> (in ~1 min; if MOSO's push got lost, at the latest after one 20-min reconcile run — Activity says System). HR gets 1099 (“Independent Contractor W-9”).", { vi: "8r58m #612: cron đối soát chạy trên staging; chưa ai thấy nó tự sửa một LO thật — ghi lại nếu phải chờ cron", en: "8r58m #612: reconcile runs on staging; nobody has seen it heal a real LO yet — note it if you had to wait for the cron" }),
    S("C5", "ONB", "Mở <b>Done…</b> trên một LO khác ở Team queue nhưng KHÔNG chọn loại nào.", "Nút <b>Mark done / Đánh dấu xong</b> khoá, gợi ý “Pick W-2, 1099, Corporate or Mortgage advisor first.” / “Hãy chọn W-2, 1099, Corporate hoặc Mortgage advisor trước.”", "Open <b>Done…</b> on another LO in Team queue and pick NO type.", "<b>Mark done</b> disabled, hint “Pick W-2, 1099, Corporate or Mortgage advisor first.”"),
    S("C6", "ONB", "Trong hộp Done… mở lịch <b>Meeting date</b> và thử bấm một ngày trong tương lai (vd ngày mai).", "Hôm nay đã được chọn sẵn (tô cam); các ngày tương lai bị mờ, KHÔNG bấm được — nên không có chữ báo lỗi. (Nếu chọn được ngày tương lai: phải báo “The meeting has to have happened already. Pick today or an earlier day.”)", "In Done… open the <b>Meeting date</b> calendar and try a future day (e.g. tomorrow).", "Today is preselected (orange); future days are greyed and NOT clickable — so no error text. (If a future day could be picked it must say “The meeting has to have happened already. Pick today or an earlier day.”)")
  ] });

CASES.push({ id: "D", group: G_FLOW, short: { vi: "Bang & giấy phép", en: "States & licences" },

    S("D2", "LO", "Đăng ký tay LO <b>ND1 · QA Tendcal</b> (khối 🆕) nhưng Licensed + sponsor state = <b>California</b>; thử Next khi bỏ trống câu DRE, rồi điền DRE <code>02123456</code>.", "Form hỏi thêm câu DRE (California); bỏ trống thì báo lỗi bắt buộc; điền thì gửi được (“You're done for now…”).", "Register <b>ND1 · QA Tendcal</b> by hand (🆕 block) with licensed + sponsor state = <b>California</b>; try Next with the DRE question empty, then DRE <code>02123456</code>.", "The form asks DRE questions (California); empty → required error; filled → submits (“You're done for now…”)."),

    S("D3b", "LO", "Form cũ <code>www.viet18.com/register-loan-officer</code> (email mới bất kỳ chưa dùng, vd <code>bao.trinh+t10d3b@loanfactory.com</code>, KHÔNG bấm gửi cuối): sponsor chọn <b>Texas + Arkansas + Nebraska</b> → không trả lời câu xác nhận → bấm Submit/Next; rồi bấm <b>Cancel</b>. Lặp ở <code>/register-loan-officer-v1</code> (Part 2, Texas + South Carolina).", "Không gửi được, chữ đỏ “Confirm to keep SC, AR or NE … or choose Cancel to remove them.” Bấm Cancel → chỉ còn Texas, cảnh báo biến mất. -v1: Next bị chặn cùng thông báo; Cancel → chỉ còn Texas.", "Legacy <code>www.viet18.com/register-loan-officer</code> (any unused email, e.g. <code>bao.trinh+t10d3b@loanfactory.com</code>, do NOT finish): sponsor <b>Texas + Arkansas + Nebraska</b> → leave the confirm unanswered → Submit/Next; then <b>Cancel</b>. Repeat on <code>/register-loan-officer-v1</code> (Part 2, Texas + South Carolina).", "Not sent, red “Confirm to keep SC, AR or NE … or choose Cancel to remove them.” Cancel → only Texas left, warning gone. -v1: Next blocked with the same text; Cancel → only Texas."),

  ] });
