  steps: [
    S("E1", "REC", "Recruit → <b>Pipeline</b> → tab <b>All</b> → ô tìm gõ <code>QA E</code>. Đọc cột <b>Source</b> + dòng phụ của QA Eform, Ewebinar, Ereferred, Eparty, Esummit, Ejoin, Erecruit, Elopage, Eformvone.", "Web form: Eform, Elopage, Eformvone. <b>Webinar</b> + “Webinar session: Nov 18”: Ewebinar. <b>After Party · Houston · Nov 3</b>: Eparty. <b>Summit</b>: Esummit. <b>Referral</b>: Ereferred. Ejoin (/join), Erecruit (/recruit): Referral, chủ = HH Test Headhunter nên KHÔNG nằm trong Hot leads. LO chưa có số có nhãn “Check production first”. Đọc được cả giao diện tối.", "Recruit → <b>Pipeline</b> → <b>All</b> tab → search <code>QA E</code>. Read <b>Source</b> + sub-line of QA Eform, Ewebinar, Ereferred, Eparty, Esummit, Ejoin, Erecruit, Elopage, Eformvone.", "Web form: Eform, Elopage, Eformvone. <b>Webinar</b> + “Webinar session: Nov 18”: Ewebinar. <b>After Party · Houston · Nov 3</b>: Eparty. <b>Summit</b>: Esummit. <b>Referral</b>: Ereferred. Ejoin (/join), Erecruit (/recruit): Referral, owned by HH Test Headhunter so NOT in Hot leads. LOs without numbers say “Check production first”. Readable in dark mode too."),
    { ...S("E1b", "LO", "<b>ze4kn · recruit-be #608 (V240)</b> — Cửa sổ ẩn danh → <code>www.viet18.com/refer/refer-a-loan-officer</code> → giới thiệu LO <b>NT1 · QA Tentrefer</b> (<code>bao.trinh+t10t1@loanfactory.com</code>, <code>(714) 555-1266</code>); Your name <code>Bao Trinh HH</code>, Your email <code>bao.trinh+hh@loanfactory.com</code> → Submit. Đợi ~1 phút → Recruit (Manager) → ô tìm <code>Tentrefer</code> → mở hồ sơ.", "LO mới ở <b>Not started (S0)</b>, chip <b>Referral</b>, Owner = Unowned, <b>0 offer</b>, nằm trong <b>Hot leads / Kho HOT</b> chờ claim (KHÔNG còn vào thẳng Onboarding với offer SENT). Hot leads ghi “Referral · Referred by HH Test Headhunter ✓”.", "<b>ze4kn · recruit-be #608 (V240)</b> — Incognito → <code>www.viet18.com/refer/refer-a-loan-officer</code> → refer <b>NT1 · QA Tentrefer</b> (<code>bao.trinh+t10t1@loanfactory.com</code>, <code>(714) 555-1266</code>); Your name <code>Bao Trinh HH</code>, Your email <code>bao.trinh+hh@loanfactory.com</code> → Submit. Wait ~1 min → Recruit (Manager) → search <code>Tentrefer</code> → open.", "A new LO at <b>Not started (S0)</b>, chip <b>Referral</b>, Owner = Unowned, <b>0 offers</b>, sitting in <b>Hot leads</b> for a claim (NO longer straight to Onboarding with a SENT offer). Hot leads reads “Referral · Referred by HH Test Headhunter ✓”."), as: "mgr" },
    S("E1c", "HH", "Headhunter → <b>Pipeline</b> → bộ lọc “<b>Who collected the lead</b>” = <b>Collected by me</b>.", "Thấy QA Ejoin, QA Erecruit, QA Wjoinclean (từ <code>/join/bao-trinhhh</code>, <code>/recruit/bao-trinhhh</code>) với pill “Your candidates”, Headhunter là chủ.", "Headhunter → <b>Pipeline</b> → “<b>Who collected the lead</b>” = <b>Collected by me</b>.", "QA Ejoin, QA Erecruit, QA Wjoinclean (from <code>/join/bao-trinhhh</code>, <code>/recruit/bao-trinhhh</code>) with the “Your candidates” pill, owned by the Headhunter."),
    S("E2", "LO", "Đăng ký LO <b>NE1 · QA Tenereg</b> theo khối 🆕 ở <code>www.viet18.com/register-loan-officer</code> (đủ từng ô như khối hướng dẫn).", "URL thêm <code>?key=…</code>; trang “You're done for now…”. Trong 1–3 phút LO hiện ở Hot leads với chip <b>Web form</b>.", "Register <b>NE1 · QA Tenereg</b> per the 🆕 block at <code>www.viet18.com/register-loan-officer</code> (every field as listed).", "URL gets <code>?key=…</code>; page “You're done for now…”. Within 1–3 min the LO is in Hot leads with chip <b>Web form</b>."),
    S("E2b", "LO", "Đóng tab, mở lại đúng URL <code>?key=…</code> của QA Tenereg ở cửa sổ ẩn danh MỚI.", "Về đúng bước Pay (“You're done for now…”); bấm quay lại bước 2 thấy dữ liệu còn nguyên.", "Close the tab, reopen QA Tenereg's <code>?key=…</code> URL in a NEW incognito window.", "Lands on the Pay step (“You're done for now…”); step 2 still holds the data."),
    S("E3", "LO", "Đăng ký LO <b>NE2 · QA Tenevone</b> ở <code>www.viet18.com/register-loan-officer-v1</code> (Before You Begin → 4 phần: Personal information / License and states / Compensation and online / Referral and confirm → <b>Check your answers</b> → Submit). Rồi mở <code>-v2</code> chỉ để nhìn (không gửi).", "v1: hero sáng, thanh hành trình 8 bước, lưu sau phần 4, trang Check your answers nhãn trái / giá trị phải. Kết quả như E2 (chip Web form trong 1–3 phút).", "Register <b>NE2 · QA Tenevone</b> at <code>www.viet18.com/register-loan-officer-v1</code> (Before You Begin → 4 parts: Personal information / License and states / Compensation and online / Referral and confirm → <b>Check your answers</b> → Submit). Then look at <code>-v2</code> (don't submit).", "v1: light hero, 8-step journey track, saved after part 4, Check your answers label left / value right. Same result as E2 (Web form chip within 1–3 min)."),
    S("E4", "LO", "Trên form: bỏ trống lần lượt từng ô có dấu *; Website = <b>Yes</b> rồi nhập <code>http://abc.com</code> rồi <code>https://abc.com</code>; Website = No mà không tick ô đồng ý.", "Báo lỗi đúng ô; Yes bắt phải https://; ô “I agree to obtain Loan Factory's approval…” bắt buộc kể cả khi chọn No (“Please check the website approval checkbox”).",
      "On the form: empty each * field in turn; Website = <b>Yes</b> with <code>http://abc.com</code> then <code>https://abc.com</code>; Website = No without the agree box.", "Errors on the right fields; Yes requires https://; “I agree to obtain Loan Factory's approval…” is required even with No (“Please check the website approval checkbox”)."),
    S("E5", "LO", "Đăng ký ở trang của một LO: <code>www.viet18.com/1099v1testcase/register-loan-officer</code> với <code>bao.trinh+t10e5@loanfactory.com</code>, <code>(714) 555-1273</code>, NMLS <code>9931273</code>, tên <code>QA Tenelopage</code>.", "Lead vào recruit (1–3 phút); ô “Referred by” trên hồ sơ có thể ghi LO 1099v1 Testcase.", "Register on an LO's page: <code>www.viet18.com/1099v1testcase/register-loan-officer</code> with <code>bao.trinh+t10e5@loanfactory.com</code>, <code>(714) 555-1273</code>, NMLS <code>9931273</code>, name <code>QA Tenelopage</code>.", "Lead reaches recruit (1–3 min); profile “Referred by” may show LO 1099v1 Testcase."),
    S("E6", "LO", "Đăng ký LẠI bằng email của QA Tenmain (<code>bao.trinh+t10a1@loanfactory.com</code>, LO case A — phải đang ở Onboarding trở lên) nhưng Last name = <code>Tenmainnew</code>.", "Recruit KHÔNG tạo ứng viên mới. Vì LO đã ở Onboarding: tên KHÔNG bị ghi đè; hồ sơ hiện “Registration says QA Tenmainnew — confirm?” với <b>Use this name</b> / <b>Keep current</b>; chuông cho recruiter chủ và Onboarding; My work today có chip “<b>Signed up again</b>”.", "Register AGAIN with QA Tenmain's email (<code>bao.trinh+t10a1@loanfactory.com</code>, case A LO — must be at Onboarding or later) but Last name = <code>Tenmainnew</code>.", "No new candidate. Because the LO is at Onboarding the name is NOT overwritten; profile “Registration says QA Tenmainnew — confirm?” with <b>Use this name</b> / <b>Keep current</b>; bells to owner and Onboarding; My work today chip “<b>Signed up again</b>”."),
    S("E6b", "REC", "Trên hồ sơ QA Tenmain bấm <b>Keep current</b>.", "Thông báo biến mất; Profile → Edit → tab <b>History / Lịch sử</b> ghi “Registered again on {ngày} · name …”.", "On QA Tenmain's profile click <b>Keep current</b>.", "The notice goes away; Profile → Edit → <b>History</b> tab logs “Registered again on {date} · name …”."),
    S("E7", "LO", "(Tuỳ chọn, có reCAPTCHA — làm tay) Mở <code>www.viet18.com/after-party-event/2026/november/texas</code> (email <code>bao.trinh+t10e7a@loanfactory.com</code>, <code>(714) 555-1274</code>, NMLS <code>9931274</code>), <code>/loan-officer</code> chọn buổi webinar (email <code>bao.trinh+t10e7b@loanfactory.com</code>, <code>(714) 555-1276</code>, NMLS <code>9931276</code>), <code>/join/bao-trinhhh</code> (email <code>bao.trinh+t10e7c@loanfactory.com</code>, <code>(714) 555-1277</code>, NMLS <code>9931277</code>). Tên: <code>QA Teneparty</code>, <code>QA Tenewebinar</code>, <code>QA Tenejoin</code>.", "Mỗi trang tạo đúng nguồn: “After Party · Houston · Nov …” / “Webinar · Webinar session: …” / Referral + chủ Headhunter (1–3 phút).", "(Optional, reCAPTCHA — by hand) Open <code>www.viet18.com/after-party-event/2026/november/texas</code> (email <code>bao.trinh+t10e7a@loanfactory.com</code>, <code>(714) 555-1274</code>, NMLS <code>9931274</code>), <code>/loan-officer</code> picking a webinar (email <code>bao.trinh+t10e7b@loanfactory.com</code>, <code>(714) 555-1276</code>, NMLS <code>9931276</code>), <code>/join/bao-trinhhh</code> (email <code>bao.trinh+t10e7c@loanfactory.com</code>, <code>(714) 555-1277</code>, NMLS <code>9931277</code>). Names: <code>QA Teneparty</code>, <code>QA Tenewebinar</code>, <code>QA Tenejoin</code>.", "Each page yields its source: “After Party · Houston · Nov …” / “Webinar · Webinar session: …” / Referral owned by the Headhunter (1–3 min).")

CASES.push({ id: "F", group: G_LEAD, short: { vi: "Kết quả cuộc gọi", en: "Call results" },
  title: { vi: "Kết quả cuộc gọi và bước tiếp theo", en: "Call results and next steps" },

  los: ["F1", "F2", "F3", "F4", "F5", "F6", "F7", "F9"], acc: ["rec", "onbG", "admin"], res: ["time", "settings"],
  loNote: { vi: "Tất cả đã do <code>bao.trinh+recruiter</code> claim (New lead). Mở khung: nút <b>Log result</b> trên hồ sơ, menu ⋯ trên dòng My work today, hoặc Focus mode.", en: "All are claimed by <code>bao.trinh+recruiter</code> (New lead). Open the wizard: <b>Log result</b> on the profile, the ⋯ menu on a My work today row, or Focus mode." },
  lock: true,
  steps: [
    S("F1", "REC", "LO <b>NF1 · QA Tenfcall</b>. Recruiter: Hot leads → <b>Claim</b> LO → mở hồ sơ → <b>Log result / Ghi kết quả</b> → <b>Interested</b> → <b>Call again / Gọi lại</b> → mở lịch xem ngày nhỏ nhất; chọn hôm nay với giờ đã qua; rồi chọn ngày làm việc kế tiếp, giờ <b>00:00</b> VN của hôm sau (= 10:00 AM PT) → <b>Schedule call again</b>.", "Ngày trước hôm nay (giờ LA) không chọn được; giờ đã qua bị mờ; cố lưu giờ quá khứ: “That moment has already passed. Pick a time still to come.” Lưu được: toast “<b>Next step saved</b>”; stage lên <b>Engaged</b>; hồ sơ “Next step: Call again · …”.", "LO <b>NF1 · QA Tenfcall</b>. Recruiter: Hot leads → <b>Claim</b> the LO → open the profile → <b>Log result</b> → <b>Interested</b> → <b>Call again</b> → open the date picker; try today at a past time; then the next business day at <b>00:00</b> VN of the following day (= 10:00 AM PT) → <b>Schedule call again</b>.", "Days before today (LA) disabled; past slots greyed; a past time is refused: “That moment has already passed. Pick a time still to come.” Saved: toast “<b>Next step saved</b>”; stage <b>Engaged</b>; profile “Next step: Call again · …”."),
    S("F2", "REC", "LO <b>NF2 · QA Tenfnoans</b>. Recruiter: Hot leads → <b>Claim</b> LO → mở hồ sơ → <b>Log result / Ghi kết quả</b> → <b>No answer / Không bắt máy</b>.", "Hiện “Retry calls: {ngày} → {ngày} → …” theo thang 3/5/10/30 ngày, ngày rơi vào thứ 7/CN dời sang thứ 2. Bấm <b>Save — schedule retry</b> → toast “<b>Retry call scheduled for {ngày}</b>”. Stage vẫn New lead.", "LO <b>NF2 · QA Tenfnoans</b>. Recruiter: Hot leads → <b>Claim</b> the LO → open the profile → <b>Log result</b> → <b>No answer</b>.", "Shows “Retry calls: {date} → {date} → …” on the 3/5/10/30-day ladder, weekend dates moved to Monday. <b>Save — schedule retry</b> → toast “<b>Retry call scheduled for {date}</b>”. Stage stays New lead."),
    S("F3", "REC", "LO <b>NF3 · QA Tenfneutral</b>. Recruiter: Hot leads → <b>Claim</b> LO → mở hồ sơ → <b>Log result / Ghi kết quả</b> → <b>Neutral / Trung lập</b> → đọc các thẻ “When should they come back?” → chọn <b>In 1 month</b> → <b>Move to Nurture</b>.", "Mỗi thẻ có ngày cụ thể (vd “In 1 month · Tue, Nov 10”). Toast “<b>Moved to Nurture until {ngày}</b>”; chip trạng thái <b>Nurture</b> (vòng stage xám); stage Engaged.", "LO <b>NF3 · QA Tenfneutral</b>. Recruiter: Hot leads → <b>Claim</b> the LO → open the profile → <b>Log result</b> → <b>Neutral</b> → read the “When should they come back?” cards → <b>In 1 month</b> → <b>Move to Nurture</b>.", "Each card shows a date (e.g. “In 1 month · Tue, Nov 10”). Toast “<b>Moved to Nurture until {date}</b>”; status chip <b>Nurture</b> (grey stage circle); stage Engaged."),
    S("F4", "REC", "LO <b>NF4 · QA Tenfnotinto</b>. Recruiter: Hot leads → <b>Claim</b> LO → mở hồ sơ → <b>Log result / Ghi kết quả</b> → <b>Not interested</b> → không chọn lý do (xem nút); chọn “<b>Other</b>” mà để trống Note; gõ Note <code>QA not now</code> → <b>Archive candidate</b>.", "Chưa có lý do: nút khoá; Other bắt Note. Xong: toast “<b>Archived</b>”, trạng thái Archived, LO rời My work today.", "LO <b>NF4 · QA Tenfnotinto</b>. Recruiter: Hot leads → <b>Claim</b> the LO → open the profile → <b>Log result</b> → <b>Not interested</b> → no reason (see the button); “<b>Other</b>” with empty Note; Note <code>QA not now</code> → <b>Archive candidate</b>.", "No reason → disabled; Other needs a Note. Done: toast “<b>Archived</b>”, status Archived, LO leaves My work today."),
    S("F5", "REC", "LO <b>NF5 · QA Tenfwebinar</b>. Recruiter: Hot leads → <b>Claim</b> LO → mở hồ sơ → <b>Log result / Ghi kết quả</b> → <b>Interested</b> → <b>Webinar</b> → “Which webinar?”.", "Danh sách buổi webinar staging (vd “HIEN TEST WEBINAR BEFORE 2 HOURS”, 18/11). Chọn → <b>Save webinar reminder</b> → toast “Next step saved”. Trong ≤5 phút MOSO ghi LO đăng ký buổi đó. <b>Nhắc việc:</b> sau bản sửa (PR đang làm) hệ tự đặt 2 follow-up: <b>1 ngày trước</b> và <b>1 ngày sau</b> buổi webinar (hiện tại: ngày làm việc kế tiếp). Thêm tay: hồ sơ → <b>Overview</b> → <b>Add follow-up</b> → chọn ngày → lưu (hoặc trên /today: nút <b>Add follow-up</b> của dòng).", "LO <b>NF5 · QA Tenfwebinar</b>. Recruiter: Hot leads → <b>Claim</b> the LO → open the profile → <b>Log result</b> → <b>Interested</b> → <b>Webinar</b> → “Which webinar?”.", "Staging webinar sessions (e.g. “HIEN TEST WEBINAR BEFORE 2 HOURS”, 18/11). Pick → <b>Save webinar reminder</b> → “Next step saved”. Within ≤5 min MOSO registers the LO. <b>Follow-ups:</b> after the fix (PR in progress) the app sets two follow-ups: <b>the day before</b> and <b>the day after</b> the session (today: the next business day). Add one by hand: profile → <b>Overview</b> → <b>Add follow-up</b> → pick a date → save (or on /today: the row’s <b>Add follow-up</b>)."),
    S("F6", "REC", "LO <b>NF6 · QA Tenfmeet</b>. Recruiter: Hot leads → <b>Claim</b> LO → mở hồ sơ → <b>Log result / Ghi kết quả</b> → <b>Interested</b> → <b>Meet 1-1 / Hẹn 1-1</b> → ngày làm việc kế tiếp, <b>00:00</b> VN hôm sau (= 10:00 AM PT) → “Meeting link or location” = <code>https://meet.google.com/test</code> → <b>Schedule 1-1</b> (hoặc <b>Open in Google Calendar</b>).", "Tài khoản chưa nối Google: dải “Connect Google in Settings → Connections…”, có nút mở Google Calendar điền sẵn. Lưu xong stage <b>Engaged</b>. <b>Nhắc việc:</b> follow-up đặt đúng giờ hẹn (không đổi) → LO hiện trên /today ngày họp. Thêm tay: hồ sơ → <b>Overview</b> → <b>Add follow-up</b>.", "LO <b>NF6 · QA Tenfmeet</b>. Recruiter: Hot leads → <b>Claim</b> the LO → open the profile → <b>Log result</b> → <b>Interested</b> → <b>Meet 1-1</b> → next business day, <b>00:00</b> VN the following day (= 10:00 AM PT) → “Meeting link or location” = <code>https://meet.google.com/test</code> → <b>Schedule 1-1</b> (or <b>Open in Google Calendar</b>).", "No Google: strip “Connect Google in Settings → Connections…”, prefilled Google Calendar button. After saving, stage <b>Engaged</b>. <b>Follow-ups:</b> the follow-up is due at the meeting time (unchanged) → the LO shows on /today that day. Add one by hand: profile → <b>Overview</b> → <b>Add follow-up</b>."),
    S("F7", "REC", "LO <b>NF7 · QA Tenfsend</b>. Recruiter: Hot leads → <b>Claim</b> LO → mở hồ sơ → <b>Log result / Ghi kết quả</b> → <b>Interested</b> → <b>Send info / Gửi info</b> → Send via <b>Email</b> → mở ô <b>Template</b> → chọn mẫu Team (vd “QA Claude r5 info template”) → <b>Send now</b> → <b>Save &amp; send</b>. Lần khác: gõ <code>{{first_name}}</code> vào nội dung.", "Ô mẫu chỉ có mẫu Team (KHÔNG còn mẫu “Onboarding 1-1 reminder”). Gửi: toast “<b>Email sent to QA Tenfsend</b>” + link <b>Open conversation</b>. Có <code>{{first_name}}</code> hoặc [ngoặc] chưa điền: <b>Save &amp; send</b> khoá + “Fill in {{first_name}} first, or edit before sending”.", "LO <b>NF7 · QA Tenfsend</b>. Recruiter: Hot leads → <b>Claim</b> the LO → open the profile → <b>Log result</b> → <b>Interested</b> → <b>Send info</b> → Send via <b>Email</b> → open <b>Template</b> → pick a Team template (e.g. “QA Claude r5 info template”) → <b>Send now</b> → <b>Save &amp; send</b>. Another time: type <code>{{first_name}}</code> in the body.", "Only Team templates listed (NO “Onboarding 1-1 reminder”). Sent: toast “<b>Email sent to QA Tenfsend</b>” + <b>Open conversation</b>. With <code>{{first_name}}</code> or an unfilled [bracket]: <b>Save &amp; send</b> disabled + “Fill in {{first_name}} first, or edit before sending”."),
    S("F7b", "REC", "Như F7: Send info → Email → chọn <b>Send now</b> → chọn Template (nội dung KHÔNG trống) → nhìn <b>đáy hộp thoại</b>: nút viền <b>Edit before sending</b> nằm bên trái nút cam <b>Save &amp; send</b> → bấm. (Chỉ hiện khi Send now + nội dung có chữ.) Lần khác chọn <b>Schedule for later</b> mà để trống ngày hoặc nội dung.", "Edit mở khung soạn đã điền sẵn. Schedule for later: Save khoá tới khi có ngày VÀ nội dung.", "As F7: Send info → Email → <b>Send now</b> → pick a template (body NOT empty) → at the <b>bottom of the dialog</b>, the outlined <b>Edit before sending</b> button left of the orange <b>Save &amp; send</b> → click it. (It shows only with Send now and a non-empty body.) Another time <b>Schedule for later</b> with empty date or body.", "Edit opens a prefilled composer. Schedule for later: Save disabled until both date AND body."),
    S("F8", "REC", "Trên LO bất kỳ của mình: Log result → <b>Interested</b> nhưng không chọn bước tiếp và không bấm Yes, prepare offer.", "Nút <b>Save call result</b> khoá — không lưu được.", "On any of your LOs: Log result → <b>Interested</b> without a next step and without Yes, prepare offer.", "<b>Save call result</b> disabled — cannot save."),
    S("F9", "ADMIN", "Bấm “Tôi đang đổi /settings” ở trên. Admin (<code>chauchau.inc@gmail.com</code>) → <b>Settings / Thông số</b> → mục <b>Follow-up</b> → <b>No-answer retry ladder</b>: xoá bớt nấc chỉ còn <code>1</code> → <b>Save ladder</b> → đợi 30 giây. Recruiter: LO <b>NF9 · QA Tenfladder</b> (Claim) → Log result → <b>No answer</b> → Save; rồi Log result → <b>No answer</b> lần 2.", "Lần 2 hiện “<b>No more automatic retries — pick the next step</b>”; My work today ghi “No answer after 2 tries · pick the next step”.", "Press “I'm changing /settings” above. Admin (<code>chauchau.inc@gmail.com</code>) → <b>Settings</b> → <b>Follow-up</b> → <b>No-answer retry ladder</b>: remove rungs down to <code>1</code> → <b>Save ladder</b> → wait 30 s. Recruiter: <b>NF9 · QA Tenfladder</b> (Claim) → Log result → <b>No answer</b> → Save; then <b>No answer</b> again.", "The 2nd time shows “<b>No more automatic retries — pick the next step</b>”; My work today reads “No answer after 2 tries · pick the next step”."),
    S("F9b", "ADMIN", "TRẢ LẠI thang <code>3, 5, 10, 30</code> (nút <b>Add a rung</b>) → <b>Save ladder</b> → tải lại trang → bấm nhả khoá.", "Preview “1st no answer → 3 days later …” đúng 4 nấc; “Changed by … on …”.", "RESTORE the ladder to <code>3, 5, 10, 30</code> (<b>Add a rung</b>) → <b>Save ladder</b> → reload → release the lock.", "Preview “1st no answer → 3 days later …” with 4 rungs; “Changed by … on …”.")
  ] });

CASES.push({ id: "G", group: G_LEAD, short: { vi: "SMS / email", en: "SMS / email" },
  title: { vi: "Nhắn tin qua lại Recruiter ↔ LO (SMS, email) và cổng chặn liên lạc", en: "Messaging Recruiter ↔ LO (SMS, email) and the contact gate" },
  goal: { vi: "Gửi và nhận trong hội thoại của recruit; LO đã STOP / không có số / vai không được nhắn bị chặn đúng.", en: "Send and receive inside recruit's conversation; STOP-ed LOs / no phone / roles without rights are blocked correctly." },
  los: ["TVB", "G3", "G4"], acc: ["recSms", "rec", "onb"], res: ["sms", "emailReply"],
  loNote: { vi: "G3 đã bị đánh dấu “opted out of texts” (STOP_SMS). G4 đăng ký không có SĐT. SMS hai chiều + email dùng LO có sẵn TRINH VU TRONG BAO (chủ manhadmin) — SĐT hiện là đường NIST, phải đổi tạm về (408) 538-1464 trước khi test SMS (G1), xong trả lại.", en: "G3 is marked “opted out of texts” (STOP_SMS). G4 registered without a phone. Two-way SMS + email use the existing LO TRINH VU TRONG BAO (owner manhadmin) — its phone is now the NIST line; switch it to (408) 538-1464 before SMS tests (G1), restore after." },
  steps: [
    S("G1", "RECSMS", "<b>Chuẩn bị SMS hai chiều:</b> SĐT hiện của <a href=\"https://recruit.viet18.com/candidates/07001ba1-360b-491f-b9e1-c1b45766739d\" target=\"_blank\" rel=\"noopener\">TRINH VU TRONG BAO</a> là đường NIST (không nhận SMS). manhadmin → hồ sơ đó → <b>Profile</b> → <b>Edit / Sửa</b> → tab <b>Identity / Thông tin cá nhân</b> → Phone = <code>(408) 538-1464</code> (đường Zoom trên Mac, cách đã đạt 08/10) → Save. Rồi bấm <b>Send text / Gửi tin nhắn</b>.", "Hệ kiểm trước rồi mở panel Omni TRONG APP (tab <b>Candidate &amp; parties / Ứng viên &amp; các bên</b>), kênh SMS đã chọn.", "<b>Two-way SMS prep:</b> <a href=\"https://recruit.viet18.com/candidates/07001ba1-360b-491f-b9e1-c1b45766739d\" target=\"_blank\" rel=\"noopener\">TRINH VU TRONG BAO</a>'s phone is now the NIST line (no SMS). manhadmin → that profile → <b>Profile</b> → <b>Edit</b> → <b>Identity</b> tab → Phone = <code>(408) 538-1464</code> (the Zoom line on the Mac, as when it passed 08/10) → Save. Then click <b>Send text</b>.", "Pre-check, then the in-app Omni panel opens (<b>Candidate &amp; parties</b> tab) with SMS selected."),
    S("G1b", "RECSMS", "Gõ <code>QA 10/10 test 1</code> → Send → hộp “<b>Send outside the company?</b>” → Send.", "Trong 1 phút app Zoom trên Mac (số 1464) nhận tin. Activity → lọc Messages có dòng SMS gửi đi.", "Type <code>QA 10/10 test 1</code> → Send → “<b>Send outside the company?</b>” → Send.", "Within 1 min the Zoom app on the Mac (1464) gets it. Activity → Messages shows the outbound SMS."),
    S("G1c", "LO", "Trong Zoom (Phone → SMS) trả lời <code>QA 10/10 reply 1</code>. Xong cả G1–G1c + OM2 + Y12: đổi SĐT TRINH VU TRONG BAO về <code>+1 303-499-7111</code> (cho test gọi).", "Trong 1–2 phút tin hiện trong hội thoại với dải “…replied by SMS and is waiting on you”; Activity “SMS INBOUND”; bong bóng Omni góc dưới phải có số chưa đọc.", "Reply in Zoom (Phone → SMS) <code>QA 10/10 reply 1</code>. After G1–G1c + OM2 + Y12: set TRINH VU TRONG BAO's phone back to <code>+1 303-499-7111</code> (for call tests).", "Within 1–2 min it shows in the thread with “…replied by SMS and is waiting on you”; Activity “SMS INBOUND”; the Omni bubble bottom-right shows unread.", { vi: "jblm: tin giữa 2 số nội bộ có thể mất — gửi lại 1 lần", en: "jblm: may be lost between internal lines — resend once" }),
    S("G2", "RECSMS", "manhadmin → <a href=\"https://recruit.viet18.com/candidates/07001ba1-360b-491f-b9e1-c1b45766739d\" target=\"_blank\" rel=\"noopener\">TRINH VU TRONG BAO</a> → <b>Open conversation</b> → tab <b>Candidate &amp; parties</b> → <b>Email</b> → bấm chip “+ TRINH VU TRONG BAO” ở To → Subject để sẵn (“Message from Loan Factory · NMLS …”) → nội dung <code>QA G2 10/10 — please reply</code> → <b>Send email</b> → “Send outside the company?” → Send. Rồi hỏi Bao: trong Gmail <code>vutrongbao.trinh.ltb@gmail.com</code> (xem cả Spam) bấm Reply <code>G2 reply from LO</code>; đợi 2 phút, mở lại hội thoại.", "Phần 1 (ĐẠT 09/10): thư tới, From “Manh Admin (Loan Factory)” &lt;drive@viet18.com&gt;, Reply-To <code>cand-07001ba1-….@reply.viet18.com</code>. Phần 2: “G2 reply from LO” hiện trong hội thoại. <b>Hiện tại phần 2 BỊ CHẶN</b> (thư trả lời không tới người nhận — luật Google Workspace) → đánh <b>Lỗi</b> kèm “fexgs”.", "manhadmin → <a href=\"https://recruit.viet18.com/candidates/07001ba1-360b-491f-b9e1-c1b45766739d\" target=\"_blank\" rel=\"noopener\">TRINH VU TRONG BAO</a> → <b>Open conversation</b> → <b>Candidate &amp; parties</b> → <b>Email</b> → click the “+ TRINH VU TRONG BAO” chip in To → keep the Subject (“Message from Loan Factory · NMLS …”) → body <code>QA G2 10/10 — please reply</code> → <b>Send email</b> → “Send outside the company?” → Send. Then ask Bao: in Gmail <code>vutrongbao.trinh.ltb@gmail.com</code> (check Spam) Reply <code>G2 reply from LO</code>; wait 2 min, reopen the thread.", "Part 1 (PASSED 09/10): mail arrives, From “Manh Admin (Loan Factory)” &lt;drive@viet18.com&gt;, Reply-To <code>cand-07001ba1-….@reply.viet18.com</code>. Part 2: “G2 reply from LO” shows in the thread. <b>Part 2 is currently BLOCKED</b> (replies never reach the receiver — Google Workspace routing) → mark <b>Fail</b> with “fexgs”.", { vi: "CHẶN: agentflow-fexgs (định tuyến Google Workspace, hỏi anh Khải 12/10) — bước duy nhất chưa đạt", en: "BLOCKED: agentflow-fexgs (Google Workspace routing, ask Khai 12/10) — the only step not passed" }),
    S("G3", "REC", "Ô tìm <code>Gstop</code> → QA Gstop (đã STOP SMS) → bấm <b>Send text / Gửi tin nhắn</b>.", "Toast đỏ “<b>This person opted out of texts.</b>” (có Reason); không mở gì. <b>Send email</b> vẫn dùng được.", "Search <code>Gstop</code> → QA Gstop (STOPped SMS) → <b>Send text</b>.", "Red toast “<b>This person opted out of texts.</b>” (with Reason); nothing opens. <b>Send email</b> still works."),
    S("G4", "REC", "Ô tìm <code>Gnophone</code> → QA Gnophone → rê chuột vào <b>Call now</b> / <b>Send text</b>.", "Nút khoá, gợi ý “No phone on file…”.", "Search <code>Gnophone</code> → QA Gnophone → hover <b>Call now</b> / <b>Send text</b>.", "Disabled, hint “No phone on file…”."),
    S("G5", "REC", "<code>bao.trinh+recruiter</code> (không có Zoom) → hồ sơ LO của mình (vd LO case G <b>NG1 · QA Tengcontact</b> đã Claim) → <b>Send text</b>.", "Báo “You don't have a Zoom account linked…”; không gửi được SMS.", "<code>bao.trinh+recruiter</code> (no Zoom) → one of your LOs (e.g. case G <b>NG1 · QA Tengcontact</b>, claimed) → <b>Send text</b>.", "Says “You don't have a Zoom account linked…”; no SMS."),
    S("G6", "ONB", "<code>bao.trinh+onb-test</code> mở hội thoại của một LO mà mình KHÔNG phải specialist (vd ô tìm <code>Claudebulkb</code>) → thử SMS / Email.", "SMS và Email khoá với câu “<b>Texting is off in this panel. Your role can't send texts or emails to loan officers. Team chat still works.</b>”; tab <b>Team only</b> vẫn dùng được. (LO mà mình LÀ specialist thì nhắn được — xem OM4.)", "<code>bao.trinh+onb-test</code> opens the thread of an LO it is NOT the specialist for (e.g. search <code>Claudebulkb</code>) → try SMS / Email.", "SMS and Email locked: “<b>Texting is off in this panel. Your role can't send texts or emails to loan officers. Team chat still works.</b>”; <b>Team only</b> works. (For its own LO it can message — see OM4.)"),
    S("G7", "REC", "Hồ sơ LO của mình → <b>Overview</b> → ô <b>Internal note</b> → gõ <code>@Manh</code> chọn “Manh Admin” → thêm chữ <code>QA note 10/10</code> → <b>Add note</b>.", "Toast “Note added”; manhadmin nhận chuông “{bạn} mentioned you on {LO}”, bấm mở đúng hồ sơ.", "Your LO → <b>Overview</b> → <b>Internal note</b> → type <code>@Manh</code> pick “Manh Admin” → add <code>QA note 10/10</code> → <b>Add note</b>.", "Toast “Note added”; manhadmin gets the bell “{you} mentioned you on {LO}” that opens this profile.")
  ],
  fail: { vi: "Đừng bấm Remove trên tin của LO. Không thấy tin trả lời sau 2 lần gửi: ghi giờ VN + nội dung, nhờ dev tra (144v).", en: "Don't click Remove on an LO's message. No reply after 2 sends: note VN time + text, ask dev (144v)." } });

CASES.push({ id: "H", group: G_LEAD, short: { vi: "SLA & việc của manager", en: "SLA & manager tasks" },
  title: { vi: "SLA: chưa claim, quá hạn chạm đầu, chưa liên hệ, Remind, Take back, offer chờ quá lâu, sẵn sàng mà chưa gửi offer", en: "SLA: unclaimed, first touch late, not contacted, Remind, Take back, approval overdue, ready but no offer" },
  goal: { vi: "Phần lớn LO đã được tạo từ 07/10 nên đã TỰ quá hạn — chỉ cần mở ra kiểm. Phần cần hạ /settings có hướng dẫn + trả lại.", en: "Most LOs were created on 07/10 so they are ALREADY overdue — just open and check. Parts that need lower /settings include restore steps." },
  los: ["H2", "H3", "H4", "H10", "H11", "H12", "H5"], acc: ["mgr", "rec", "admin"], res: ["time", "settings"], lock: true,
  loNote: { vi: "H2, H3: chưa claim (tạo 07/10 lúc ~23:10 VN = trong giờ làm việc Pacific). H4, H10: recruiter claim nhưng không liên hệ. H11: offer chờ duyệt từ 07/10 ~23:16 VN (quá 24 giờ từ ~23:20 VN ngày 08/10). H12: Interested + bấm prepare offer nhưng KHÔNG gửi (sẵn sàng từ 07/10; quá 2 ngày từ ~23:20 VN ngày 09/10). H5: dữ liệu chưa dùng để tự đăng ký khi test hạ /settings.",
    en: "H2, H3: unclaimed (created 07/10 ~23:15 VN = Pacific business hours). H4, H10: claimed by the recruiter, never contacted. H11: offer waiting since 07/10 ~23:16 VN (over 24 h from ~23:20 VN on 08/10). H12: Interested + prepare offer but NOT sent (ready since 07/10; over 2 days from ~23:20 VN on 09/10). H5: unused data to register yourself for the lowered-/settings test." },
  steps: [
    S("H1", "MGR", "Manager → menu <b>Exceptions</b>.", "Các mục theo thứ tự: <b>Past their SLA</b>, <b>Unclaimed after 5 min</b>, <b>Claimed, not contacted yet</b>, <b>Ready to join, invite not sent</b>, (<b>Signed in MOSO, needs a decision</b> nếu có dòng). Mục Unclaimed có LO chưa claim (vd QA Hunclaimed, QA Hfirsttouch) với nút <b>Claim</b> và menu <b>Assign</b>. Ô <b>Pending approval</b> + link “N offers wait on your decision → My work today”.", "Manager → <b>Exceptions</b>.", "Sections in order: <b>Past their SLA</b>, <b>Unclaimed after 5 min</b>, <b>Claimed, not contacted yet</b>, <b>Ready to join, invite not sent</b>, (<b>Signed in MOSO, needs a decision</b> when it has rows). Unclaimed lists LOs (e.g. QA Hunclaimed, QA Hfirsttouch) with <b>Claim</b> and an <b>Assign</b> menu. <b>Pending approval</b> tile + link “N offers wait on your decision → My work today”."),
    S("H2", "MGR", "Đăng ký LO <b>NH1 · QA Tenhunclaimed</b> (khối 🆕), đợi 6 phút KHÔNG claim (trong giờ làm việc). Exceptions → dòng QA Tenhunclaimed → <b>Assign</b> → chọn <b>QA Test Recruiter</b> (<code>bao.trinh+recruiter</code>).", "Toast “<b>Assigned QA Tenhunclaimed — cleared from Exceptions and Hot leads</b>”; LO thành New lead của recruiter đó; recruiter nhận chuông.", "Register <b>NH1 · QA Tenhunclaimed</b> (🆕 block), wait 6 min WITHOUT claiming (inside business hours). Exceptions → QA Tenhunclaimed → <b>Assign</b> → <b>QA Test Recruiter</b> (<code>bao.trinh+recruiter</code>).", "Toast “<b>Assigned QA Tenhunclaimed — cleared from Exceptions and Hot leads</b>”; LO is that recruiter's New lead; the recruiter gets a bell."),
    S("H3", "REC", "Recruiter → <b>Hot leads / Kho HOT</b> → dòng QA Hfirsttouch (chưa claim từ 07/10).", "<b>First-touch due</b> ghi “Overdue …” màu đỏ (hạn web form = 1 giờ làm việc). Manager Exceptions: mục <b>Past their SLA</b> có QA Hfirsttouch.", "Recruiter → <b>Hot leads</b> → QA Hfirsttouch (unclaimed since 07/10).", "<b>First-touch due</b> reads “Overdue …” in red (web form = 1 business hour). Manager Exceptions: <b>Past their SLA</b> lists QA Hfirsttouch."),
    S("H4", "MGR", "Exceptions → mục <b>Claimed, not contacted yet</b>.", "Có QA Hnotcontacted, QA Htakeback với “Overdue by …” (hạn 4 giờ làm việc). My work today của recruiter ghi “Contact due …”. LO KHÔNG bị lấy lại tự động (auto-release đang TẮT).", "Exceptions → <b>Claimed, not contacted yet</b>.", "QA Hnotcontacted, QA Htakeback with “Overdue by …” (4 business hours). Recruiter's My work today reads “Contact due …”. NOT released automatically (auto-release is OFF)."),
    S("H5", "MGR", "Dòng QA Hnotcontacted → <b>Remind / Nhắc</b> → ô “Note for QA Test Recruiter (optional)” gõ <code>QA H5 call before noon</code> → <b>Send reminder</b>. Bấm lại ngay.", "Toast “<b>Reminded QA Test Recruiter to contact QA Hnotcontacted</b>”. Recruiter: chuông + dải “Your manager is waiting on 1 lead”. Bấm lại: nút xám “Reminded · again {giờ}” (60 phút).", "Row QA Hnotcontacted → <b>Remind</b> → “Note for QA Test Recruiter (optional)” = <code>QA H5 call before noon</code> → <b>Send reminder</b>. Click again.", "Toast “<b>Reminded QA Test Recruiter to contact QA Hnotcontacted</b>”. Recruiter: bell + strip “Your manager is waiting on 1 lead”. Again: greyed “Reminded · again {time}” (60 min)."),
    S("H6", "REC", "Recruiter → hồ sơ QA Hnotcontacted → <b>Log result</b> → <b>No answer</b> → <b>Save — schedule retry</b>.", "Dải nhắc biến mất; LO rời mục “Claimed, not contacted yet”.", "Recruiter → QA Hnotcontacted → <b>Log result</b> → <b>No answer</b> → <b>Save — schedule retry</b>.", "The reminder strip goes; LO leaves “Claimed, not contacted yet”."),
    S("H7", "MGR", "Dòng QA Htakeback → <b>Take back / Thu hồi</b> → hộp “Take this lead back?” → xác nhận.", "Hộp ghi “… goes back to Hot leads and {chủ} no longer owns it…”. Toast “<b>QA Htakeback is back in Hot leads</b>”; recruiter cũ nhận chuông; Activity “{manager} took this lead back from {owner}”.", "Row QA Htakeback → <b>Take back</b> → “Take this lead back?” → confirm.", "Dialog says “… goes back to Hot leads and {owner} no longer owns it…”. Toast “<b>QA Htakeback is back in Hot leads</b>”; old owner bell; Activity “{manager} took this lead back from {owner}”."),
    S("H8", "MGR", "Manager → <b>My work today</b> → khối <b>Waiting on your decision</b> → dòng <b>QA Hlateapproval</b> (offer chờ từ 07/10, hạn duyệt 24 giờ). Rồi mở hồ sơ của nó. KHÔNG bấm Approve. Muốn test lại với LO mới: recruiter gửi offer 4/2 (chờ duyệt) và quay lại sau 24 giờ (hoặc hạ “Review deadline…” = 1 giờ theo khối ⚙️, nhớ trả lại 24).", "Thời gian chờ (vd “1d 3h”) màu <b>ĐỎ</b> đậm (trước #421 là vàng). Hồ sơ có banner đỏ “<b>Offer approval is overdue</b>” — “Still waiting for a manager past the approval deadline. It stays pending and managers are reminded; it is never approved automatically.” Offer vẫn PENDING_APPROVAL (không tự duyệt, không tự hết hạn).", "Manager → <b>My work today</b> → <b>Waiting on your decision</b> → <b>QA Hlateapproval</b> (pending since 07/10, 24 h review deadline). Then open its profile. Do NOT Approve. To redo with a fresh LO: the recruiter sends a 4/2 offer (pending) and come back after 24 h (or lower “Review deadline…” to 1 h per the ⚙️ block, restore 24).", "Waiting time (e.g. “1d 3h”) in bold <b>RED</b> (gold before #421). Profile red banner “<b>Offer approval is overdue</b>” — “Still waiting for a manager past the approval deadline. It stays pending and managers are reminded; it is never approved automatically.” Offer stays PENDING_APPROVAL (no auto-approve, no expiry).", { vi: "H8 · recruit-fe #421 (đỏ)", en: "H8 · recruit-fe #421 (red)" }),
    S("H9", "REC", "Đăng ký LO <b>NH2 · QA Tenhready</b> → Claim → Log result → <b>Interested</b> → <b>Yes, prepare offer</b> → đóng modal Offer KHÔNG gửi. Rồi Recruiter → <b>My work today</b>.", "Dải xanh “<b>QA Tenhready is ready to join</b> · interested on the call {khi} — offer not sent yet” + nút <b>Prepare offer / Soạn offer</b>.", "Register <b>NH2 · QA Tenhready</b> → Claim → Log result → <b>Interested</b> → <b>Yes, prepare offer</b> → close the Offer modal WITHOUT sending. Then Recruiter → <b>My work today</b>.", "Green strip “<b>QA Tenhready is ready to join</b> · interested on the call {when} — offer not sent yet” + <b>Prepare offer</b>."),
    S("H10", "MGR", "Manager → <b>Exceptions</b> → mục “<b>Ready to join, invite not sent</b>” (ghi “Shows after 2 days”) → dòng QA Hreadyjoin (hoặc QA Tenhready sau 2 ngày) → bấm <b>Remind QA</b> (nút “Remind {tên}”) → ô ghi chú (để trống được) → <b>Send reminder</b>. Tải lại trang. Rồi đăng nhập recruiter xem chuông.", "Toast “<b>Reminded QA Test Recruiter to contact QA Hreadyjoin</b>”. Sau khi tải lại nút xám 60 phút (“Reminded · again {giờ}”). Activity “Manager reminder: send the invite to this candidate”. Recruiter nhận chuông “Reminder to send an invite — You were asked to send the invite to QA Hreadyjoin”.", "Manager → <b>Exceptions</b> → “<b>Ready to join, invite not sent</b>” (“Shows after 2 days”) → QA Hreadyjoin (or QA Tenhready after 2 days) → <b>Remind QA</b> (“Remind {name}”) → note (may be empty) → <b>Send reminder</b>. Reload. Then sign in as the recruiter and open the bell.", "Toast “<b>Reminded QA Test Recruiter to contact QA Hreadyjoin</b>”. After reload the button is grey for 60 min (“Reminded · again {time}”). Activity “Manager reminder: send the invite to this candidate”. The recruiter's bell: “Reminder to send an invite — You were asked to send the invite to QA Hreadyjoin”."),

  title: { vi: "Phần chạy nền / giới hạn của staging (V3, V5 nay test được)", en: "Background parts / staging limits (V3, V5 now testable)" },
  goal: { vi: "V3 và V5 nay làm được theo hướng dẫn. V1, V4, V6 là thông tin — đánh “Bỏ” nếu không làm.", en: "V3 and V5 are now runnable per the steps. V1, V4, V6 are information — mark “Skip” if not run." },

    S("V2", "DEV", "Licensing tự tick từ sự kiện HR.", "Chưa chạy: subscription HR update trên staging thiếu quyền (chờ Khải). Licensing tick tay.", "Licensing auto-tick from HR events.", "Not working: staging HR update subscription lacks IAM (waiting on Khải). Licensing is manual."),
    S("V3", "ADMIN", "Sau khi HR tạo nhân viên (A21 / M5): MOSO staging <code>www.viet18.com</code> (<code>chauchau.inc@gmail.com</code>) → hồ sơ LO → <b>Email History</b>.", "~1 phút sau HR tạo: dòng Welcome (template <code>invite_member_succeeded</code>, “Welcome to Chau Chau Inc, … Let's Get Started!”, có link set up profile) status “sent”. Hộp thư KHÔNG nhận vì staging bỏ thư từ <code>su@test.com</code> (đúng thiết kế) → ĐẠT nếu có dòng.", "After HR creates the employee (A21 / M5): MOSO staging <code>www.viet18.com</code> (<code>chauchau.inc@gmail.com</code>) → the LO record → <b>Email History</b>.", "~1 min after HR creates it: a Welcome row (template <code>invite_member_succeeded</code>, “Welcome to Chau Chau Inc, … Let's Get Started!”, with the set-up-profile link) status “sent”. Nothing in the inbox because staging drops mail from <code>su@test.com</code> (by design) → PASS if the row exists."),

    S("V6", "DEV", "Chuông recruit chép sang hộp thư chung của nền tảng (platform inbox).", "Mặc định tắt (RECRUIT_PLATFORM_INBOX_ENABLED). Nếu bật: chuông nền tảng nhận cùng tin trong ≤30 giây.", "Recruit bells mirrored to the platform inbox.", "Off by default (RECRUIT_PLATFORM_INBOX_ENABLED). When on: the platform bell gets the same item within ≤30 s.")

  acc: ["rec", "mgr", "onb", "admin"],
  steps: [
    S("AA1", "ANY", "<b>bnqmf · fe #421</b> — Thanh trên cùng: ô tìm “<b>Search candidates, NMLS, companies…</b>” (⌘K) gõ lần lượt <code>Claudereminder</code>, <code>9931887</code>, <code>bao.trinh+t08ch1@loanfactory.com</code>, <code>zzzqqq</code>; bấm một kết quả. Kiểm cả nút sáng/tối, chuông recruit, chuông nền tảng, app launcher, khối tên → Sign out.", "Nhóm “<b>Candidates / Ứng viên</b>”: “QA Claudereminder · NMLS 9931887 · bao.trinh+t08ch1@loanfactory.com” (tối đa 8 dòng); bấm mở đúng hồ sơ. <code>zzzqqq</code>: “No results”. Các nút khác đúng việc; Sign out về trang đăng nhập.", "<b>bnqmf · fe #421</b> — Top bar: “<b>Search candidates, NMLS, companies…</b>” (⌘K) with <code>Claudereminder</code>, <code>9931887</code>, <code>bao.trinh+t08ch1@loanfactory.com</code>, <code>zzzqqq</code>; click a result. Also light/dark, recruit bell, platform bell, app launcher, name block → Sign out.", "Group “<b>Candidates</b>”: “QA Claudereminder · NMLS 9931887 · bao.trinh+t08ch1@loanfactory.com” (up to 8 rows); click opens the profile. <code>zzzqqq</code>: “No results”. Other controls work; Sign out returns to sign-in."),

    S("RT10", "REC", "<b>#412</b> — My hand-offs ở 1440 px, dòng có nút <b>Remind manager</b>.", "Nút hiện đủ, không bị cắt mép phải, không cuộn ngang.", "<b>#412</b> — My hand-offs at 1440 px, a row with <b>Remind manager</b>.", "Button fully visible, not cut at the right edge, no sideways scroll."),

  loNote: { vi: "E6f (/join), E6g (/recruit), W1 (/join): đã tự thành của Headhunter (<code>headhunter.auto_own_enabled</code> đang BẬT trên staging). E6c: giới thiệu qua /refer (loại thưởng khác). Quy tắc thưởng: trang vào quyết định loại thưởng — /join, /recruit = thưởng chương trình (≥12 khoản vay 12 tháng mới tính); /refer = thưởng giới thiệu; thưởng chỉ khi LO Onboarded.", en: "E6f (/join), E6g (/recruit), W1 (/join): already owned by the Headhunter (<code>headhunter.auto_own_enabled</code> is ON on staging). E6c: referred via /refer (different bonus type). Bonus rule: the entry page decides — /join, /recruit = program bonus (≥12 loans in 12 months counts); /refer = referral bonus; only once the LO is Onboarded." },

    S("W4", "HH", "<b>Cần 2 người hoặc 2 cửa sổ.</b> (1) Bấm “Tôi đang đổi /settings”. (2) Chọn lúc giữa hai tick 5 phút (vd 01:16 VN — tick chạy :00/:05/:10…). (3) Admin → <b>Settings</b> → bật “<b>Return idle claimed leads automatically</b>” → Save. (4) Ngay lập tức Headhunter <code>bao.trinh+hh</code> → tải lại <b>My work today</b>, chụp màn hình. (5) Admin TẮT lại → Save → tải lại trang xác nhận TẮT, trước tick kế tiếp. (6) Nhả khoá.", "Lúc bật, My work today của Headhunter hiện “<b>Call before {giờ} or this lead goes back to the team</b>” (VI “Gọi trước {giờ}, nếu không lead này sẽ trả về cho team”) trên các lead tự nhận (vd QA Wjoinclean); lead không có SĐT: “Reach out before {giờ}…”. Sau khi tắt: setting = TẮT, không lead nào bị trả về.", "<b>Needs 2 people or 2 windows.</b> (1) Press “I'm changing /settings”. (2) Pick a moment between two 5-min ticks (e.g. 01:16 VN — ticks run :00/:05/:10…). (3) Admin → <b>Settings</b> → turn ON “<b>Return idle claimed leads automatically</b>” → Save. (4) Immediately the Headhunter <code>bao.trinh+hh</code> reloads <b>My work today</b>, screenshot. (5) Admin turns it OFF → Save → reload to confirm OFF, before the next tick. (6) Release the lock.", "While ON, the Headhunter's My work today shows “<b>Call before {time} or this lead goes back to the team</b>” on auto-owned leads (e.g. QA Wjoinclean); a lead without a phone: “Reach out before {time}…”. After: setting OFF, no lead released.", { vi: "Phải TẮT lại trước tick 5 phút kế tiếp", en: "Switch OFF before the next 5-minute tick" }),
    S("W5", "LO", "Đăng ký LẠI một email cũ qua <code>www.viet18.com/join/bao-trinhhh</code> (vd <code>bao.trinh+t08a2@loanfactory.com</code>) và một LO MỚI <b>NW1 · QA Tenwjoin</b> (<code>bao.trinh+t10w1@loanfactory.com</code>, <code>(714) 555-1246</code>, NMLS <code>9931246</code>).", "Email cũ KHÔNG bị chuyển cho Headhunter (đã có lịch sử). QA Tenwjoin → tự thành của HH Test Headhunter trong 1–3 phút. Lead trùng SĐT/email với LO khác cũng KHÔNG được tự nhận (đúng luật).", "Register an OLD email again via <code>www.viet18.com/join/bao-trinhhh</code> (e.g. <code>bao.trinh+t08a2@loanfactory.com</code>) and a FRESH LO <b>NW1 · QA Tenwjoin</b> (<code>bao.trinh+t10w1@loanfactory.com</code>, <code>(714) 555-1246</code>, NMLS <code>9931246</code>).", "The old email is NOT moved to the Headhunter. QA Tenwjoin → owned by HH Test Headhunter within 1–3 min. A lead sharing a phone/email with another LO is also NOT auto-owned (by rule)."),

    S("W7", "MGR", "Manager → My work today → <b>Waiting on your decision</b> → dòng QA Tenwjoin.", "Lý do: “Requested by a program member”, “Came through a program page”, “Collected through {tên}'s page”, và nếu 12 tháng &lt; 12: “{n} of 12 loans in 12 months: will not count toward the program bonus”.", "Manager → My work today → <b>Waiting on your decision</b> → QA Tenwjoin.", "Reasons: “Requested by a program member”, “Came through a program page”, “Collected through {name}'s page”, and if 12-month &lt; 12: “{n} of 12 loans in 12 months: will not count toward the program bonus”."),

};

<li>Ra 401 → tải lại trang (token tự làm mới) rồi dán lại đoạn ở bước 3. KHÔNG chép token ra ngoài, KHÔNG dán vào chat.</li>
<li>Gọi <code>fetch('/recruit-svc/…')</code> tương đối KHÔNG được (đó là trang Next.js, không phải API). Cách khác: tab Network → chuột phải một request <code>recruit-svc/api/v1/…</code> → <b>Copy → Copy as fetch</b> → sửa đường dẫn / method.</li>
<li>Chỉ chạy đúng lệnh ghi trong bước. Mọi lệnh API trong trang này phải bị TỪ CHỐI — nếu ra 200 ở bước ghi “phải 403/404” thì đánh <b>Lỗi</b> ngay và báo dev (có thể đã đổi dữ liệu thật).</li></ol>`,
  en: `<ol class="prep"><li>Sign in to recruit with the exact account of the step and open any <code>recruit.viet18.com</code> page.</li>
<li>Open DevTools (⌥⌘I) → <b>Console</b> → paste the snippet below (once per tab) → Enter. It reads the sign-in token from the browser and does NOT print it.</li>
<li><pre class="mono" style="white-space:pre-wrap">const tk=JSON.parse(localStorage.getItem('recruit-fe-auth-storage')).state.accessToken;
const api=(m,p,b)=>fetch('https://gateway.viet18.com/recruit-svc/api/v1'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:b?JSON.stringify(b):undefined}).then(async r=>console.log(m,p,'→',r.status,(await r.text()).slice(0,300)));</pre>${cp("const tk=JSON.parse(localStorage.getItem('recruit-fe-auth-storage')).state.accessToken;\nconst api=(m,p,b)=>fetch('https://gateway.viet18.com/recruit-svc/api/v1'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:b?JSON.stringify(b):undefined}).then(async r=>console.log(m,p,'→',r.status,(await r.text()).slice(0,300)));")}</li>
<li>Then type exactly the call in the step, e.g. <code>api('GET','/candidates/feb2759d-5083-4aaa-8533-797d24c7e880')</code>. The console prints the <b>status</b> (403 / 404 / 400 / 200) and the error in <code>"messages":[…]</code>. Put both in the note.</li>
<li>A 401 → reload the page (the token refreshes) and paste the snippet again. Never copy the token anywhere, never paste it into chat.</li>
<li>A relative <code>fetch('/recruit-svc/…')</code> does NOT work (that is the Next.js site, not the API). Alternative: Network tab → right-click a <code>recruit-svc/api/v1/…</code> request → <b>Copy → Copy as fetch</b> → edit path / method.</li>
<li>Run only the call written in the step. Every API call on this page must be REFUSED — a 200 where the step says “must be 403/404” is an immediate <b>Fail</b>: tell a dev (real data may have changed).</li></ol>` } };

    SA("roleOnb", "AC6", "ONBP", "Onboarding thuần gõ thẳng: <code>/pipeline</code>, <code>/inbox/hot</code>, <code>/inbox/cold</code>, <code>/dormant</code>. Ở Hot leads, nếu có nút <b>Claim</b> thì bấm thử một dòng.", "Cả bốn trang MỞ với TOÀN BỘ danh sách (mọi vai có CANDIDATE_READ đọc được mọi hồ sơ — " + D210.vi + "). Claim → toast lỗi “Missing permission CANDIDATE_CLAIM — ask an admin for a recruiting grant”, không ai thành chủ. Dormant: không có nút Revive.", "Pure Onboarding types: <code>/pipeline</code>, <code>/inbox/hot</code>, <code>/inbox/cold</code>, <code>/dormant</code>. On Hot leads, if a <b>Claim</b> button shows, try it on one row.", "All four OPEN with the FULL list (every role with CANDIDATE_READ reads every candidate — " + D210.en + "). Claim → error toast “Missing permission CANDIDATE_CLAIM — ask an admin for a recruiting grant”, nobody becomes owner. Dormant: no Revive button."),
    SA("roleOnb", "AC7", "ONBP", "Onboarding thuần gõ thẳng <code>/invites</code> rồi <code>/templates</code>.", "Cả hai tự về My work today (thiếu OFFER_REQUEST / TEMPLATE_CREATE), không toast.", "Pure Onboarding types <code>/invites</code> then <code>/templates</code>.", "Both bounce to My work today (no OFFER_REQUEST / TEMPLATE_CREATE), no toast."),
    S("AC8", "HH", "Headhunter gõ thẳng: <code>/work</code>, <code>/reports</code>, <code>/duplicates</code>, <code>/inbox/cold</code>, <code>/dormant</code>, <code>/conversations</code>.", "<code>/work</code> → về My work today. <code>/reports</code> → “Could not load the report” / “Không tải được báo cáo”. <code>/duplicates</code> → “Could not load duplicates” / “Không tải được danh sách trùng”. Cold / Dormant / Conversations: chỉ lead của HH, thường là trống (“No candidates match”, “Nobody is parked”, “No conversations yet”). KHÔNG lộ lead của người khác.", "Headhunter types: <code>/work</code>, <code>/reports</code>, <code>/duplicates</code>, <code>/inbox/cold</code>, <code>/dormant</code>, <code>/conversations</code>.", "<code>/work</code> → My work today. <code>/reports</code> → “Could not load the report”. <code>/duplicates</code> → “Could not load duplicates”. Cold / Dormant / Conversations: only the HH's own leads, usually empty (“No candidates match”, “Nobody is parked”, “No conversations yet”). NO other people's leads."),
    S("AC9", "REC", "<b>API (DevTools, khối 🛠️)</b>: <code>api('POST','/offers/bab81f0a-4e1f-45fa-92aa-951e23cd6b84/approve',{})</code>, rồi lần lượt thay <code>/approve</code> bằng <code>/send</code>, <code>/signed</code>, <code>/fee-paid</code>, <code>/waive-fee</code>. Cuối cùng mở hồ sơ QA Hlateapproval.", "<code>/approve</code>: <b>403</b> “Missing permission OFFER_APPROVE — ask an admin for a recruiting grant”. 4 cái còn lại: <b>404</b> (đã gỡ hẳn từ 10/10, PR be #617, D248 — với mọi role kể cả Manager). Offer vẫn <b>Waiting approval</b>, hồ sơ không có dòng Approved / Signed / Fee paid mới.", "<b>API (DevTools, 🛠️ block)</b>: <code>api('POST','/offers/bab81f0a-4e1f-45fa-92aa-951e23cd6b84/approve',{})</code>, then replace <code>/approve</code> with <code>/send</code>, <code>/signed</code>, <code>/fee-paid</code>, <code>/waive-fee</code>. Finally open QA Hlateapproval's profile.", "<code>/approve</code>: <b>403</b> “Missing permission OFFER_APPROVE — ask an admin for a recruiting grant”. The other four: <b>404</b> (removed 10/10, be PR #617, D248 — for every role incl. Manager). The offer is still <b>Waiting approval</b>, no new Approved / Signed / Fee paid row.", { vi: "S1 ĐÃ SỬA 10/10 (be #617 → prod 9a90f611): 4 API tạm bị gỡ", en: "S1 FIXED 10/10 (be #617 → prod 9a90f611): the 4 stub routes removed" }),
    S("AC10", "RECSMS", "<b>API</b> bằng manhadmin (không phải người xin, không phải chủ QA Hlateapproval): <code>api('POST','/offers/bab81f0a-4e1f-45fa-92aa-951e23cd6b84/decline?reason=QA%20AC10')</code> rồi <code>api('POST','/offers/bab81f0a-4e1f-45fa-92aa-951e23cd6b84/resend-invite',{})</code>.", "Decline: <b>403</b> “Only the requester, the lead's owner or a manager can decline this invite”. Resend: <b>403</b> (không phải người xin). Offer vẫn chờ duyệt.", "<b>API</b> as manhadmin (not the requester, not QA Hlateapproval's owner): <code>api('POST','/offers/bab81f0a-4e1f-45fa-92aa-951e23cd6b84/decline?reason=QA%20AC10')</code> then <code>api('POST','/offers/bab81f0a-4e1f-45fa-92aa-951e23cd6b84/resend-invite',{})</code>.", "Decline: <b>403</b> “Only the requester, the lead's owner or a manager can decline this invite”. Resend: <b>403</b> (not the requester). The offer is still pending."),
    S("AC11", "REC", "<b>API</b>: <code>api('POST','/candidates/32941765-72e1-4050-ba80-5918488a6490/transfer',{to_owner_id:'d8186688-77d4-454d-a649-a1bdf8842bb6'})</code> (tự chuyển lead người khác về mình).", "<b>403</b> “Missing permission CANDIDATE_TRANSFER — ask an admin for a recruiting grant”. Batoreh Nguyen vẫn đúng chủ cũ.", "<b>API</b>: <code>api('POST','/candidates/32941765-72e1-4050-ba80-5918488a6490/transfer',{to_owner_id:'d8186688-77d4-454d-a649-a1bdf8842bb6'})</code> (moving someone else's lead to yourself).", "<b>403</b> “Missing permission CANDIDATE_TRANSFER — ask an admin for a recruiting grant”. Batoreh Nguyen keeps its owner."),
    S("AC12", "REC", "<b>API</b>: <code>api('POST','/candidates/feb2759d-5083-4aaa-8533-797d24c7e880/conversation/join')</code> rồi <code>api('PUT','/candidates/feb2759d-5083-4aaa-8533-797d24c7e880/onboarding-specialist',{user_id:'d26eb34a-cdb7-4b1f-bf8e-a596314a62df'})</code>.", "Join: <b>403</b> “Only a manager can join a candidate's conversation”. Đổi specialist: <b>403</b> (thiếu ONBOARDING_SPECIALIST_ASSIGN). Không đổi gì trên QA Bnotmine.", "<b>API</b>: <code>api('POST','/candidates/feb2759d-5083-4aaa-8533-797d24c7e880/conversation/join')</code> then <code>api('PUT','/candidates/feb2759d-5083-4aaa-8533-797d24c7e880/onboarding-specialist',{user_id:'d26eb34a-cdb7-4b1f-bf8e-a596314a62df'})</code>.", "Join: <b>403</b> “Only a manager can join a candidate's conversation”. Specialist change: <b>403</b> (no ONBOARDING_SPECIALIST_ASSIGN). Nothing changes on QA Bnotmine."),
    S("AC13", "HH", "<b>API</b> bằng Headhunter: (a) <code>api('GET','/candidates/feb2759d-5083-4aaa-8533-797d24c7e880')</code> · (b) <code>api('POST','/candidates/7d05e871-b86d-4f60-83ec-aad1eba80358/claim')</code> · (c) <code>api('GET','/candidates?search=QA')</code> · (d) <code>api('GET','/reports/recruiters')</code> · (e) <code>api('POST','/candidates',{})</code>.", "(a) <b>404</b> “Candidate not found” (ngoài phạm vi = như không tồn tại). (b) <b>404</b>, QA Amain vẫn không chủ (nếu lỡ thành chủ HH → <b>Lỗi</b>, Manager vào Pipeline chuyển QA Amain về kho / người cũ). (c) <b>400</b> “Full-text search is not available to your role; use the name filter”. (d) <b>403</b> “This page is not available to your role”. (e) <b>403</b> “This page is not available to your role” (bộ chặn phạm vi chạy trước controller; POST /candidates không nằm trong danh sách cho phép).", "<b>API</b> as Headhunter: (a) <code>api('GET','/candidates/feb2759d-5083-4aaa-8533-797d24c7e880')</code> · (b) <code>api('POST','/candidates/7d05e871-b86d-4f60-83ec-aad1eba80358/claim')</code> · (c) <code>api('GET','/candidates?search=QA')</code> · (d) <code>api('GET','/reports/recruiters')</code> · (e) <code>api('POST','/candidates',{})</code>.", "(a) <b>404</b> “Candidate not found” (out of scope = as if missing). (b) <b>404</b>, QA Amain stays unowned (if HH became owner → <b>Fail</b>, the Manager moves QA Amain back via Pipeline). (c) <b>400</b> “Full-text search is not available to your role; use the name filter”. (d) <b>403</b> “This page is not available to your role”. (e) <b>403</b> “This page is not available to your role” (the scope interceptor runs before the controller; POST /candidates is not allowlisted)."),
    S("AC14", "REC", "Recruiter mở hồ sơ <b>QA Bnotmine</b> (lead của Manager; ô tìm đầu trang <code>Bnotmine</code>) → Profile → Edit → tab <b>Production / Doanh số</b> → ghi lại số “Closed units (12mo)” / “Số loan đã đóng (12 tháng)” hiện tại → đổi thành giá trị +1 → Save. Rồi TRẢ LẠI đúng số cũ → Save.", "Lưu được (“Profile updated.” / “Đã cập nhật hồ sơ.”) dù không phải chủ — <b>" + D210.vi + "</b>; Audit (Manager) có dòng “Production number edits”. Trả lại xong số về như cũ.", "Recruiter opens <b>QA Bnotmine</b> (the Manager's lead; header search <code>Bnotmine</code>) → Profile → Edit → <b>Production</b> tab → note the current “Closed units (12mo)” → change it to +1 → Save. Then RESTORE the old number → Save.", "Saves (“Profile updated.”) although not the owner — <b>" + D210.en + "</b>; Audit (Manager) has a “Production number edits” row. After the restore the number is back.")
  ] });

CASES.push({ id: "AD", group: G_NEW, short: { vi: "Các vai chưa test", en: "Untested roles" },
  title: { vi: "Các vai chưa ai test: Officer recruiter, LO support, HR, Licensing, Accounting, Team lead, không có quyền, Onboarding thuần", en: "Roles nobody has tested: Officer recruiter, LO support, HR, Licensing, Accounting, Team lead, no grant, pure Onboarding" },
  goal: { vi: "Mỗi vai thấy và làm được đúng phần của mình; các vai phòng ban chỉ đọc hồ sơ.", en: "Each role sees and does exactly its part; department roles only read profiles." },
  acc: ["roleOfr", "roleLos", "roleHr", "roleLic", "roleAcc", "roleTl", "roleNg", "roleOnb"], res: ["register", "devtools"],
  loNote: { vi: "NAD1 (QA Tenadsupport): đăng ký mới cho LO support nhận ở AD2. HO1 (QA Handoffnmls, đã Joined) dùng để xem checklist các phòng.", en: "NAD1 (QA Tenadsupport): fresh LO for LO support to claim in AD2. HO1 (QA Handoffnmls, Joined) is used to view department checklists." },
  steps: [
    SA("roleOfr", "AD1", "OFR", "Officer recruiter → <b>Cold list / Kho COLD</b> → mở một hồ sơ bất kỳ → tab Profile → khối <b>Legal name / Tên pháp lý</b>. Rồi gõ thẳng <code>/inbox/hot</code>.", "Không có nút <b>Edit / Sửa</b> ở Legal name (OFFICER_RECRUITER không được seed quyền CANDIDATE_LEGAL_NAME_CONFIRM). <code>/inbox/hot</code> vẫn mở (chỉ ẩn menu). Ghi lại: nếu vai này dùng thật trên prod, recruiter sẽ kẹt ở bước xác nhận tên.", "Officer recruiter → <b>Cold list</b> → open any profile → Profile tab → <b>Legal name</b> block. Then type <code>/inbox/hot</code>.", "No <b>Edit</b> on Legal name (OFFICER_RECRUITER is not seeded CANDIDATE_LEGAL_NAME_CONFIRM). <code>/inbox/hot</code> still opens (menu hidden only). Note: if this role is used in production, its recruiters get stuck at the legal-name step.", { vi: "B2 nghi lỗi seed: LO_SUPPORT / OFFICER_RECRUITER thiếu CANDIDATE_LEGAL_NAME_CONFIRM", en: "B2 suspected seed gap: LO_SUPPORT / OFFICER_RECRUITER lack CANDIDATE_LEGAL_NAME_CONFIRM" }),
    SA("roleLos", "AD2", "LOS", "Đăng ký <b>NAD1 · QA Tenadsupport</b> (★ mục 5). LO support → <b>Hot leads / Kho HOT</b> → Claim QA Tenadsupport → Log result → Interested → <b>Yes, prepare offer</b> → số 6 / 3 → <b>Send to onboarding</b>. Rồi Profile → Legal name. Cuối cùng gõ thẳng <code>/inbox/cold</code>.", "Claim, Log result, offer chạy y như Recruiter (toast “Claimed QA Tenadsupport”, “Sent to onboarding — QA Tenadsupport”). " + flagPill(["V2", "OW", "PW"], "vi") + "Legal name: KHÔNG có Edit (như AD1). <code>/inbox/cold</code> vẫn mở dù menu không có Cold list.", "Register <b>NAD1 · QA Tenadsupport</b> (★ item 5). LO support → <b>Hot leads</b> → Claim QA Tenadsupport → Log result → Interested → <b>Yes, prepare offer</b> → 6 / 3 → <b>Send to onboarding</b>. Then Profile → Legal name. Finally type <code>/inbox/cold</code>.", "Claim, Log result and the offer work exactly like Recruiter (toasts “Claimed QA Tenadsupport”, “Sent to onboarding — QA Tenadsupport”). " + flagPill(["V2", "OW", "PW"], "en") + "Legal name: NO Edit (as AD1). <code>/inbox/cold</code> still opens though Cold list is not in the menu.", { vi: "B2 nghi lỗi seed", en: "B2 suspected seed gap" }),
    SA("roleHr", "AD3", "RHR", "HR (vai recruit) → ô tìm đầu trang <code>Handoffnmls</code> → mở hồ sơ → Overview → Onboarding checklist; rồi Profile → nút <b>View / Xem</b>; rồi gõ thẳng <code>/work</code>.", "Đọc được hồ sơ (" + D210.vi + "). Checklist: nhóm HR / Licensing ghi “{dept} is tracked outside this app” / “{dept} theo dõi ngoài app”, KHÔNG có nút Done / Block. Edit profile mở ở chế độ xem: tiêu đề “Profile — QA Handoffnmls” / “Hồ sơ — QA Handoffnmls”, không có Save. Không có Label picker (chỉ thấy chip). <code>/work</code> → về My work today.", "HR (recruit role) → header search <code>Handoffnmls</code> → open the profile → Overview → Onboarding checklist; then Profile → <b>View</b>; then type <code>/work</code>.", "The profile is readable (" + D210.en + "). Checklist: HR / Licensing groups say “{dept} is tracked outside this app”, NO Done / Block buttons. Edit profile opens read-only: title “Profile — QA Handoffnmls”, no Save. No label picker (chips only). <code>/work</code> → My work today."),
    SA("roleLic", "AD4", "LIC", "Licensing → làm lại AD3 trên QA Handoffnmls; thêm: gõ thẳng <code>/checklist-templates</code>.", "Như AD3 (" + D210.vi + "). Checklist templates: trang vẫn MỞ dù menu ẩn; phòng Licensing vẫn có nút Add item (vai còn CHECKLIST_TEMPLATE_MANAGE_LICENSING) — chỉ nhìn, KHÔNG lưu gì; ghi lại để Bao quyết có cần chặn không. Không có màn hình sponsorship / luật bang (xem mục “Không test”).", "Licensing → repeat AD3 on QA Handoffnmls; also type <code>/checklist-templates</code>.", "As AD3 (" + D210.en + "). Checklist templates: the page still OPENS though the menu hides it; the Licensing department still has Add item (the role keeps CHECKLIST_TEMPLATE_MANAGE_LICENSING) — look only, save NOTHING; note it so Bao can decide whether to block it. No sponsorship / state-rule screen (see “Not tested”)."),
    SA("roleAcc", "AD5", "ACCT", "Accounting → <b>Team queue / Hàng đợi nhóm</b>. Đổi phòng sang <b>Onboarding</b>. Rồi <b>Checklist templates / Mẫu checklist</b> (KHÔNG lưu gì); thử thêm <code>?dept=ONBOARDING</code>.", "Team queue mở sẵn ở phòng <b>Accounting / Kế toán</b> (URL <code>?dept=ACCOUNTING</code> hoặc mặc định). Sang Onboarding (khi có dòng): “You can see Onboarding's work, but only Onboarding can close it.” / “Bạn xem được việc của Onboarding, nhưng chỉ Onboarding mới đóng được.” Checklist templates: chỉ có phòng Accounting (không có thanh chọn phòng), có nút <b>Add item / Thêm mục</b>; <code>?dept=ONBOARDING</code> quay về Accounting.", "Accounting → <b>Team queue</b>. Switch the department to <b>Onboarding</b>. Then <b>Checklist templates</b> (save NOTHING); also try <code>?dept=ONBOARDING</code>.", "Team queue opens on <b>Accounting</b> (URL <code>?dept=ACCOUNTING</code> or default). On Onboarding (when it has rows): “You can see Onboarding's work, but only Onboarding can close it.” Checklist templates: only the Accounting department (no department bar), with <b>Add item</b>; <code>?dept=ONBOARDING</code> falls back to Accounting."),
    SA("roleTl", "AD6", "TL", "Team lead → <b>Pipeline</b> → bộ lọc “Who collected the lead / Ai thu được lead” → <b>My team / Nhóm của tôi</b>. Rồi Hot leads.", "Có lựa chọn My team. Tài khoản chưa liên kết thành viên chương trình → “Your program account isn't linked yet” / “Tài khoản chương trình của bạn chưa được liên kết”; nếu đã liên kết mà chưa có nhóm → “You have no team yet” / “Bạn chưa có nhóm”. Chỉ thấy lead của mình. Đã liên kết team lead thật → thấy lead của cả nhóm với ĐẦY ĐỦ email/SĐT/NMLS (lead là quản lý, Bao chốt 11/10); chỉ ghi chú nội bộ của recruiter khác bị ẩn (D195).", "Team lead → <b>Pipeline</b> → “Who collected the lead” filter → <b>My team</b>. Then Hot leads.", "The My team option exists. Account not linked to a program member → “Your program account isn't linked yet”; linked but no team → “You have no team yet”. Only own leads show. With a real linked team lead → sees the whole team's leads with FULL email/phone/NMLS (a lead is a manager, Bao 11/10); only other recruiters' internal notes are hidden (D195)."),
    SA("roleNg", "AD7", "NG", "Tài khoản không có quyền recruit → đăng nhập <code>recruit.viet18.com</code>. Rồi gõ thẳng <code>/pipeline</code>.", "My work today: “<b>Could not load your queue</b>” / “<b>Không tải được hàng đợi</b>” + “The recruiting service did not respond or denied access. Check that recruit-be is running and your account has a grant.” KHÔNG có dải “Could not load your permissions”. Menu chỉ My work today (± Connections). <code>/pipeline</code>: “Could not load the inventory” / “Không tải được kho”, không có dữ liệu. Không trang nào vỡ.", "The no-grant account → sign in to <code>recruit.viet18.com</code>. Then type <code>/pipeline</code>.", "My work today: “<b>Could not load your queue</b>” + “The recruiting service did not respond or denied access. Check that recruit-be is running and your account has a grant.” NO “Could not load your permissions” strip. Menu: My work today only (± Connections). <code>/pipeline</code>: “Could not load the inventory”, no data. Nothing crashes."),
    SA("roleOnb", "AD8", "ONBP", "Onboarding thuần (KHÔNG phải specialist của QA PayPal) → ô tìm <code>QA PayPal</code> → hồ sơ → dải “Agreement out of date… <b>Review</b>” → hộp gửi → <b>Send to QA</b>. (Nếu không còn dải đó → Bỏ.)", "Phía recruit CHO bấm gửi dù không phải specialist (chỉ cần AGREEMENT_SEND — <b>" + D210.vi + "</b>). Nhưng MOSO kiểm người gửi: không phải specialist của LO và không có nhãn RECRUITING trong MOSO → bị từ chối (vd mã <code>MOSO_ACTOR_NOT_ONBOARDING_SPECIALIST</code> / người gửi không xác định), KHÔNG có thư. Ghi lại đúng câu hiện ra. Nếu role-onb có RECRUITING trong MOSO thì PENDING → SENT ~15 giây và thư tới <code>bao.trinh+onb-welcome1</code> (xem Spam).", "Pure Onboarding (NOT QA PayPal's specialist) → search <code>QA PayPal</code> → profile → strip “Agreement out of date… <b>Review</b>” → dialog → <b>Send to QA</b>. (No strip any more → Skip.)", "Recruit LETS you send although you are not the specialist (only AGREEMENT_SEND is checked — <b>" + D210.en + "</b>). But MOSO checks the sender: not the LO's specialist and no RECRUITING label in MOSO → refused (e.g. code <code>MOSO_ACTOR_NOT_ONBOARDING_SPECIALIST</code> / unknown actor), NO mail. Record the exact text. If role-onb holds RECRUITING in MOSO, PENDING → SENT in ~15 s and mail reaches <code>bao.trinh+onb-welcome1</code> (check Spam)."),
    SA("roleOnb", "AD9", "ONBP", "<b>API</b>: Onboarding thuần gửi chuyển stage có “vượt điều kiện”: <code>api('POST','/candidates/7d05e871-b86d-4f60-83ec-aad1eba80358/transition',{to_stage:'S1',override:true,reason:'QA AD9 override check'})</code>.", "Hôm nay: <b>403</b> “Missing permission CANDIDATE_TRANSITION — ask an admin for a recruiting grant” — dù ONBOARDING được seed CANDIDATE_OVERRIDE_GATE. Chưa có màn hình nào dùng override nên lỗi đang ngủ. QA Amain không đổi stage (nếu lỡ đổi → <b>Lỗi</b>, Manager chuyển QA Amain về S0 trên Board).", "<b>API</b>: pure Onboarding sends a stage move with “override”: <code>api('POST','/candidates/7d05e871-b86d-4f60-83ec-aad1eba80358/transition',{to_stage:'S1',override:true,reason:'QA AD9 override check'})</code>.", "Today: <b>403</b> “Missing permission CANDIDATE_TRANSITION — ask an admin for a recruiting grant” — although ONBOARDING is seeded CANDIDATE_OVERRIDE_GATE. No screen uses override yet, so the bug is dormant. QA Amain's stage is unchanged (if it moved → <b>Fail</b>, the Manager moves QA Amain back to S0 on the Board).", { vi: "B1 nghi lỗi seed: ONBOARDING có OVERRIDE_GATE nhưng không có TRANSITION", en: "B1 suspected seed gap: ONBOARDING has OVERRIDE_GATE but not TRANSITION" })
  ] });
