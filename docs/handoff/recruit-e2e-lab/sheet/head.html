<title>Recruit E2E Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a field manual for one QA run — sticky control bar (who / view / language), section index on the left, each case is a self-contained card: resources first, then numbered checks with per-tester stamps */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --panel2:#f8faf7; --ink:#18201d; --muted:#5a6762; --line:#d9dfda;
  --accent:#1d5e86; --accent-soft:#e1edf5; --accent-ink:#ffffff;
  --pass:#1e7549; --pass-soft:#dff2e7; --fail:#b02a20; --fail-soft:#fbe5e2; --skip:#86691a; --skip-soft:#f5eed6;
  --bug:#73399a; --bug-soft:#efe5f6; --claude:#9a4d14; --claude-soft:#f7e9dd;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --panel:#19201d; --panel2:#151b19; --ink:#e3e9e5; --muted:#98a6a0; --line:#2b3531;
  --accent:#72b2de; --accent-soft:#1b2c37; --accent-ink:#0f1a22;
  --pass:#5ecf94; --pass-soft:#15291e; --fail:#f0897e; --fail-soft:#331a18; --skip:#dfc169; --skip-soft:#2c2615;
  --bug:#c69ae6; --bug-soft:#291e32; --claude:#efa36a; --claude-soft:#2e2116; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --panel:#19201d; --panel2:#151b19; --ink:#e3e9e5; --muted:#98a6a0; --line:#2b3531;
  --accent:#72b2de; --accent-soft:#1b2c37; --accent-ink:#0f1a22;
  --pass:#5ecf94; --pass-soft:#15291e; --fail:#f0897e; --fail-soft:#331a18; --skip:#dfc169; --skip-soft:#2c2615;
  --bug:#c69ae6; --bug-soft:#291e32; --claude:#efa36a; --claude-soft:#2e2116; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 64px}
a{color:var(--accent)}
code,.mono{font-family:var(--f-mono);font-size:.86em}
code{background:var(--accent-soft);padding:1px 5px;border-radius:4px;word-break:break-all}
.wrap{max-width:1200px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
h1{font-size:1.3rem;margin:0;font-weight:700;letter-spacing:-.01em}
.env{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:.82rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:5px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select.view,input.search{font:inherit;font-size:.84rem;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);min-width:0}
input.search{width:min(220px,100%)}
.me{font-size:.82rem;color:var(--muted)} .me b{color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;margin-top:10px}
.bar i{display:block;height:100%}
.bar .p{background:var(--pass)} .bar .f{background:var(--fail)} .bar .s{background:var(--skip)}
.counts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.counts b{color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:3px 11px;font:inherit;font-size:.8rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sync{font-size:.78rem;color:var(--muted)} .sync.warn{color:var(--skip)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px;margin-top:20px}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.nav{display:none}}
.nav{position:sticky;top:190px;align-self:start;display:flex;flex-direction:column;gap:1px;font-size:.85rem;max-height:calc(100vh - 210px);overflow:auto}
.nav a{text-decoration:none;color:var(--ink);padding:4px 8px;border-radius:6px;display:flex;justify-content:space-between;gap:8px}
.nav a:hover{background:var(--accent-soft)}
.nav .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .grp{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 8px 2px;font-weight:600}
main{min-width:0;display:flex;flex-direction:column;gap:34px}
section h2{font-size:1.14rem;margin:0 0 6px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;text-wrap:balance}
section h2 .code{font-family:var(--f-mono);color:var(--accent);font-size:.9rem}
h3.sub{margin:14px 0 6px;font-size:.98rem}
.intro{color:var(--muted);margin:0 0 12px;max-width:76ch}
.role{display:inline-block;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:4px;white-space:nowrap}
.ref{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.mono,td .mono{white-space:nowrap}
.case{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.case .lbl{margin:0;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.goal{margin:0;max-width:80ch}
.who{display:flex;flex-wrap:wrap;gap:6px}
ul.prep,ol.prep{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.9rem;max-width:84ch}
.res{border:1px dashed var(--line);border-radius:var(--r);background:var(--panel2);padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.res details{border-top:1px solid var(--line);padding-top:8px}
.res details:first-of-type{border-top:0;padding-top:0}
.res summary{cursor:pointer;font-weight:600;font-size:.9rem}
.res .body{margin-top:8px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);gap:4px 12px;font-size:.88rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0;word-break:break-word}
.cp{font:inherit;font-size:.7rem;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:5px;padding:0 6px;margin-left:6px;cursor:pointer;vertical-align:1px}
.cp:hover{color:var(--accent);border-color:var(--accent)}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item[data-st="pass"]{box-shadow:inset 3px 0 var(--pass)}
.item[data-st="fail"]{box-shadow:inset 3px 0 var(--fail)}
.item[data-st="skip"]{box-shadow:inset 3px 0 var(--skip)}
.stamps{display:flex;gap:4px;align-self:start}
.stamp{min-width:40px;height:30px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 .74rem var(--f-body);cursor:pointer;padding:0 6px}
.stamp.p[aria-pressed="true"]{background:var(--pass-soft);border-color:var(--pass);color:var(--pass)}
.stamp.f[aria-pressed="true"]{background:var(--fail-soft);border-color:var(--fail);color:var(--fail)}
.stamp.s[aria-pressed="true"]{background:var(--skip-soft);border-color:var(--skip);color:var(--skip)}
.stamp:disabled{cursor:not-allowed;opacity:.45}
.ib{min-width:0}
.sid{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-right:6px}
.act{font-weight:500;margin-top:2px}
.exp{color:var(--muted);font-size:.9rem;margin-top:3px}
.exp b.k{color:var(--ink)}
.bug{display:inline-block;margin-top:5px;font-size:.78rem;color:var(--bug);background:var(--bug-soft);border-radius:4px;padding:2px 7px}
.meta{font-size:.76rem;color:var(--muted);margin-top:4px}
.others{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.oc{font-size:.72rem;border-radius:99px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc.pass{color:var(--pass);border-color:var(--pass);background:var(--pass-soft)}
.oc.fail{color:var(--fail);border-color:var(--fail);background:var(--fail-soft)}
.oc.skip{color:var(--skip);border-color:var(--skip);background:var(--skip-soft)}
.oc.claude{border-style:dashed}
.note{width:100%;margin-top:6px;font:inherit;font-size:.86rem;background:transparent;color:var(--ink);border:1px dashed var(--line);border-radius:6px;padding:5px 8px;resize:vertical;min-height:32px}
.note:focus{border-style:solid;border-color:var(--accent)}
.hidden-note .note{display:none}
.hidden-note .item[data-st="fail"] .note,.hidden-note .item.has-note .note{display:block}
.addnote{background:none;border:0;color:var(--accent);font:inherit;font-size:.78rem;cursor:pointer;padding:0;margin-top:4px}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:.88rem;max-width:88ch}
.callout.warn{border-color:var(--skip);background:var(--skip-soft)}
.callout.bad{border-color:var(--fail);background:var(--fail-soft)}
.callout.cl{border-color:var(--claude);background:var(--claude-soft)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;border-radius:99px;padding:1px 8px;white-space:nowrap}
.pill.ok{background:var(--pass-soft);color:var(--pass)} .pill.no{background:var(--fail-soft);color:var(--fail)} .pill.mid{background:var(--skip-soft);color:var(--skip)} .pill.cl{background:var(--claude-soft);color:var(--claude)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.grid2>div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:.88rem;min-width:0}
.grid2 b{display:block;margin-bottom:2px}
form.run{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:12px}
form.run input,form.run select,form.run textarea{font:inherit;font-size:.86rem;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:100%;min-width:0}
form.run textarea{grid-column:1/-1;min-height:54px}
.btn{font:inherit;font-weight:600;font-size:.86rem;padding:8px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.empty{color:var(--muted);font-size:.86rem;padding:10px 0}
.res-pass{color:var(--pass);font-weight:600}.res-fail{color:var(--fail);font-weight:600}.res-partial{color:var(--skip);font-weight:600}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.78rem}
.del:hover{color:var(--fail)}
.lockbar{display:none;margin-top:8px}
.lockbar.on{display:block}
.toast{max-width:calc(100vw - 32px);position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:.86rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
mark{background:var(--skip-soft);color:inherit;border-radius:3px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
td.links{white-space:nowrap}
@media (max-width:900px){.nav{display:none}}
@media (max-width:700px){header.top{position:static}.ctl{margin-left:0;width:100%}input.search{flex:1 1 140px;width:auto}main{gap:26px}.case{padding:12px}.item{grid-template-columns:minmax(0,1fr)}.stamps{order:2}}
</style>
<div class="wrap">
<header class="top">
  <div class="top-row">
    <h1 id="h1">Recruit E2E Lab</h1>
    <span class="env" id="envline"></span>
    <div class="ctl">
      <span class="me" id="me"></span>
      <select class="view" id="view" aria-label="View"></select>
      <input class="search" id="q" type="search" aria-label="Search" placeholder="">
      <div class="seg" role="group" aria-label="Language"><button id="lang-vi" aria-pressed="true">VI</button><button id="lang-en" aria-pressed="false">EN</button></div>
    </div>
  </div>
  <div class="bar" aria-hidden="true"><i class="p" id="barP"></i><i class="f" id="barF"></i><i class="s" id="barS"></i></div>
  <div class="counts" id="counts"></div>
  <div class="filters" role="group" id="filters"></div>
  <div class="lockbar callout warn" id="lockbar"></div>
</header>
<div class="layout">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
