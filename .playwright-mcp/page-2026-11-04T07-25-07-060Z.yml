                - generic [ref=f22e240]:
                  - heading "Adjustable‑Rate Mortgage (ARM)" [level=3] [ref=f22e241]
                  - paragraph [ref=f22e242]: Enjoy a lower interest rate at the beginning of your loan - perfect if you plan to move or refinance within a few years.
                - generic [ref=f22e243]:
                  - heading "HomeReady® & Home Possible®" [level=3] [ref=f22e244]
                  - paragraph [ref=f22e245]: Conventional loan programs offering down payments as low as 3% with flexible income and credit requirements.
                - generic [ref=f22e246]:
                  - heading "Jumbo Loan" [level=3] [ref=f22e247]
                  - paragraph [ref=f22e248]: If your home costs more than the standard loan limits, Jumbo Loans help finance high‑priced homes with competitive rates.
                - generic [ref=f22e249]:
                  - heading "FHA Loan" [level=3] [ref=f22e250]
                  - paragraph [ref=f22e251]: Great for buyers with limited savings or lower credit scores. Requires only 3.5% down payment.
                - generic [ref=f22e252]:
                  - heading "VA Loan" [level=3] [ref=f22e253]
                  - paragraph [ref=f22e254]: Exclusive to veterans, service members, and surviving spouses. Offers $0 down, no PMI, and flexible credit rules
                - generic [ref=f22e255]:
                  - heading "USDA Loan" [level=3] [ref=f22e256]
                  - paragraph [ref=f22e257]: Designed for rural and suburban families. No down payment required and reduced mortgage insurance.
              - generic [ref=f22e259]:
                - generic [ref=f22e260]:
                  - heading "Bank Statement Loans" [level=3] [ref=f22e261]
                  - paragraph [ref=f22e262]: Qualify using 12–24 months of business or personal bank statements instead of W‑2s or tax returns – useful for self‑employed borrowers.
                - generic [ref=f22e263]:
                  - heading "DSCR Loans" [level=3] [ref=f22e264]
                  - paragraph [ref=f22e265]: Approval is based on your property’s rental income covering the mortgage payment (Debt Service Coverage Ratio), making it ideal for real estate investors.
                - generic [ref=f22e266]:
                  - heading "Asset‑Qualifier Loans" [level=3] [ref=f22e267]
                  - paragraph [ref=f22e268]: Use your savings, investments, or retirement accounts to qualify, without relying on traditional income documents.
                - generic [ref=f22e269]:
                  - heading "Foreign National Loans" [level=3] [ref=f22e270]
                  - paragraph [ref=f22e271]: Tailored for non‑U.S. citizens purchasing U.S. property, even without a U.S. credit history or residency.
                - generic [ref=f22e272]:
                  - heading "FHA Streamline Refinance" [level=3] [ref=f22e273]
                  - paragraph [ref=f22e274]: Lower your rate with minimal paperwork - often no appraisal or income verification. Only for borrowers with an existing FHA loan.
                - generic [ref=f22e275]:
                  - heading "VA IRRRL (Interest Rate Reduction Refinance Loan)" [level=3] [ref=f22e276]
                  - paragraph [ref=f22e277]: For veterans and service members with a current VA loan. Quick process, usually no appraisal or income check required.
              - generic [ref=f22e279]:
                - generic [ref=f22e280]:
                  - heading "USDA Streamlined Assist" [level=3] [ref=f22e281]
                  - paragraph [ref=f22e282]: For homeowners with an existing USDA loan. No appraisal or credit review, must show at least $50/month in savings.
                - generic [ref=f22e283]:
                  - heading "Rate‑and‑Term Refinance" [level=3] [ref=f22e284]
                  - paragraph [ref=f22e285]: Replace your current mortgage to reduce your interest rate, shorten the loan term or switch from an ARM to a fixed‑rate loan.
                - generic [ref=f22e286]:
                  - heading "Cash‑Out Refinance" [level=3] [ref=f22e287]
                  - paragraph [ref=f22e288]: Tap into your home equity and receive cash to use for debt consolidation, tuition, or major expenses.
                - generic [ref=f22e289]:
                  - heading "Bank Statement Refinance" [level=3] [ref=f22e290]
                  - paragraph [ref=f22e291]: Qualify using business or personal bank deposits – ideal for self‑employed borrowers without W‑2 income.
                - generic [ref=f22e292]:
                  - heading "DSCR Refinance" [level=3] [ref=f22e293]
                  - paragraph [ref=f22e294]: For real estate investors - approval based on rental property income instead of personal income.
                - generic [ref=f22e295]:
                  - heading "Asset‑Qualifier Refinance" [level=3] [ref=f22e296]
                  - paragraph [ref=f22e297]: Use savings, investments, or retirement funds as proof of ability to repay instead of traditional income.
              - generic [ref=f22e299]:
                - generic [ref=f22e300]:
                  - heading "Foreign National Refinance" [level=3] [ref=f22e301]
                  - paragraph [ref=f22e302]: Borrow a lump sum against your home’s value with fixed interest and predictable payments.
                - generic [ref=f22e303]:
                  - heading "HELOC (Home Equity Line of Credit)" [level=3] [ref=f22e304]
                  - paragraph [ref=f22e305]: A flexible credit line you can borrow from when needed, similar to a credit card but backed by your home.
                - generic [ref=f22e306]:
                  - heading "Reverse Mortgage (HECM)" [level=3] [ref=f22e307]
