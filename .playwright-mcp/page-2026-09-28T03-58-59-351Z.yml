        - paragraph [ref=f30e10]: "The meeting date is already known from \"Schedule 1-1\", so Done… no longer asks for it. It asks whether the 1-1 happened and whether the loan officer joins as W-2 or 1099. MOSO picks the agreement from that answer: W-2 gives the Outside salesperson agreement, 1099 gives the Independent contractor agreement. MOSO builds that agreement the moment it hears the meeting is done. So Recruit sends W-2 or 1099 first and the meeting second. When the MOSO write-back is off, nothing changes: Done is still one click."
