                - generic [ref=f8e290]:
                  - strong [ref=f8e291]: "Stress-Free Process:"
                  - text: I’m committed to making your mortgage experience as easy and stress-free as possible. You’re not just a number; you matter.
            - listitem [ref=f8e292]:
              - paragraph [ref=f8e293]:
                - generic [ref=f8e294]:
                  - strong [ref=f8e295]: "Unbeatable Combination:"
                  - text: Expect the best in rates, cost, experience, and execution.
            - listitem [ref=f8e296]:
              - paragraph [ref=f8e297]:
                - generic [ref=f8e298]:
                  - strong [ref=f8e299]: "Customized Solutions:"
                  - text: No “one size fits all” here; every solution is tailored for you.
            - listitem [ref=f8e300]:
              - paragraph [ref=f8e301]:
                - generic [ref=f8e302]:
                  - strong [ref=f8e303]: "Transparency and Communication:"
                  - text: 100% clarity in every step, understand the "why."
            - listitem [ref=f8e304]:
              - paragraph [ref=f8e305]:
                - generic [ref=f8e306]:
                  - strong [ref=f8e307]: "Exceptional Service:"
                  - text: I aim to be the best loan officer you’ll ever work with. If I exceed your expectations, I’d love for you to share your experience with friends and family.
          - paragraph [ref=f8e308]: I’m empowering consumers with direct access to personalized pricing, automated alerts, and a simple online application process enhanced by next gen tools. There’s nothing more fulfilling than helping clients achieve remarkable transformations.
          - paragraph [ref=f8e309]
          - paragraph [ref=f8e310]: With a unique blend of experience and dedication, I go the extra mile for my clients. Prior to joining Loan Factory in fall 2024, I directly funded nearly $300 million in home loans and was a catalyst for over $200 million more. I previously led the mortgage sales division at a top-rated private mortgage bank, helping build the business from the ground up over eight years. Having analyzed thousands of loan scenarios, credit profiles and tax returns, I'm well-equipped to get you to the finish line as succinctly as possible.
          - paragraph [ref=f8e311]
          - paragraph [ref=f8e312]: "From my days as a three-sport athlete to playing NCAA golf at North Dakota State University, my competitive spirit has always been the primary driver of my success. I later earned a master’s degree in sport management from the University of San Francisco, graduating at the top of my class, and spent a handful of years as a professional hockey agent. That same drive now fuels my current mission: pairing top-tier technology and premier infrastructure with a low-fee structure to deliver the most competitive rates in the business. I don’t just compete, I win for my clients."
