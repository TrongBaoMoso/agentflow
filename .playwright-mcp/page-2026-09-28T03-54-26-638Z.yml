          - text: Done… pick W-2 or 1099, and the date
        - listitem [ref=f28e16]:
          - generic [ref=f28e17]: "3"
          - text: Recruit sends W-2 or 1099 to MOSO
        - listitem [ref=f28e18]:
          - generic [ref=f28e19]: "4"
          - text: Then the meeting. MOSO builds the matching agreement
