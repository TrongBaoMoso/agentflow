        - heading "The 1-1 decides W-2 or 1099, so the Done step records it" [level=1] [ref=f28e9]
        - paragraph [ref=f28e10]: "In the old flow, the first 1-1 is where Onboarding confirms with the loan officer whether they join as W-2 or 1099. MOSO uses that answer to pick the agreement (W-2 gives the Outside salesperson agreement, 1099 gives the Independent contractor agreement). MOSO builds that agreement at the moment it hears the meeting is done. So Recruit sends W-2 or 1099 first and the meeting second. When the write-back is off, nothing changes: Done is still one click."
