                        - text: "Before the call (Steps 1–3, Matt's design)1. About you: name, email, mobile, how you heard. If a Loan Factory Loan Officer referred them, they search and pick that Loan Officer, shown with photo, NMLS and email so people with the same name can't be mixed up. If they come from a Loan Officer's own page, that Loan Officer is filled in automatically2. License details: quick check, NMLS, states to sponsor (California / Indiana / South Carolina questions appear only when needed), websites.3. \"Would you like a quick call first?\""
                        - list [ref=e2337]:
                          - listitem [ref=e2338]: "Yes: pick up to 3 two-hour windows, or \"Any time works for me\". The onboarding team then picks one and sends a Google Calendar invite."
                          - listitem [ref=e2339]: "No, I'm ready to join: goes straight to Step 4 (for Loan Officers who already spoke with us)."
                        - text: "After the call (Steps 4–7)4. Finish your application: the details that used to be in the long form (legal name, citizenship, address, licensed states, compensation, social media). The Loan Officer fills these in themselves. Anything already entered is prefilled and editable5. Review: a summary of everything, with Edit buttons. Anything our team set (for example W-2/1099 decided on the call) is marked so the Loan Officer can tell us if it's wrong6. Pay $100 and sign the agreement: stays locked until the onboarding specialist approves after the call. Someone who chose \"I'm ready to join\" sees \"our team is reviewing your application\" until then7. NMLS access, then done"
                        - generic [ref=e2340]: "New: Special requests (Step 4)"
                        - text: Anh Thuan asked for a way to record special requests or custom terms discussed during recruiting, together with a compliance disclaimer (ticket below). The Loan Officer adds one request per row (team name, "Powered by", coaching waiver, fee waiver, or anything else) and ticks the disclaimer. Our team will then approve, reject or mark each request as addressed in our recruiting systemDesign note for
