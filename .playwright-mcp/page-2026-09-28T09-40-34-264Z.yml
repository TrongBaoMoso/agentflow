        - generic [ref=f19e59]:
          - paragraph [ref=f19e60]: Start here
          - heading [level=2] [ref=f19e61]:
            - text: The whole program,
            - emphasis [ref=f19e62]: as one story
          - paragraph [ref=f19e63]: Five steps, in the order they actually happen. Nothing here is new information — it is the same program, told once instead of assembled by the reader.
          - list [ref=f19e64]:
            - listitem [ref=f19e65]:
              - generic [aria-hidden] [ref=f19e66]: "1"
              - generic [ref=f19e67]:
                - heading "You know the people. Help them discover the opportunity." [level=3] [ref=f19e68]
                - paragraph [ref=f19e69]: Help loan officers in your network discover Loan Factory. Any Loan Factory loan officer or staff member in good standing can join—no interview or recruiting quota required.
            - listitem [ref=f19e70]:
              - generic [aria-hidden] [ref=f19e71]: "2"
              - generic [ref=f19e72]:
                - heading "One click to join. A marketing team behind you." [level=3] [ref=f19e73]
                - paragraph [ref=f19e74]: Join Level 1 and activate recruiting in ALLY. Approved content posts under your name 1–3 times weekly, featuring your referral link and QR code. We handle the writing and design.
            - listitem [ref=f19e75]:
              - generic [aria-hidden] [ref=f19e76]: "3"
              - generic [ref=f19e77]:
                - heading "Help great loan officers join. Get rewarded for the connection." [level=3] [ref=f19e78]
                - paragraph [ref=f19e79]: Earn a lump-sum bonus for each qualifying loan officer who joins through you, based on their preceding 12 months' loan production. The same bonus schedule applies at every level. Payment follows their 60-day milestone.
            - listitem [ref=f19e80]:
              - generic [aria-hidden] [ref=f19e81]: "4"
              - generic [ref=f19e82]:
                - heading "Grow your recruiting. Unlock greater marketing support." [level=3] [ref=f19e83]
                - paragraph [ref=f19e84]: "Meet advancement requirements to qualify for recruiting marketing support: up to $500/month at Level 2 or $1,000/month at Level 3. Participation requires approval, and approved recruiting ads are paid for directly with a company card, up to your monthly budget."
            - listitem [ref=f19e85]:
              - generic [aria-hidden] [ref=f19e86]: "5"
              - generic [ref=f19e87]:
                - heading "Keep the momentum. Keep the investment behind you." [level=3] [ref=f19e88]
                - paragraph [ref=f19e89]: Levels 2 and 3 are reviewed every 90 days. Maintain recruiting requirements to retain funding. Otherwise, return to Level 1 and remain an Ambassador—with automated posting and the same full referral bonus opportunity.
          - paragraph [ref=f19e90]: About 90 seconds to read. Everything below is detail, only if you want it.
