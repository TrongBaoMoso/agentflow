        - listitem [ref=f8e197]:
          - generic [ref=f8e198]: "1"
          - text: recruit-be checks permission, flag, the staging allowlist, that W-2/1099 still matches what the dialog showed, and that no re-send is already pending. Then it writes one outbox row (AGREEMENT_RESEND).
        - listitem [ref=f8e199]:
          - generic [ref=f8e200]: "2"
          - text: The relay waits behind any pending meeting, specialist or profile write for this candidate.
        - listitem [ref=f8e201]:
          - generic [ref=f8e202]: "3"
          - text: "packs, under the per-candidate lock: ownership, meeting reached, dedupe, 5-min cooldown. It writes W-2/1099, rebuilds from the fresh MOSO row, cancels the old envelope, and e-mails only if a new link came back."
        - listitem [ref=f8e203]:
          - generic [ref=f8e204]: "4"
          - text: The answer, echo-checked, goes to the Timeline (who, what, to whom, envelope id) and to this card.