        - paragraph [ref=f8e13]: Today, when W-2/1099 changes after the 1-1, or the loan officer loses the signing e-mail, the specialist has to open MOSO and click "Re-generate e-sign documents and send email". This moves that action into Recruit. MOSO decides what is out of date, the specialist confirms exactly what will be sent and to whom, and nothing is ever e-mailed without that click.
