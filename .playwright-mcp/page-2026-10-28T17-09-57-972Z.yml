                  - heading "Licensing & NMLS Requirements" [level=3] [ref=e118]
                  - list [ref=e119]:
                    - listitem [ref=e120]: "Active Status: You must hold a valid NMLS ID. The state(s) you wish us to sponsor must currently be Active or Approved-Inactive."
                    - listitem [ref=e122]: "Expired Licenses: If your license for a specific state has expired, you must renew it through the NMLS before we can submit a sponsorship request."
