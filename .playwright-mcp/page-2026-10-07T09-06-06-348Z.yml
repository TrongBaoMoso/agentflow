      - heading "Đã chốt (Bao, 07/10)" [level=2] [ref=e2353]
      - list [ref=e2354]:
        - listitem [ref=e2355]: "Ai tick tay: recruiter owner hoặc onboarding specialist (HR to-do, HR docs, Licensing). Chip ghi rõ ai tick: \"Ticked by Mai\" hoặc \"Ticked by Linh\"."
        - listitem [ref=e2356]: "Thời hạn Undo: còn Undo được cho tới khi HR app gửi sự kiện thật; lúc đó bước khoá lại thành Auto và nút Undo biến mất."
        - listitem [ref=e2357]: "Không có gửi ngoại lệ: HR không tạo được nhân viên nếu thiếu các trường bắt buộc, nên bỏ hẳn nút \"Send now\". Thiếu trường bắt buộc (ví dụ NMLS, email, loại W-2/1099) thì chưa bàn giao: banner \"Missing for HR\", chuông và mục Today gửi tới cả onboarding specialist lẫn recruiter owner, và Anna được tự gửi sang HR ngay khi trường đó được điền. Thiếu trường không bắt buộc (số điện thoại, địa chỉ nhà) thì không chặn: vẫn gửi Anna sang HR, và bước Sent to HR ghi chú \"HR may ask for: …\"."
        - listitem [ref=e2358]: "Đỏ sau 5 ngày: chip \"Waiting on … · N days\" chuyển đỏ sau 5 ngày ở bất kỳ bước nào còn chờ (Missing for HR, HR account, HR to-do, HR docs, Licensing, setup call)."
        - listitem [ref=e2359]: "Quy tắc Licensing: tự tick khi HR đã bảo lãnh (sponsor) xong mọi bang Anna đăng ký (theo cập nhật licence từ HR); nếu cập nhật không tới thì một trong hai người tick tay."
        - listitem [ref=e2360]: "Các giai đoạn: New lead, Engaged, Offer, Onboarding, Joined, Onboarded."
        - listitem [ref=e2361]: "Không hint trong UI app: không có ghi chú hay giải thích trong màn app, chỉ nhãn, trạng thái và nút (Bao 07/10). Giải thích chỉ nằm ở phần chú thích này."
