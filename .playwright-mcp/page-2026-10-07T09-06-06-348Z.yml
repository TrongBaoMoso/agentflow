        - paragraph [ref=e8]: Xem 5 tình huống A–E bên dưới. Bấm "Mark done" / "Undo" để thử; đổi góc nhìn Linh (onboarding specialist) ↔ Mai (recruiter owner) ở thanh trên — cả hai đều tick tay được. Chữ trong màn hình app giữ tiếng Anh như app thật; phần giải thích bằng tiếng Việt.
