              - heading "Trình Tự Thực Hiện" [level=4] [ref=f3e134]
              - list [ref=f3e135]:
                - listitem [ref=f3e136]:
                  - paragraph
                  - paragraph [ref=f3e137]: "Trong thời gian hưởng trợ cấp thất nghiệp, hằng tháng, người lao động phải thông báo về việc tìm kiếm việc làm cho tổ chức dịch vụ việc làm công nơi đang hưởng trợ cấp thất nghiệp theo Mẫu số 24 tại Phụ lục ban hành kèm theo Nghị định số 374/2025/NĐ-CP. Ngày người lao động thông báo hằng tháng về việc tìm kiếm việc làm được ghi cụ thể trong phụ lục quyết định hưởng trợ cấp thất nghiệp của người lao động như sau: - Ngày thông báo hằng tháng về việc tìm kiếm việc làm của tháng thứ nhất hưởng trợ cấp thất nghiệp nằm trong thời hạn 03 ngày làm việc mà người lao động được trả kết quả về việc giải quyết hưởng trợ cấp thất nghiệp; - Từ tháng thứ hai hưởng trợ cấp thất nghiệp trở đi, ngày thông báo hằng tháng về việc tìm kiếm việc làm nằm trong thời hạn 03 ngày làm việc kể từ ngày đầu tiên của tháng hưởng trợ cấp thất nghiệp. Trường hợp, thời gian thông báo về việc tìm kiếm việc làm nằm trong khoảng thời gian mà người lao động bị ảnh hưởng bởi hoả hoạn, lũ lụt, động đất, sóng thần, địch họa, dịch bệnh mà không thể thông báo về việc tìm kiếm việc làm thì tổ chức dịch vụ việc làm công xem xét, trình Giám đốc Sở Nội vụ quyết định về việc điều chỉnh ngày thông báo hằng tháng về việc tìm kiếm việc làm để đảm bảo quyền lợi cho người lao động. Trường hợp ngày thông báo về việc tìm kiếm việc làm của người lao động nằm trong thời gian chuyển nơi hưởng trợ cấp thất nghiệp thì người lao động thông báo hằng tháng về việc tìm kiếm việc làm với tổ chức dịch vụ việc làm công nơi chuyển đến. Người lao động đang hưởng trợ cấp thất nghiệp được coi là đã thông báo hằng tháng về việc tìm kiếm việc làm khi đã ghi đúng và đầy đủ các nội dung trong thông báo hằng tháng về việc tìm kiếm việc làm và chịu trách nhiệm về nội dung thông báo."
