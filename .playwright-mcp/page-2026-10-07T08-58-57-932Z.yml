        - 'heading "After Joined: one status per dependency, until Onboarded" [level=1] [ref=e6]'
        - paragraph [ref=e7]: "Each outside dependency (HR account, HR to-do, HR docs, Licensing) is one done / not-done status. Every tick says where it came from (an automatic event, or ticked by hand by the recruiter owner or the onboarding specialist) and every open step says who we are waiting on and for how long. In-between details such as \"BGC pending\" are notes, not steps. Missing profile fields come in two kinds: blocking (HR cannot create the record without them, e.g. NMLS, email, W-2/1099 type) and optional (phone, home address)."
        - paragraph [ref=e8]: Bao xem 5 tình huống A–E bên dưới. Bấm "Mark done" / "Undo" để thử; đổi góc nhìn Linh (onboarding specialist) ↔ Mai (recruiter owner) ở thanh trên — cả hai đều tick tay được.
