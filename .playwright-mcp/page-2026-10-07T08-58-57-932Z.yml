    - region [ref=e2362]:
      - heading "Decided (Bao, Oct 7)" [level=2] [ref=e2363]
      - list [ref=e2364]:
        - listitem [ref=e2365]: "Who ticks by hand: the recruiter owner or the onboarding specialist (HR to-do, HR docs, Licensing). The chip says who: \"Ticked by Mai\" or \"Ticked by Linh\"."
        - listitem [ref=e2366]: "Undo window: Undo stays until the HR app sends the real event; then the step locks as Auto and Undo disappears."
        - listitem [ref=e2367]: "No exception send: HR cannot create the employee without its required fields, so there is no \"Send now\". Blocking fields (e.g. NMLS, email, W-2/1099 type) hold the hand-off: a \"Missing for HR\" banner, a bell and a Today item go to both the onboarding specialist and the recruiter owner, and Anna is sent the moment the field is filled. Optional fields (phone, home address) do not block: Anna is sent anyway and the Sent to HR step notes \"HR may ask for: …\"."
        - listitem [ref=e2368]: "Red after 5 days: the \"Waiting on … · N days\" chip turns red after 5 days on any step still pending (Missing for HR, HR account, HR to-do, HR docs, Licensing, setup call)."
        - listitem [ref=e2369]: "Licensing rule: ticks itself when HR has sponsored every state Anna applied for (from HR licence updates); either person can tick it by hand if the updates don't arrive."
        - listitem [ref=e2370]: "Stages: New lead, Engaged, Offer, Onboarding, Joined, Onboarded."
        - listitem [ref=e2371]: "No hints in the app UI: no hints or explanations inside the app screens, only labels, statuses and buttons (Bao 07/10). Explanations live only in these captions."
