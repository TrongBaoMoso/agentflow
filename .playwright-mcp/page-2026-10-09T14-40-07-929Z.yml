                      - /url: https://github.com/LoanFactory-Inc/packs/commit/51d6b5a0c23f7d2081ce7ae025a7bec70b2b2640
                      - text: "Log the Drive config key, not the entity, when the owner change fails (#3644) GoogleDrive.afterAccountChanged logged \"Could not change owner: \" + config, which prints every property of GoogleDriveConfig(1), including the OAuth access_token and refresh_token of the integrated Super Admin account. Those fields are not SECURED, so the base entity redaction does not cover them. Log the key only. Co-authored-by: TrongBaoMoso"
                      - generic [ref=f28e187]: "Co-authored-by: Claude Opus 5.5 (1M context)"
                    - text: Bao (base)
                    - link [ref=f28e188] [cursor=pointer]:
                      - /url: https://github.com/LoanFactory-Inc/base/commit/58531d73fa3e02ae4496e97b90ff1bbc2b22ba77
                      - text: "Keep SECURED values out of entity dumps and error messages (#770) An entity printed every property, SECURED ones included, and several error paths put the entity or a raw value into logs or exception messages. On production (lender-rate) Bean.toMap logged Configuration(1) whenever one of its fields could not be evaluated, writing the Mailgun and SendGrid API keys, the Mailgun webhook signing key, engagement_api_key and api_secret into the App Engine logs (4 entries between 2026-10-05 and 2026-10-08). - GCEntity and GCEntity2 toString print SECURED properties as \"***\", also under their localized names. IEntity resolves the kind's Type once per dump. If it cannot (unknown kind, failed lookup) the dump fails closed: every secret-like property name (secret, password, token, api key, ...) is redacted, and the kind is logged once. Bean.toString delegates to these, so every remaining dump of a Bean is redacted. - Bean.toMap and Bean.getOptional(InputConfig) name the entity by key only. - Bean.set (\"Could not copy field\") and Bean.put (\"Old raw value\") no longer print the value of a SECURED field. - SaveIndexOp, Tools, GCEntity2 projection error: key only. HasValues.demand and HtmlBuilder no longer print the values. Co-authored-by: TrongBaoMoso"
