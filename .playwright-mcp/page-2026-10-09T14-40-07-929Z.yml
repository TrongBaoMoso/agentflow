                      - text: "Keep SECURED values out of entity dumps and error messages (#770)An entity printed every property, SECURED ones included, and several errorpaths put the entity or a raw value into logs or exception messages. Onproduction (lender-rate) Bean.toMap logged Configuration(1) whenever one of itsfields could not be evaluated, writing the Mailgun and SendGrid API keys, theMailgun webhook signing key, engagement_api_key and api_secret into the AppEngine logs (4 entries between 2026-10-05 and 2026-10-08).- GCEntity and GCEntity2 toString print SECURED properties as \"***\", also under their localized names. IEntity resolves the kind's Type once per dump. If it cannot (unknown kind, failed lookup) the dump fails closed: every secret-like property name (secret, password, token, api key, ...) is redacted, and the kind is logged once. Bean.toString delegates to these, so every remaining dump of a Bean is redacted.- Bean.toMap and Bean.getOptional(InputConfig) name the entity by key only.- Bean.set (\"Could not copy field\") and Bean.put (\"Old raw value\") no longer print the value of a SECURED field.- SaveIndexOp, Tools, GCEntity2 projection error: key only. HasValues.demand and HtmlBuilder no longer print the values.Co-authored-by: TrongBaoMoso"
                      - generic [ref=f28e172]: "Co-authored-by: Claude Opus 5.5 (1M context)"
                  - generic [ref=f28e173] [cursor=pointer]: batman
