          - paragraph [ref=e80]: Start here
          - heading [level=2] [ref=e81]:
            - text: The whole job,
            - emphasis [ref=e82]: as one story
          - paragraph [ref=e83]: Five steps, in the order they actually happen. This is a full-time role with a base salary — the detail below is the pay scale, not the pitch.
          - list [ref=e84]:
            - listitem [ref=e85]:
              - generic [aria-hidden] [ref=e86]: "1"
              - generic [ref=e87]:
                - heading "This is a salaried job, not a side arrangement." [level=3] [ref=e88]
                - paragraph [ref=e89]: You join Loan Factory’s in-house recruiting team on a guaranteed base of $40,000 to $60,000 a year, set by the experience you bring. The bonuses sit on top and are uncapped.
            - listitem [ref=e90]:
              - generic [aria-hidden] [ref=e91]: "2"
              - generic [ref=e92]:
                - heading "Your job is to find producing loan officers and start the conversation." [level=3] [ref=e93]
                - paragraph [ref=e94]: Source them, run the software demo, bring them to the weekly webinar, and keep every prospect tracked. A qualified recruit is a loan officer with at least 12 closed loans in the past 12 months.
            - listitem [ref=e95]:
              - generic [aria-hidden] [ref=e96]: "3"
              - generic [ref=e97]:
                - heading "Hit the monthly minimum and the bonus unlocks." [level=3] [ref=e98]
                - paragraph [ref=e99]: Two qualified recruits a month — or one top producer with 48+ loans — opens your bonus tier. Targets run 5 to 10 a month depending on level, and the first 60 days ask for 3 to ramp up.
            - listitem [ref=e100]:
              - generic [aria-hidden] [ref=e101]: "4"
              - generic [ref=e102]:
                - heading "What each recruit pays you depends on what they were already closing." [level=3] [ref=e103]
                - paragraph [ref=e104]: The bonus per loan officer is set by how many loans they closed in the 12 months before joining, on a published scale. A bigger producer is worth more, which is why sourcing beats volume.
            - listitem [ref=e105]:
              - generic [aria-hidden] [ref=e106]: "5"
              - generic [ref=e107]:
                - heading "The money lands about 75 days after they start — sooner if they produce." [level=3] [ref=e108]
                - paragraph [ref=e109]: A 60-day clock starts the day your recruit is 100% onboarded; the Saturday sweep then picks it up, the Commission Team approves it, and it pays roughly 15 days later. If they close 5 or more loans inside those first 60 days, the wait is skipped and the check is released once the fifth funds.
          - paragraph [ref=e110]: About 90 seconds to read. Everything below is detail, only if you want it.
