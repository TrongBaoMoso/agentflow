            - generic [ref=f11e148]:
              - heading "Trình Tự Thực Hiện" [level=4] [ref=f11e149]
              - list [ref=f11e150]:
                - listitem [ref=f11e151]:
                  - paragraph [ref=f11e152]: "Trường hợp 1: Xác nhận điều kiện về nhà ở để được mua, thuê mua nhà ở xã hội/nhà ở cho lực lượng vũ trang nhân dân (trường hợp chưa có nhà ở thuộc sở hữu của mình)"
                  - paragraph [ref=f11e153]: a) Người kê khai gửi giấy xác nhận điều kiện về nhà ở gửi đến cơ quan có thẩm quyền cấp Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất theo quy định của pháp luật về đất đai tại tỉnh, thành phố trực thuộc trung ương nơi có dự án nhà ở xã hội b) Trong thời hạn 07 ngày, kể từ ngày nhận được giấy đề nghị xác nhận về điều kiện nhà ở, cơ quan có thẩm quyền cấp Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất theo quy định của pháp luật về đất đai tại tỉnh, thành phố trực thuộc trung ương nơi có dự án nhà ở xã hội thực hiện xác nhận.
                - listitem [ref=f11e154]:
                  - paragraph [ref=f11e155]: "Trường hợp 2: Xác nhận điều kiện về nhà ở để được mua, thuê mua nhà ở xã hội/nhà ở cho lực lượng vũ trang nhân dân (trường hợp có nhà ở nhưng diện tích nhà ở bình quân đầu người thấp hơn 15m2 sàn/người)."
                  - paragraph [ref=f11e156]: a) Người kê khai gửi giấy xác nhận điều kiện về nhà ở gửi đến Ủy ban nhân dân cấp xã nơi người kê khai đang cư trú theo hình thức đăng ký thường trú. b) Trong thời hạn 07 ngày, kể từ ngày nhận được đơn đề nghị xác nhận, Ủy ban nhân dân cấp xã thực hiện xác nhận.
                - listitem [ref=f11e157]:
                  - paragraph [ref=f11e158]: "Trường hợp 3: Xác nhận điều kiện vay vốn ưu đãi của Nhà nước thông qua Ngân hàng Chính sách xã hội để hộ gia đình, cá nhân tự xây dựng hoặc cải tạo, sửa chữa nhà ở."
                  - paragraph [ref=f11e159]: a) Người kê khai gửi giấy tờ chứng minh điều kiện vay vốn ưu đãi của Nhà nước thông qua Ngân hàng Chính sách xã hội để hộ gia đình, cá nhân tự xây dựng hoặc cải tạo, sửa chữa nhà ở gửi đến Ủy ban nhân dân cấp xã nơi người kê khai đăng ký thường trú. b) Ủy ban nhân dân cấp xã nơi người kê khai đăng ký thường trú đối chiếu điều kiện để được vay vốn ưu đãi, thực hiện việc xác nhận.
                - listitem [ref=f11e160]:
                  - paragraph [ref=f11e161]: "Trường hợp 4: Xác nhận điều kiện vay vốn ưu đãi của Nhà nước tại tổ chức tín dụng do Nhà nước chỉ định để hộ gia đình, cá nhân tự xây dựng hoặc cải tạo, sửa chữa nhà ở"
                  - paragraph [ref=f11e162]: a) Người kê khai gửi giấy tờ chứng minh điều kiện vay vốn ưu đãi của Nhà nước tại tổ chức tín dụng do Nhà nước chỉ định để hộ gia đình, cá nhân tự xây dựng hoặc cải tạo, sửa chữa nhà ở gửi đến Ủy ban nhân dân cấp xã nơi người kê khai đăng ký thường trú. b) Ủy ban nhân dân cấp xã nơi người kê khai đăng ký thường trú đối chiếu điều kiện để được vay vốn ưu đãi, thực hiện việc xác nhận.
                - listitem [ref=f11e163]:
                  - paragraph [ref=f11e164]: "Trường hợp 5: Xác nhận đối tượng được hưởng chính sách hỗ trợ về nhà ở xã hội (áp dụng cho các đối tượng quy định tại các khoản 9, 10, 11 Điều 76 của Luật Nhà ở và đối tượng quy định tại khoản 5 Điều 76 của Luật Nhà ở không có hợp đồng lao động, không được hưởng lương hưu do cơ quan Bảo hiểm xã hội chi trả)"
                  - paragraph [ref=f11e165]: "a) Người kê khai gửi giấy tờ chứng minh đối tượng gửi đến Ủy ban nhân dân cấp xã nơi người kê khai đăng ký thường trú hoặc tạm trú hoặc nơi ở hiện tại trong trường hợp: đối tượng quy định tại khoản 10 Điều 76 của Luật Nhà ở. b) Ủy ban nhân dân cấp xã nơi người kê khai đăng ký thường trú hoặc tạm trú hoặc nơi ở hiện tại thực hiện việc xác nhận."
                - listitem [ref=f11e166]:
                  - paragraph [ref=f11e167]: "Trường hợp 6: Xác nhận đối tượng, thu nhập để được hưởng chính sách hỗ trợ về nhà ở xã hội (áp dụng cho các đối tượng quy định tại các khoản 5, 6, 8 Điều 76 của Luật Nhà ở, trừ đối tượng quy định tại khoản 5 Điều 76 của Luật Nhà ở không có hợp đồng lao động, không được hưởng lương hưu do cơ quan Bảo hiểm xã hội chi trả)."
                  - paragraph [ref=f11e168]: a) Người kê khai gửi giấy tờ chứng minh đối tượng, thu nhập gửi đến cơ quan Bảo hiểm xã hội hoặc Ủy ban nhân dân cấp xã nơi người kê khai đăng ký thường trú hoặc tạm trú hoặc nơi ở hiện tại. b) Cơ quan Bảo hiểm xã hội hoặc Ủy ban nhân dân cấp xã nơi người kê khai đăng ký thường trú hoặc tạm trú hoặc nơi ở hiện tại thực hiện việc xác nhận.
                - listitem [ref=f11e169]:
                  - paragraph [ref=f11e170]: "Trường hợp 7: Xác nhận điều kiện về thu nhập để được mua, thuê mua nhà ở xã hội (áp dụng cho đối tượng quy định tại khoản 5 Điều 76 của Luật Nhà ở không có hợp đồng lao động, không được hưởng lương hưu do cơ quan Bảo hiểm xã hội chi trả)."
                  - paragraph [ref=f11e171]: a) Người kê khai gửi giấy tờ chứng minh điều kiện về thu nhập để được mua, thuê mua nhà ở xã hội gửi đến Cơ quan Công an cấp xã nơi thường trú hoặc tạm trú hoặc nơi ở hiện tại. b) Trong thời hạn 07 ngày, kể từ ngày nhận được đơn đề nghị xác nhận Cơ quan Công an cấp xã nơi thường trú hoặc tạm trú hoặc nơi ở hiện tại thực hiện việc xác nhận.
