                    - text: Bao (packs)
                    - link [ref=f4e221] [cursor=pointer]:
                      - /url: https://github.com/LoanFactory-Inc/packs/commit/5f3f338399c75141ea65401a93d2e2eb63d00f9b
                      - text: "fix(recruit): bound billable Inkless regenerations per row, strip internal flags from the public body, V2 profile completion builds the agreement (agentflow-90vkj, agentflow-gglqk) (#3627) * fix(recruit): strip internal flags from the public e-sign body and add a per-row regenerate cooldown (agentflow-90vkj) registerSigningAgreement is unauthenticated, yet it passed the raw body to EnsureSigningSessionsRegisterInterestedLoanOfficer, which honours force_regenerate (cancel + a new billable Inkless envelope) and template (an e-mail). Anyone with a row key could loop it. - WebPlusAPI.registerSigningAgreement strips force_regenerate, template, task_try and trailing_regenerate before calling the op. - Per-row cooldown on FORCED regenerates (IloRegenerateCooldown), anchored on AgreementState.last_forced_regenerate_at (datastore, not memcache). System property ilo_esign_regenerate_cooldown_minutes, default 10, invalid/<1 falls back to 10, capped at 1440. Logs carry the row key and reason only. - queued (afterSave) callers: held back, ONE trailing rebuild queued. - in-request callers (GWT \"Re-generate e-sign documents\"): refused with an error, envelope and e-mail untouched. - bypass: RebuildIloAgreementTask (Recruit explicit send, own cooldown), and EnsureSigningSessionsRequestNewLOAgreement (never reads the flag). - a dead envelope (rejected/expired/missing doc) is still rebuilt. - Tests use a stub for every Inkless seam; Inkless is never called. Co-Authored-By: Claude Opus 5.5 (1M context)"
                      - generic [ref=f4e222]:
                        - text: "* fix(recruit): V2 profile completion builds the agreement; compare rebuild inputs by value (agentflow-gglqk) - RECRUIT_V2 row: completed_detail_form flipping to true with no envelope queues the same unforced build registerSigningAgreement does, deferred 60 s. The keyless email-dedupe submit never calls registerSigningAgreement, so the sign step was dead. Idempotent with the keyed path: whichever runs second finds the envelope and reuses it. - V2 rebuild inputs: states/sponsor_states compared as sets, \"\" equals null (street2, legal names), so an identical step-0 resubmit queues no billable regenerate. - Legacy rows: unchanged (same triggers, same ordered compare). Co-Authored-By: Claude Opus 5.5 (1M context)"
                        - generic [ref=f4e223]:
                          - text: "* fix(recruit): cool down every new Inkless envelope on public and automatic paths, not only forced ones (agentflow-90vkj) Security review of #3627 (HIGH): the public keyed registerLoanOfficer can toggle CA in sponsor_states, which changes the required documents, and registerSigningAgreement then rebuilds WITHOUT force, past a cooldown that only gated forced calls. One billable envelope per toggle. - One gate after resolveDecision: every Inkless FRESH_SEND/REGENERATE, forced or not, dead envelope included, is held inside the window for QUEUED (afterSave, V2 completion, trailing) and PUBLIC callers (any API route incl. execute/{op} and registerSigningAgreement, or no login). Held: nothing is touched, the caller gets the current link, ONE trailing rebuild is queued. A public force is not trusted (trailing unforced). - Exempt (legacy desk unchanged): STAFF, i.e. a logged-in GWT RemoteCall (no API platform + a session user), and Recruit's explicit send. The admin \"Request new LO agreement\" op keeps its own path. All of them open the window (recordEnvelopeSent), so a public call right after waits. - Repo Owner review: the window opens only after a SUCCESSFUL send; the trailing task gives up when an envelope was sent after its latest hold (no identical double send after an explicit send restarts the window), and takes its force from the held state. - Tests: public CA toggle burst = 1 envelope + 1 trailing (red without the fix: 4 envelopes), staff exempt + starts the window, API route with a login is still public, trailing gives up after a later send, failed send opens no window. Co-Authored-By: Claude Opus 5.5 (1M context)"
                          - generic [ref=f4e224]:
                            - text: "* fix(recruit): cool down public \"Request new LO agreement\" calls; expire lost trailing reservations (agentflow-90vkj) Security re-review of #3627: the anonymous WebPlus execute/{op} route runs EnsureSigningSessionsRequestNewLOAgreement with no login, and that op was fully exempt from the cooldown while taking its required documents from the request body. A caller could make the envelope look stale and get a new billable envelope (plus an admin e-mail) per call. - Public caller (not isStaffRequest): documents come from the stored row, never the body, and a rebuild inside the window is held exactly like a public call to the Register op (one unforced trailing rebuild, nothing touched, no admin e-mail). Staff: unchanged. - Repo Owner review: a trailing reservation past its due time plus a 2-min grace is stale, so a lost trailing task (gave up after lock contention, or a purged queue) no longer blocks every later hold for that row. - No auth added; execute/{op} is untouched. Co-Authored-By: Claude Opus 5.5 (1M context)"
                            - generic [ref=f4e225]:
                              - text: "* fix(recruit): public RequestNewLOAgreement holds without a trailing rebuild; trailing rebuilds only for loan officer rows (agentflow-90vkj) Repo Owner review of 1acb476: a held public RequestNewLOAgreement queued a trailing rebuild of the REGISTER op for the same key. That op also serves Admin rows (HR agreements, MOSO BrokerMembersView), and the Register op files INTERESTED_LO_AGREEMENT sessions, so two anonymous calls on an Admin key would have sent the employee an unrequested, billable LO envelope. - The public RequestNewLOAgreement path holds WITHOUT queuing a trailing rebuild (an anonymous caller never needs one). - queueTrailingRebuild skips any key that is not a LORecruiting row. - Tests: two public calls on an Admin key send once and queue no Register task; a held Register-op call on an Admin key queues nothing. Co-Authored-By: Claude Opus 5.5 (1M context)"
                              - generic [ref=f4e226]:
